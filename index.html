<!DOCTYPE html>
<html lang="id"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Kunci Mode Terang (Light Mode Only) walau perangkat pengguna memakai Mode Gelap -->
    <meta name="color-scheme" content="light only">
    <meta name="supported-color-schemes" content="light">
    <title>Zeniopost - Portal Berita Digital</title>

    <!-- Meta Data WhatsApp/Social Media Preview -->
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="Zeniopost">
    <meta property="og:url" content="https://zeniopost.vercel.app/" id="og-url">
    <meta property="og:title" content="Zeniopost - Portal Berita Digital" id="og-title">
    <meta property="og:description" content="Platform berita digital terpercaya dari masyarakat untuk masyarakat." id="og-desc">
    <meta property="og:image" content="https://res.cloudinary.com/dtz0urit6/image/upload/w_1200,h_630,c_pad,b_white,f_jpg,q_auto:good/cloudinary-tools-uploads/h5nux7dooatoayqdlpng.jpg" id="og-image">
    <meta property="og:image:secure_url" content="https://res.cloudinary.com/dtz0urit6/image/upload/w_1200,h_630,c_pad,b_white,f_jpg,q_auto:good/cloudinary-tools-uploads/h5nux7dooatoayqdlpng.jpg" id="og-image-secure">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">

    <!-- Favicon & Preload Logo Utama -->
    <link rel="icon" id="site-favicon" type="image/jpeg" href="https://res.cloudinary.com/dtz0urit6/image/upload/q_auto:best,f_jpg/cloudinary-tools-uploads/h5nux7dooatoayqdlpng">
    <link rel="preload" as="image" href="https://res.cloudinary.com/dtz0urit6/image/upload/q_auto:best,f_jpg/cloudinary-tools-uploads/h5nux7dooatoayqdlpng">

    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- PWA Manifest dinamis via Data URI -->
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22Zeniopost%20Portal%22%2C%22short_name%22%3A%22Zeniopost%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f4f7fb%22%2C%22theme_color%22%3A%22%23ffffff%22%7D">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        *, *::before, *::after {
            box-sizing: border-box;
        }
        :root, html {
            color-scheme: light only !important;
            background-color: #f4f7fb !important;
            color: #1e293b !important;
            overflow-x: clip !important;
            width: 100% !important;
            max-width: 100% !important;
            -webkit-text-size-adjust: 100%;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f7fb !important;
            color: #1e293b !important;
            color-scheme: light only !important;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
            overflow-x: clip !important;
            width: 100% !important;
            max-width: 100% !important;
            position: relative;
        }
        #zeniopost-app-shell, #app, #main-content {
            width: 100%;
            max-width: 100%;
            min-width: 0;
            overflow-x: clip;
        }
        #zeniopost-app-shell {
            min-height: 100vh;
            background-color: #f4f7fb;
            position: relative;
            z-index: 999;
        }
        input, textarea, select {
            background-color: #f8fafc !important;
            color: #0f172a !important;
            color-scheme: light only !important;
            max-width: 100%;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .glass-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.7);
        }
        .hover-scale { transition: transform 0.25s ease, box-shadow 0.25s ease; }
        .hover-scale:hover { transform: translateY(-4px); box-shadow: 0 12px 24px -8px rgba(15, 23, 42, 0.12); }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        .animate-fade { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        /* Styling Rich Text Editor Berita Lengkap */
        .rich-editor {
            background-color: #ffffff !important;
            color: #0f172a !important;
            word-break: break-word;
            overflow-wrap: break-word;
            line-height: 1.5;
        }
        .rich-editor:empty:before {
            content: attr(data-placeholder);
            color: #94a3b8;
            pointer-events: none;
            display: block;
        }
        .rich-editor b, .rich-editor strong, .article-rich-content b, .article-rich-content strong { font-weight: 800; }
        .rich-editor i, .rich-editor em, .article-rich-content i, .article-rich-content em { font-style: italic; }
        .rich-editor u, .article-rich-content u { text-decoration: underline; }
        .rich-editor h1, .article-rich-content h1 { font-size: 1.55rem; font-weight: 800; line-height: 1.3; margin: 0.45rem 0 0.25rem; color: #0f172a; }
        .rich-editor h2, .article-rich-content h2 { font-size: 1.3rem; font-weight: 800; line-height: 1.35; margin: 0.4rem 0 0.2rem; color: #0f172a; }
        .rich-editor h3, .article-rich-content h3 { font-size: 1.12rem; font-weight: 700; line-height: 1.4; margin: 0.35rem 0 0.2rem; color: #1e293b; }
        .rich-editor blockquote, .article-rich-content blockquote {
            border-left: 4px solid #2563eb;
            background: #eff6ff;
            padding: 0.55rem 0.9rem;
            margin: 0.4rem 0;
            border-radius: 0 0.75rem 0.75rem 0;
            font-style: italic;
            color: #1e3a8a;
        }
        .rich-editor a, .article-rich-content a {
            color: #2563eb;
            text-decoration: underline;
            font-weight: 600;
        }
        .rich-editor ul, .article-rich-content ul { list-style-type: disc; padding-left: 1.5rem; margin: 0.3rem 0; }
        .rich-editor ol, .article-rich-content ol { list-style-type: decimal; padding-left: 1.5rem; margin: 0.3rem 0; }
        .rich-editor li, .article-rich-content li { margin-bottom: 0.08rem; line-height: inherit; }
        .rich-editor p, .rich-editor div, .article-rich-content p, .article-rich-content div { margin: 0 !important; padding: 0; line-height: inherit; }
        /* Spasi paragraf baru (Enter 2x) dirapatkan menjadi 0.35em agar proporsional */
        .rich-editor div:has(> br:only-child),
        .rich-editor p:has(> br:only-child),
        .rich-editor .zp-para-spacer,
        .article-rich-content div:has(> br:only-child),
        .article-rich-content p:has(> br:only-child),
        .article-rich-content .zp-para-spacer {
            display: block;
            height: 0.35em !important;
            min-height: 0 !important;
            line-height: 0.35em !important;
            font-size: 0.35em !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-[#f4f7fb] text-slate-800 antialiased min-h-screen flex flex-col">

    <div id="zeniopost-app-shell" class="flex flex-col min-h-screen w-full relative">
        <div id="app" class="flex flex-col min-h-screen w-full relative">
            <!-- Render utama oleh JavaScript -->
        </div>
    </div>

    <!-- Container Modal & Animasi -->
    <div id="modal-container" class="fixed inset-0 z-[1100] items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 overflow-y-auto hidden"></div>
    <div id="loading-overlay" class="fixed inset-0 z-[1300] items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4 hidden">
        <div class="bg-white rounded-3xl px-7 py-6 shadow-2xl border border-slate-100 flex flex-col items-center gap-3.5 max-w-xs w-full text-center animate-fade">
            <div class="w-12 h-12 rounded-full border-4 border-blue-100 border-t-blue-600 animate-spin"></div>
            <div id="loading-overlay-text" class="text-xs sm:text-sm font-extrabold text-slate-800">Memproses data...</div>
        </div>
    </div>
    <div id="toast-container" class="fixed top-24 right-4 z-[1200] flex flex-col gap-2 pointer-events-none"></div>

    <script type="module">
        const swCode = `self.addEventListener('install', e => e.waitUntil(self.skipWaiting())); self.addEventListener('activate', e => e.waitUntil(self.clients.claim())); self.addEventListener('fetch', e => {});`;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        if ('serviceWorker' in navigator) navigator.serviceWorker.register(URL.createObjectURL(blob));

        const IS_PREVIEW = false;
        const DB_URL = "https://zwezerwhvqsauohbfxkq.supabase.co";
        const DB_ANON_KEY = "sb_publishable_6wEL_RA1TIkENs1ZAyqtCg_1L5GjjjW";
        const DEFAULT_LOGO_URL = "https://res.cloudinary.com/dtz0urit6/image/upload/q_auto:best,f_jpg/cloudinary-tools-uploads/h5nux7dooatoayqdlpng";
        const PAGE_SIZE = 6;

        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
        const dbClient = IS_PREVIEW ? null : createClient(DB_URL, DB_ANON_KEY);

        const savedCustomLogo = localStorage.getItem('zeniopost_custom_logo_url');
        const initialLogoUrl = (savedCustomLogo && !savedCustomLogo.includes('gyiscmvuxv4olklenjcg')) ? savedCustomLogo : DEFAULT_LOGO_URL;

        const appState = {
            view: 'home',
            activeTopicId: null,
            visibleCount: PAGE_SIZE,
            articles: [],
            topics: [],
            comments: [],
            zpUsers: [],
            passwordResets: [],
            savedArticles: [],
            messages: [],
            user: null,
            currentUser: JSON.parse(localStorage.getItem('zeniopost_current_user') || 'null'),
            accountTab: 'login',
            userDashTab: 'overview',
            showForgotForm: false,
            adminTab: 'articles',
            activeAdminChatUserId: null,
            editingDraftId: null,
            readArticle: null,
            searchQuery: '',
            filterDate: '',
            localViewsMap: {},
            countedInOpen: null,
            hasDynamicShare: false,
            logoUrl: initialLogoUrl,
            logoHeightMobile: Math.max(48, Number(localStorage.getItem('zeniopost_logo_h_mobile')) || 52),
            logoHeightDesktop: Math.max(62, Number(localStorage.getItem('zeniopost_logo_h_desktop')) || 66),
            likedCommentIds: JSON.parse(localStorage.getItem('zeniopost_liked_comments') || '[]'),
            localCommentLikesMap: JSON.parse(localStorage.getItem('zeniopost_comment_likes_map') || '{}')
        };

        const getLogoUrl = () => appState.logoUrl || DEFAULT_LOGO_URL;
        const getLogoFallbackUrl = () => "https://wsrv.nl/?url=" + encodeURIComponent(getLogoUrl()) + "&output=jpg";

        window.showLoading = (msg = 'Memproses data...') => {
            const el = document.getElementById('loading-overlay');
            const txt = document.getElementById('loading-overlay-text');
            if (txt) txt.textContent = msg;
            if (el) { el.classList.remove('hidden'); el.classList.add('flex'); }
        };

        window.hideLoading = () => {
            const el = document.getElementById('loading-overlay');
            if (el) { el.classList.add('hidden'); el.classList.remove('flex'); }
        };

        window.togglePasswordVisibility = (inputId, iconId) => {
            const inp = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (!inp) return;
            if (inp.type === 'password') {
                inp.type = 'text';
                if (icon) icon.className = 'fas fa-eye-slash text-blue-600';
            } else {
                inp.type = 'password';
                if (icon) icon.className = 'fas fa-eye text-slate-400';
            }
        };

        const showToast = (msg, type = 'info') => {
            const cont = document.getElementById('toast-container');
            if (!cont) return;
            const el = document.createElement('div');
            el.className = `p-4 rounded-2xl shadow-lg text-white font-bold text-xs md:text-sm pointer-events-auto transition-all flex items-center gap-2 max-w-sm ${type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-blue-600'}`;
            el.innerHTML = msg;
            cont.appendChild(el);
            setTimeout(() => el.remove(), 3800);
        };

        const formatWaktu = (iso) => {
            if (!iso) return '-';
            const d = new Date(iso);
            const tgl = d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
            const jam = d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }).replace('.', ':');
            return `${tgl} • ${jam} WITA`;
        };

        const getLocalDateString = (iso) => {
            if (!iso) return '';
            const d = new Date(iso);
            if (isNaN(d.getTime())) return '';
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        };

        const formatLabelTanggal = (ymd, shortMonth = false) => {
            if (!ymd) return '';
            const parts = ymd.split('-');
            if (parts.length !== 3) return ymd;
            return new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2])).toLocaleDateString('id-ID', {
                day: 'numeric',
                month: shortMonth ? 'short' : 'long',
                year: 'numeric'
            });
        };

        const stripHtml = (rawHtml) => {
            if (!rawHtml) return '';
            const withSpaces = String(rawHtml).replace(/<br\s*\/?>/gi, ' ').replace(/<\/(p|div|li|h[1-6]|blockquote)>/gi, ' ');
            const temp = document.createElement('div');
            temp.innerHTML = withSpaces;
            return (temp.textContent || temp.innerText || '').replace(/\s+/g, ' ').trim();
        };

        const sanitizeAndFormatArticleHtml = (rawContent) => {
            if (!rawContent) return '';
            const str = String(rawContent);
            if (!/<\/?[a-z][\s\S]*>/i.test(str)) {
                return `<div class="whitespace-pre-wrap">${str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</div>`;
            }
            const temp = document.createElement('div');
            temp.innerHTML = str;
            temp.querySelectorAll('script, iframe, object, embed, style, link, meta').forEach(el => el.remove());
            temp.querySelectorAll('*').forEach(el => {
                Array.from(el.attributes).forEach(attr => {
                    if (attr.name.toLowerCase().startsWith('on') || (attr.name.toLowerCase() === 'href' && attr.value.trim().toLowerCase().startsWith('javascript:'))) {
                        el.removeAttribute(attr.name);
                    }
                });
                if (el.tagName === 'A') { el.setAttribute('target', '_blank'); el.setAttribute('rel', 'noopener noreferrer'); }
                if ((el.tagName === 'DIV' || el.tagName === 'P') && el.innerHTML.trim().toLowerCase() === '<br>') {
                    el.classList.add('zp-para-spacer');
                }
            });
            return `<div class="article-rich-content">${temp.innerHTML}</div>`;
        };

        const prepareInitialEditorHtml = (rawContent) => {
            if (!rawContent) return '';
            const str = String(rawContent);
            if (/<\/?[a-z][\s\S]*>/i.test(str)) return str;
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
        };

        const validateProfileImageDimensions = (file) => {
            return new Promise((resolve, reject) => {
                if (!file) return reject(new Error('Pilih file foto terlebih dahulu.'));
                if (!file.type.startsWith('image/')) return reject(new Error('File harus berupa gambar (JPG/PNG/WebP).'));
                if (file.size > 1024 * 1024) return reject(new Error('Ukuran foto profil melebihi batas maksimal 1 MB!'));
                const img = new Image();
                const objectUrl = URL.createObjectURL(file);
                img.onload = () => { URL.revokeObjectURL(objectUrl); resolve(true); };
                img.onerror = () => { URL.revokeObjectURL(objectUrl); reject(new Error('Gagal membaca file gambar.')); };
                img.src = objectUrl;
            });
        };

        const uploadFileMedia = async (fileInputId, folderPrefix = 'articles') => {
            const inputEl = document.getElementById(fileInputId);
            const file = inputEl?.files?.[0];
            if (!file) return null;
            if (IS_PREVIEW) {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = e => resolve(e.target.result);
                    reader.readAsDataURL(file);
                });
            }
            const ext = file.name.split('.').pop();
            const filename = `${folderPrefix}_${Date.now()}_${Math.random().toString(36).substring(2, 10)}.${ext}`;
            const { error } = await dbClient.storage.from('news-images').upload(filename, file);
            if (error) throw error;
            const { data } = dbClient.storage.from('news-images').getPublicUrl(filename);
            return data.publicUrl;
        };

        const renderRichTextEditor = (editorId, placeholder = 'Tulis isi berita...', initialContent = '', minHeightClass = 'min-h-[220px]') => {
            const safeInitial = prepareInitialEditorHtml(initialContent);
            return `
                <div class="border border-slate-200 rounded-2xl overflow-hidden bg-white focus-within:border-blue-500 focus-within:ring-2 focus-within:ring-blue-500/15 transition">
                    <div class="flex flex-wrap items-center gap-1 p-2 bg-slate-100/95 border-b border-slate-200 text-slate-700 select-none">
                        <button type="button" onmousedown="event.preventDefault()" onclick="window.formatEditorText('${editorId}', 'bold')" title="Tebal" class="w-8 h-8 rounded-lg hover:bg-white hover:text-blue-600 flex items-center justify-center text-xs font-extrabold"><i class="fas fa-bold"></i></button>
                        <button type="button" onmousedown="event.preventDefault()" onclick="window.formatEditorText('${editorId}', 'italic')" title="Miring" class="w-8 h-8 rounded-lg hover:bg-white hover:text-blue-600 flex items-center justify-center text-xs"><i class="fas fa-italic"></i></button>
                        <button type="button" onmousedown="event.preventDefault()" onclick="window.formatEditorText('${editorId}', 'underline')" title="Garis Bawah" class="w-8 h-8 rounded-lg hover:bg-white hover:text-blue-600 flex items-center justify-center text-xs"><i class="fas fa-underline"></i></button>
                        <span class="w-px h-5 bg-slate-300 mx-0.5"></span>
                        <button type="button" onmousedown="event.preventDefault()" onclick="window.formatEditorHeading('${editorId}', 'H2')" title="Subjudul Besar" class="px-2 h-8 rounded-lg hover:bg-white hover:text-blue-600 text-[11px] font-extrabold">H2</button>
                        <button type="button" onmousedown="event.preventDefault()" onclick="window.formatEditorHeading('${editorId}', 'H3')" title="Subjudul Kecil" class="px-2 h-8 rounded-lg hover:bg-white hover:text-blue-600 text-[11px] font-extrabold">H3</button>
                        <button type="button" onmousedown="event.preventDefault()" onclick="window.formatEditorHeading('${editorId}', 'P')" title="Teks Normal" class="px-2 h-8 rounded-lg hover:bg-white hover:text-blue-600 text-[11px] font-bold">Teks</button>
                        <span class="w-px h-5 bg-slate-300 mx-0.5"></span>
                        <button type="button" onmousedown="event.preventDefault()" onclick="window.formatEditorText('${editorId}', 'justifyLeft')" title="Rata Kiri" class="w-8 h-8 rounded-lg hover:bg-white hover:text-blue-600 flex items-center justify-center text-xs"><i class="fas fa-align-left"></i></button>
                        <button type="button" onmousedown="event.preventDefault()" onclick="window.formatEditorText('${editorId}', 'justifyCenter')" title="Rata Tengah" class="w-8 h-8 rounded-lg hover:bg-white hover:text-blue-600 flex items-center justify-center text-xs"><i class="fas fa-align-center"></i></button>
                        <button type="button" onmousedown="event.preventDefault()" onclick="window.formatEditorText('${editorId}', 'justifyRight')" title="Rata Kanan" class="w-8 h-8 rounded-lg hover:bg-white hover:text-blue-600 flex items-center justify-center text-xs"><i class="fas fa-align-right"></i></button>
                        <button type="button" onmousedown="event.preventDefault()" onclick="window.formatEditorText('${editorId}', 'justifyFull')" title="Rata Kanan-Kiri" class="w-8 h-8 rounded-lg hover:bg-white hover:text-blue-600 flex items-center justify-center text-xs"><i class="fas fa-align-justify"></i></button>
                        <span class="w-px h-5 bg-slate-300 mx-0.5"></span>
                        <button type="button" onmousedown="event.preventDefault()" onclick="window.formatEditorText('${editorId}', 'insertOrderedList')" title="Daftar Nomor" class="w-8 h-8 rounded-lg hover:bg-white hover:text-blue-600 flex items-center justify-center text-xs"><i class="fas fa-list-ol"></i></button>
                        <button type="button" onmousedown="event.preventDefault()" onclick="window.formatEditorText('${editorId}', 'insertUnorderedList')" title="Daftar Poin" class="w-8 h-8 rounded-lg hover:bg-white hover:text-blue-600 flex items-center justify-center text-xs"><i class="fas fa-list-ul"></i></button>
                    </div>
                    <div id="${editorId}" contenteditable="true" data-placeholder="${placeholder.replace(/"/g, '&quot;')}" class="rich-editor w-full p-3.5 ${minHeightClass} max-h-[400px] overflow-y-auto text-sm md:text-base outline-none">${safeInitial}</div>
                </div>
            `;
        };

        window.formatEditorText = (editorId, command, value = null) => {
            const editor = document.getElementById(editorId);
            if (!editor) return;
            editor.focus();
            document.execCommand(command, false, value);
        };

        window.formatEditorHeading = (editorId, tag) => {
            const editor = document.getElementById(editorId);
            if (!editor) return;
            editor.focus();
            document.execCommand('formatBlock', false, `<${tag}>`);
        };

        const getRichEditorContent = (editorId) => {
            const editor = document.getElementById(editorId);
            if (!editor) return { html: '', text: '' };
            return { html: editor.innerHTML.trim(), text: stripHtml(editor.innerHTML) };
        };

        const fetchData = async () => {
            if (IS_PREVIEW) return;
            try {
                const { data: tData } = await dbClient.from('topics').select('*').order('created_at');
                appState.topics = tData || [];

                const { data: aData } = await dbClient.from('articles').select('*').order('created_at', { ascending: false });
                appState.articles = aData || [];

                const { data: cData } = await dbClient.from('comments').select('*').order('created_at', { ascending: false });
                appState.comments = cData || [];

                const { data: uData } = await dbClient.from('zp_users').select('*').order('created_at', { ascending: false });
                if (uData) {
                    appState.zpUsers = uData;
                    if (appState.currentUser) {
                        const refreshed = uData.find(u => String(u.id) === String(appState.currentUser.id));
                        if (!refreshed || refreshed.status === 'rejected') {
                            appState.currentUser = null;
                            localStorage.removeItem('zeniopost_current_user');
                            showToast('Akun Anda telah dinonaktifkan atau dihapus oleh Admin.', 'error');
                        } else {
                            appState.currentUser = refreshed;
                            localStorage.setItem('zeniopost_current_user', JSON.stringify(refreshed));
                        }
                    }
                } else if (appState.currentUser) {
                    // Jika data zp_users gagal dimuat atau user dihapus dari tabel
                    appState.currentUser = null;
                    localStorage.removeItem('zeniopost_current_user');
                }

                    if (sData) {

        const getArticleViews = (article) => {

        const recordArticleView = async (articleId) => {
            if (!articleId) return;
            const idStr = String(articleId);
            const target = appState.articles.find(x => String(x.id) === idStr);
            if (!target) return;
            const nextViews = getArticleViews(target) + 1;
            target.views = nextViews;
            appState.localViewsMap[idStr] = nextViews;
            if (!IS_PREVIEW && dbClient) {
                try {
                    const { error: rpcError } = await dbClient.rpc('increment_article_views', { art_id: articleId });
                    if (rpcError) await dbClient.from('articles').update({ views: nextViews }).eq('id', articleId);
                } catch (e) {}
            }
        };

        const getRecommendedArticles = (currentArticle, limit = 3) => {
            if (!currentArticle) return [];
            const candidates = appState.articles.filter(a => a.status === 'approved' && String(a.id) !== String(currentArticle.id));
            if (candidates.length === 0) return [];
            const currentWords = new Set(`${currentArticle.title || ''} ${stripHtml(currentArticle.content || '')}`.toLowerCase().split(/[^a-z0-9]+/).filter(w => w.length > 3));
            const scored = candidates.map(item => {
                let score = String(item.topic_id) === String(currentArticle.topic_id) ? 50 : 0;
                `${item.title || ''} ${stripHtml(item.content || '')}`.toLowerCase().split(/[^a-z0-9]+/).forEach(w => { if (currentWords.has(w)) score += 2; });
                return { item, score };
            });
            scored.sort((a, b) => b.score - a.score || getArticleViews(b.item) - getArticleViews(a.item));
            return scored.slice(0, limit).map(s => s.item);

        // --- SISTEM PENULIS (MENGGUNAKAN user_id UNTUK MENCEGAH KLAIM ARTIKEL KARENA KESAMAAN NAMA) ---

        // --- KOMENTAR & CHAT ADMIN ---
        const parseCommentMeta = (c) => {
            let rawContent = c?.content || '', parentId = c?.parent_id ? String(c.parent_id) : null, replyToName = '', commentUserId = null;
            const uidMatch = rawContent.match(/^\[UID:([^\]]+)\]\s*/);
            if (uidMatch) { commentUserId = uidMatch[1].trim(); rawContent = rawContent.slice(uidMatch[0].length); }
            const replyMatch = rawContent.match(/^\[REPLY:([^:\]]+):([^\]]*)\]\s*/);
            if (replyMatch) { if (!parentId) parentId = String(replyMatch[1]); replyToName = replyMatch[2] || ''; rawContent = rawContent.slice(replyMatch[0].length); }
            let matchedUser = null;
            if (!c?.is_anonymous) {
                if (commentUserId) matchedUser = appState.zpUsers.find(u => String(u.id) === String(commentUserId));
                if (!matchedUser && c?.author_name && c.author_name.toLowerCase() !== 'anonim') matchedUser = appState.zpUsers.find(u => (u.full_name || '').toLowerCase() === c.author_name.toLowerCase());

            return { ...c, cleanContent: rawContent, parsedParentId: parentId, replyToName, matchedUser };

            const safeDisplayName = displayName.replace(/'/g, "\\'").replace(/"/g, '&quot;');
            const likeCount = getCommentLikes(c), liked = isCommentLiked(c.id);
            const replies = allComments.filter(r => String(r.parsedParentId) === String(c.id)).sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
            const loggedUser = appState.currentUser;

            return `

                            <div>

        const renderArticleFormBlock = (isPersonalPublish = false) => `

                        ${visibleList.length === 0 ? `<div class="text-center p-12 bg-white rounded-3xl border border-slate-100 text-slate-400 font-bold">Belum ada berita.</div>` : `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 sm:gap-6 w-full min-w-0">${visibleList.map(a => renderArticleCard(a)).join('')}</div>`}

                                <div class="px-5 sm:px-8 pb-6 pt-0 relative flex flex-col sm:flex-row sm:items-end justify-between gap-5 -mt-12 sm:-mt-14">

                                        <div class="relative inline-block self-start">${u.avatar_url ? `<img src="${u.avatar_url}" class="w-24 h-24 sm:w-28 sm:h-28 rounded-3xl aspect-square object-cover border-4 border-white shadow-md bg-white">` : `<div class="w-24 h-24 sm:w-28 sm:h-28 rounded-3xl bg-blue-600 text-white flex items-center justify-center text-4xl font-extrabold border-4 border-white shadow-md">${(u.full_name || 'U').charAt(0).toUpperCase()}</div>`}</div>

                                    </div>
                                    <div class="flex flex-wrap items-center gap-2">

                                        <button onclick="window.switchUserDashTab('publish')" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-extrabold px-4 py-2.5 rounded-xl shadow-sm"><i class="fas fa-plus-circle"></i> Publikasi Baru</button>

                                </div>
                                <div class="px-5 sm:px-8 border-t border-slate-100 bg-slate-50/50 flex items-center gap-1.5 overflow-x-auto no-scrollbar py-2.5">

                                    <button onclick="window.switchUserDashTab('publish')" class="shrink-0 px-4 py-2 rounded-xl text-xs font-extrabold transition ${appState.userDashTab === 'publish' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-600 hover:bg-white'}"><i class="fas fa-feather-pointed"></i> Tulis & Publikasi</button>

                                </div>
                            </div>

                                <div class="bg-white rounded-3xl p-5 sm:p-8 shadow-sm border border-slate-100 space-y-5">
                                    <h3 class="text-lg sm:text-xl font-extrabold text-slate-900 flex items-center gap-2"><i class="fas fa-feather-pointed text-blue-600"></i> Publikasi Berita Pribadi</h3>
                                    ${renderArticleFormBlock(true)}
                                </div>
                            ` : appState.userDashTab === 'drafts' ? `

                                            <input type="file" id="a_image" accept="image/*" required class="w-full text-xs bg-white p-2 rounded-xl">
                                            ${renderRichTextEditor('a_content', 'Isi berita resmi...', '', 'min-h-[140px]')}
                                            <input type="text" id="a_social" placeholder="Media Sosial" class="w-full p-3 bg-white rounded-xl text-xs font-bold border outline-none">
                                            <button type="submit" class="w-full bg-blue-600 text-white font-extrabold py-3 rounded-xl text-xs">Terbitkan</button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        `}
                    </div>
                `;
            }

            return '';
        };

        const renderApp = () => {
            const root = document.getElementById('app');
            if (!root) return;
            root.innerHTML = `${renderHeader()}<div class="flex w-full max-w-full overflow-x-hidden min-h-[calc(100vh-80px)] md:min-h-[calc(100vh-96px)]">${renderNav()}<main id="main-content" class="flex-1 min-w-0 w-full max-w-full overflow-x-hidden md:ml-64 pb-24 md:pb-12 relative">${buildMainContent()}</main></div>`;
        };

        document.getElementById('modal-container').addEventListener('click', () => window.closeModal());

        const init = async () => {
            appState.view = 'home'; renderApp();
            window.showLoading('Memuat berita...');
            try {
                if (!IS_PREVIEW && dbClient) {
                    const { data } = await dbClient.auth.getSession();
                    appState.user = data.session?.user || null;
                }
                await fetchData();
                const params = new URLSearchParams(window.location.search);
                const sharedArticleId = params.get('article');
                if (sharedArticleId) {
                    const found = appState.articles.find(x => String(x.id) === String(sharedArticleId));
                    if (found) { app.navigate('article', found); return; }
                }
                renderApp();
            } finally { window.hideLoading(); }
        };

        init();
    </script>
</body>
</html>
