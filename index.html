                        <div class="text-xs font-bold text-slate-500">Oleh: <span class="text-slate-900">${authorName}</span> • ${formatWaktu(new Date().toISOString())}</div>
                        <div class="pt-3 border-t border-slate-100 text-slate-700 leading-relaxed">${sanitizeAndFormatArticleHtml(editorData.html || '<p><i>Belum ada isi teks berita...</i></p>')}</div>
                    </div>
                </div>
            `;
        };

        window.closeModal = () => {
            const modal = document.getElementById('modal-container');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            modal.innerHTML = '';
        };

        // =====================================================================
        // 13. NAVIGASI UTAMA & FILTER HORIZONTAL / MUAT LEBIH BANYAK
        // =====================================================================
        window.app = {
            navigate: (view, data = null) => {
                // Kunci navigasi ke menu Simpan Berita apabila tamu belum login
                if (view === 'saved' && !appState.currentUser) {
                    showToast('<i class="fas fa-lock mr-1.5"></i> Daftar Berita Tersimpan hanya untuk pengguna terdaftar. Silakan masuk terlebih dahulu!', 'error');
                    appState.view = 'account';
                    appState.accountTab = 'login';
                    renderApp();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    return;
                }

                appState.view = view;
                appState.visibleCount = PAGE_SIZE;

                if (view === 'article') {
                    const found = typeof data === 'string' ? appState.articles.find(x => String(x.id) === String(data)) : data;
                    appState.readArticle = found || null;
                    if (found) {
                        updateMetaTags(found);
                        safeUpdateHistory(found.id, found.title);
                    }
                } else if (view === 'topics') {
                    appState.activeTopicId = data;
                    safeUpdateHistory(null, 'Zeniopost');
                } else if (view === 'chat' && appState.currentUser) {
                    markMessagesAsRead(appState.currentUser.id, 'user');
                } else {
                    appState.readArticle = null;
                    safeUpdateHistory(null, 'Zeniopost');
                }
                renderApp();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            },
            selectHorizontalTopic: (topicId) => {
                appState.activeTopicId = topicId || null;
                appState.visibleCount = PAGE_SIZE;
                renderApp();
            },
            loadMoreArticles: () => {
                appState.visibleCount += PAGE_SIZE;
                renderApp();
            },
            logout: async () => {
                if (!IS_PREVIEW && dbClient) await dbClient.auth.signOut();
                appState.user = null;
                app.navigate('home');
                showToast('Admin telah keluar.', 'success');
            }
        };

        window.handleSearch = (val) => {
            appState.searchQuery = val || '';
            appState.visibleCount = PAGE_SIZE;
            if (!['home', 'trending', 'topics', 'saved'].includes(appState.view)) appState.view = 'home';
            const mainEl = document.getElementById('main-content');
            if (mainEl) mainEl.innerHTML = buildMainContent();
        };

        window.clearSearch = () => {
            appState.searchQuery = '';
            renderApp();
        };

        window.handleDateFilter = (val) => {
            appState.filterDate = val || '';
            appState.visibleCount = PAGE_SIZE;
            if (!['home', 'trending', 'topics', 'saved'].includes(appState.view)) appState.view = 'home';
            renderApp();
        };

        window.clearDateFilter = () => {
            appState.filterDate = '';
            renderApp();
        };

        window.previewImageUpload = (event, elId, wrapId = null) => {
            const f = event.target.files?.[0];
            const el = document.getElementById(elId);
            const wrap = wrapId ? document.getElementById(wrapId) : null;
            if (f && el) {
                const r = new FileReader();
                r.onload = e => {
                    el.style.backgroundImage = `url('${e.target.result}')`;
                    el.classList.remove('hidden');
                    if (wrap) wrap.classList.remove('hidden');
                };
                r.readAsDataURL(f);
            }
        };

        // Tombol X (Batal) untuk Membatalkan Unggah Gambar Berita
        window.clearImageUpload = (inputId, previewId = null, wrapId = null) => {
            const inp = document.getElementById(inputId);
            if (inp) inp.value = '';
            if (previewId) {
                const el = document.getElementById(previewId);
                if (el) {
                    el.style.backgroundImage = '';
                    el.classList.add('hidden');
                }
            }
            if (wrapId) {
                const w = document.getElementById(wrapId);
                if (w) w.classList.add('hidden');
            }
        };

        window.previewAdminOfficialImage = (event) => {
            const f = event.target.files?.[0];
            const wrap = document.getElementById('preview_a_wrap');
            const img = document.getElementById('preview_a_img');
            if (f && wrap && img) {
                const r = new FileReader();
                r.onload = e => {
                    img.src = e.target.result;
                    wrap.classList.remove('hidden');
                };
                r.readAsDataURL(f);
            }
        };

        // =====================================================================
        // 14. PENGAJUAN ARTIKEL & PENYIMPANAN DRAF
        // =====================================================================
        window.submitPublicForm = async (e, targetStatus = 'pending') => {
            if (e) e.preventDefault();
            const title = (document.getElementById('f_title')?.value || '').trim();
            const topicId = document.getElementById('f_topic')?.value || '';
            const editorData = getRichEditorContent('f_content');
            const rawName = (document.getElementById('f_author')?.value || appState.currentUser?.full_name || '').trim();
            const rawSocial = (document.getElementById('f_social')?.value || '').trim();

            if (!title || !topicId || !editorData.text || !rawName) {
                showToast('Harap isi Judul, Kategori, Isi Berita, dan Nama Penulis.', 'error');
                return;
            }

            const btn = document.getElementById('btn_f');
            if (btn) { btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> Memproses...'; btn.disabled = true; }

            try {
                let img = null;
                const fileInput = document.getElementById('f_image');
                if (fileInput?.files?.[0]) {
                    img = await uploadFileMedia('f_image', 'article');
                } else if (appState.editingDraftId) {
                    const existingDraft = appState.articles.find(x => String(x.id) === String(appState.editingDraftId));
                    img = existingDraft?.image_url || 'https://placehold.co/800x450/2563eb/white?text=Artikel+Zeniopost';
                } else if (targetStatus === 'draft') {
                    img = 'https://placehold.co/800x450/64748b/white?text=Draf+Artikel';
                } else {
                    showToast('Pilih file gambar sampul artikel terlebih dahulu.', 'error');
                    if (btn) { btn.innerHTML = 'Kirim Pengajuan'; btn.disabled = false; }
                    return;
                }

                const combinedAuthor = rawSocial ? `${rawName} ||| ${rawSocial}` : rawName;
                const payload = {
                    title,
                    topic_id: topicId,
                    image_url: img,
                    content: editorData.html,
                    author_name: combinedAuthor,
                    user_id: appState.currentUser ? appState.currentUser.id : null,
                    status: targetStatus,
                    is_official: false,
                    created_at: new Date().toISOString()
                };

                if (appState.editingDraftId) {
                    if (IS_PREVIEW) {
                        const idx = mockArticles.findIndex(x => String(x.id) === String(appState.editingDraftId));
                        if (idx > -1) mockArticles[idx] = { ...mockArticles[idx], ...payload };
                    } else {
                        const { error } = await dbClient.from('articles').update(payload).eq('id', appState.editingDraftId);
                        if (error) throw error;
                    }
                    appState.editingDraftId = null;
                } else {
                    if (IS_PREVIEW) {
                        payload.id = Date.now().toString();
                        mockArticles.unshift(payload);
                    } else {
                        const { error } = await dbClient.from('articles').insert([payload]);
                        if (error) throw error;
                    }
                }

                await fetchData();
                if (targetStatus === 'draft') {
                    showToast('<i class="fas fa-save mr-1"></i> Draf artikel berhasil disimpan!', 'success');
                    renderApp();
                } else {
                    showToast('<i class="fas fa-paper-plane mr-1"></i> Artikel berhasil diajukan! Menunggu persetujuan Admin sebelum dipublikasikan.', 'success');
                    app.navigate('home');
                }
            } catch (err) {
                showToast(err.message || 'Gagal menyimpan artikel.', 'error');
                if (btn) { btn.innerHTML = 'Kirim Pengajuan'; btn.disabled = false; }

        window.switchAdminTab = (tab) => {

        window.adminActUser = async (userId, action) => {
            try {
                if (action === 'delete') {
                    if (IS_PREVIEW) mockUsers = mockUsers.filter(u => String(u.id) !== String(userId));
                    else await dbClient.from('zp_users').delete().eq('id', userId);
                    showToast('Data pengguna dihapus.', 'info');
                } else {
                    const nextStatus = action === 'approve' ? 'approved' : 'rejected';
                    if (IS_PREVIEW) {
                        const u = mockUsers.find(x => String(x.id) === String(userId));
                        if (u) u.status = nextStatus;
                    } else {
                        await dbClient.from('zp_users').update({ status: nextStatus }).eq('id', userId);

                    showToast(`Status akun pengguna diperbarui menjadi ${nextStatus.toUpperCase()}!`, 'success');

                renderApp();

                showToast(err.message, 'error');

        // Saat Admin ACC Permintaan Sandi Baru:

        // 2. Ubah status reset menjadi approved
        // 3. Buka pengirim Gmail (bukan ke Chat) agar kata sandi baru dikirimkan ke alamat Gmail aktif pengguna
        window.adminActPasswordReset = async (resetId, nextStatus) => {
            try {
                const targetReset = appState.passwordResets.find(x => String(x.id) === String(resetId));
                if (!targetReset) return;

                const { reqPass, activeGmail, phoneNum } = parseResetRequestData(targetReset);
                const finalNewPassword = (reqPass || 'zeniopost123').slice(0, 15);

                if (nextStatus === 'approved') {
                    if (IS_PREVIEW) {
                        const u = mockUsers.find(x => String(x.id) === String(targetReset.user_id));
                        if (u) u.password_hash = finalNewPassword;
                        targetReset.status = 'approved';
                    } else {
                        // 1. Update kata sandi akun pengguna di zp_users
                        const { error: uErr } = await dbClient
                            .from('zp_users')
                            .update({ password_hash: finalNewPassword })
                            .eq('id', targetReset.user_id);
                        if (uErr) throw uErr;

                        // 2. Update status permintaan reset
                        await dbClient
                            .from('zp_password_resets')
                            .update({ status: 'approved', updated_at: new Date().toISOString() })
                            .eq('id', resetId);
                    }

                    // 3. Buka Compose Gmail menuju email Google aktif pengguna
                    if (activeGmail) {
                        const subject = encodeURIComponent('Pemulihan Kata Sandi Akun Zeniopost Anda');
                        const body = encodeURIComponent(
                            `Halo Pengguna Zeniopost,\n\nPermintaan penggantian kata sandi untuk akun Zeniopost (${targetReset.email}) dengan nomor telepon (${phoneNum || '-'}) telah DISETUJUI oleh Admin.\n\nBerikut adalah Kata Sandi Baru Anda:\n${finalNewPassword}\n\nSilakan gunakan kata sandi baru tersebut untuk masuk di portal Zeniopost.\n\nSalam,\nTim Admin Zeniopost`
                        );
                        const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(activeGmail)}&su=${subject}&body=${body}`;
                        window.open(gmailUrl, '_blank', 'noopener,noreferrer');
                    }

                    showToast(`Disetujui! Kata sandi akun ${targetReset.email} telah diperbarui dan siap dikirimkan ke Gmail ${activeGmail || 'pengguna'}.`, 'success');
                } else {
                    if (IS_PREVIEW) {
                        targetReset.status = 'rejected';
                    } else {
                        await dbClient
                            .from('zp_password_resets')
                            .update({ status: 'rejected', updated_at: new Date().toISOString() })
                            .eq('id', resetId);
                    }
                    showToast('Permintaan pemulihan kata sandi ditolak.', 'info');
                }

                await fetchData();
                renderApp();
            } catch (err) {
                showToast(err.message || 'Gagal memproses permintaan sandi.', 'error');
            }

        window.openAdminChatWithUser = async (userId) => {
            appState.activeAdminChatUserId = userId;
            await markMessagesAsRead(userId, 'admin');
            renderApp();
        };

        window.actArt = async (id, act) => {
            try {
                if (IS_PREVIEW) {
                    if (act === 'acc') mockArticles.find(x => String(x.id) === String(id)).status = 'approved';
                    if (act === 'del') mockArticles = mockArticles.filter(x => String(x.id) !== String(id));
                } else {
                    if (act === 'acc') await dbClient.from('articles').update({ status: 'approved' }).eq('id', id);
                    if (act === 'del') await dbClient.from('articles').delete().eq('id', id);
                }
                showToast(act === 'acc' ? 'Artikel Disetujui & Tayang!' : 'Artikel Dihapus!', 'success');
                await fetchData();
                renderApp();
            } catch (err) {
                showToast(err.message, 'error');
            }
        };

        window.addTopic = async (e) => {
            e.preventDefault();
            const name = (document.getElementById('new_topic_name')?.value || '').trim();

            if (IS_PREVIEW) mockTopics.push({ id: 't_' + Date.now(), name });
            else await dbClient.from('topics').insert([{ name }]);
            await fetchData();
            showToast(`Kategori "${name}" ditambahkan!`, 'success');
            renderApp();
        };

            if (IS_PREVIEW) mockTopics = mockTopics.filter(t => String(t.id) !== String(topicId));

            showToast('Kategori dihapus.', 'info');
            renderApp();
        };

            try {

                    appState.user = { id: 'admin1', email: document.getElementById('l_email').value };

                    const { data, error } = await dbClient.auth.signInWithPassword({
                        email: document.getElementById('l_email').value,
                        password: document.getElementById('l_pass').value
                    });
                    if (error) throw error;
                    appState.user = data.user;
                }
                showToast('Berhasil Masuk Dashboard Admin!', 'success');
                await fetchData();
                app.navigate('admin');

            try {
                const img = await uploadFileMedia('a_image', 'official');
                const rawSocial = document.getElementById('a_social')?.value?.trim() || '';

                    title: document.getElementById('a_title').value,

        // =====================================================================

                return `

                            <button onclick="app.navigate('home')" class="font-bold text-slate-700 bg-white border border-slate-300 hover:bg-slate-50 px-4 py-2 rounded-full text-xs md:text-sm transition"><i class="fas fa-arrow-left mr-2"></i>Kembali ke Beranda</button>
                            <div class="flex items-center gap-2">
                                <button onclick="window.toggleSaveArticle('${a.id}', event)" class="px-4 py-2 rounded-full text-xs font-extrabold border transition ${isGuest ? 'bg-white text-slate-600 border-slate-300' : saved ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-800 border-slate-900'}">
                                    <i class="fas ${isGuest ? 'fa-lock text-slate-500' : saved ? 'fa-bookmark' : 'far fa-bookmark'} mr-1"></i> ${isGuest ? 'Simpan (Login)' : saved ? 'Tersimpan' : 'Simpan Berita'}
                                </button>
                                <button onclick="window.shareArticle('${a.id}')" class="bg-blue-600 text-white px-4 py-2 rounded-full text-xs font-extrabold"><i class="fas fa-share-nodes mr-1"></i> Bagikan</button>
                            </div>
                        </div>
                        <img src="${a.image_url}" alt="${a.title}" class="w-full max-h-[440px] object-cover bg-slate-100">
                        <div class="p-6 md:p-10">
                            <h1 class="text-2xl md:text-4xl font-extrabold text-slate-900 mb-6 leading-tight">${a.title}</h1>
                            <div class="flex flex-wrap items-center justify-between gap-4 mb-8 pb-6 border-b border-slate-100">
                                <div class="flex items-center gap-3">
                                    ${a.is_official ? '' : info.avatarUrl ? `<img src="${info.avatarUrl}" class="w-12 h-12 rounded-full object-cover border border-blue-200">` : `<div class="w-12 h-12 rounded-full flex items-center justify-center text-xl font-bold bg-slate-200 text-slate-600"><i class="fas fa-user"></i></div>`}

                                        <div class="font-extrabold text-lg flex items-center gap-1.5">

                                        </div>
                                        <p class="text-xs font-bold text-slate-400 mt-1 flex flex-wrap items-center gap-2">
                                            <span><i class="far fa-clock mr-1"></i>${formatWaktu(a.created_at)}</span>
                                            <span>•</span>
                                            <span class="text-blue-600 font-extrabold"><i class="far fa-eye mr-1"></i>${getArticleViews(a)}x dibaca</span>
                                        </p>
                                    </div>
                                </div>
                            </div>
                            <div class="text-base md:text-lg text-slate-700 leading-relaxed mb-10">${sanitizeAndFormatArticleHtml(a.content)}</div>
                            ${renderCommentsSection(a.id, 'page')}
                            ${renderRecommendationsBlock(a, false)}
                        </div>
                    </div>
                `;
            }

            // B. HALAMAN BERANDA
            if (appState.view === 'home' || appState.view === 'topics') {
                const allApproved = appState.articles.filter(a => a.status === 'approved');
                const filtered = filterBySearchAndDate(allApproved);
                const visibleList = filtered.slice(0, appState.visibleCount);
                const hasMore = filtered.length > visibleList.length;

                return `
                    <div class="max-w-6xl mx-auto w-full p-4 md:p-8 animate-fade">
                        ${renderHorizontalTopicsBar()}

                        <div class="flex items-center justify-between mb-6">
                            <h2 class="text-xl md:text-2xl font-extrabold text-slate-900">
                                ${appState.activeTopicId ? `Kategori: ${appState.topics.find(t => String(t.id) === String(appState.activeTopicId))?.name || 'Topik'}` : 'Berita Terkini'}
                            </h2>
                            <span class="text-xs font-bold text-slate-500 bg-white px-3.5 py-1.5 rounded-full border border-slate-200">Menampilkan ${visibleList.length} dari ${filtered.length} Berita</span>
                        </div>

                        ${visibleList.length === 0 ? `
                            <div class="text-center p-12 bg-white rounded-3xl border border-slate-100 text-slate-400 font-bold">Belum ada berita pada filter/kategori ini.</div>
                        ` : `
                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                                ${visibleList.map(a => renderArticleCard(a)).join('')}
                            </div>
                        `}

                        ${hasMore ? `
                            <div class="mt-10 flex justify-center">
                                <button onclick="app.loadMoreArticles()" class="bg-white hover:bg-blue-600 text-slate-800 hover:text-white border border-slate-200 hover:border-blue-600 font-extrabold py-3.5 px-8 rounded-2xl shadow-sm transition flex items-center gap-2 text-sm">
                                    <i class="fas fa-plus-circle"></i> Muat Lebih Banyak (${filtered.length - visibleList.length} Berita Lagi)
                                </button>
                            </div>
                        ` : ''}
                    </div>
                `;
            }

            // C. HALAMAN TRENDING TOP 3
            if (appState.view === 'trending') {
                const top3 = getTrendingTop3();
                return `
                    <div class="max-w-6xl mx-auto w-full p-4 md:p-8 animate-fade">
                        <div class="bg-white text-slate-900 p-6 md:p-8 rounded-3xl mb-8 border border-slate-900 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                            <div class="flex items-center gap-4">
                                <div class="w-14 h-14 rounded-2xl bg-blue-600 text-white flex items-center justify-center text-2xl shrink-0"><i class="fas fa-fire"></i></div>
                                <div>
                                    <h1 class="text-2xl md:text-3xl font-extrabold text-slate-900">Trending Top 3 Zeniopost</h1>
                                    <p class="text-xs md:text-sm text-slate-600 font-semibold mt-1">Tiga berita paling populer berdasarkan data pembacaan aktual pembaca</p>
                                </div>
                            </div>
                            <span class="bg-slate-900 text-white text-xs font-extrabold px-4 py-2 rounded-full self-start sm:self-center">Edisi Terpopuler</span>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                            ${top3.length === 0 ? `<div class="col-span-full p-12 text-center bg-white rounded-3xl font-bold text-slate-400">Belum ada data pembacaan berita.</div>` : top3.map((a, idx) => renderArticleCard(a, idx + 1)).join('')}

                    </div>
                `;
            }

            // D. HALAMAN BERITA TERSIMPAN (TERKUNCI UNTUK TAMU)
            if (appState.view === 'saved') {
                if (!appState.currentUser) {
                    return `
                        <div class="max-w-lg mx-auto p-6 md:p-10 animate-fade">
                            <div class="bg-white rounded-3xl p-8 text-center border border-slate-300 shadow-sm space-y-4">
                                <div class="w-16 h-16 rounded-2xl bg-slate-100 text-slate-800 border border-slate-300 flex items-center justify-center text-3xl mx-auto"><i class="fas fa-lock"></i></div>
                                <h2 class="text-xl font-extrabold text-slate-900">Fitur Simpan Berita Terkunci</h2>
                                <p class="text-xs md:text-sm text-slate-500 font-semibold leading-relaxed">Fitur menyimpan berita hanya berlaku untuk pengguna yang memiliki akun Zeniopost. Silakan masuk atau daftar akun terlebih dahulu.</p>
                                <button onclick="app.navigate('account')" class="bg-blue-600 hover:bg-blue-700 text-white font-extrabold px-6 py-3 rounded-xl text-xs md:text-sm shadow">Masuk ke Akun Zeniopost</button>

                        </div>
                    `;
                }

                                    <h1 class="text-xl md:text-2xl font-extrabold text-slate-900">Daftar Berita Tersimpan</h1>

                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">

                            <div class="flex flex-wrap items-center justify-between gap-2 mb-6">
                                <h2 class="text-2xl font-extrabold text-slate-900 flex items-center gap-3"><i class="fas fa-pen-nib text-blue-600"></i> ${appState.editingDraftId ? 'Lanjutkan Edit Draf Artikel' : 'Ajukan Artikel Berita'}</h2>

                                    </button>
                                </div>

                                <div>
                                    <label class="block text-xs font-extrabold text-slate-600 mb-1.5">Editor Artikel (Tebal, Miring, Heading, Perataan, Tautan, Kutipan & Daftar Bernomor Bertingkat Otomatis)</label>
                                    ${renderRichTextEditor('f_content', 'Tulis isi berita lengkap di sini... Gunakan tombol daftar atau tekan Tab untuk penomoran bertingkat otomatis.')}
                                </div>

                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <input type="text" id="f_author" required value="${appState.currentUser ? appState.currentUser.full_name : ''}" placeholder="Nama Penulis (Wajib)" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl font-bold outline-none focus:border-blue-500">
                                    <input type="text" id="f_social" placeholder="Link / Username Sosmed (Opsional)" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl font-bold outline-none focus:border-blue-500">
                                </div>

                                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-2">
                                    <button type="button" onclick="window.previewSubmissionArticle()" class="w-full bg-white hover:bg-slate-50 text-slate-900 border border-slate-900 font-extrabold py-3.5 px-4 rounded-xl text-xs md:text-sm flex items-center justify-center gap-2 transition">
                                        <i class="fas fa-eye text-blue-600"></i> Pratinjau Artikel
                                    </button>
                                    <button type="button" onclick="window.submitPublicForm(null, 'draft')" class="w-full bg-white hover:bg-slate-50 text-slate-900 border border-slate-900 font-extrabold py-3.5 px-4 rounded-xl text-xs md:text-sm flex items-center justify-center gap-2 transition">
                                        <i class="fas fa-save text-slate-700"></i> Simpan Draf
                                    </button>
                                    <button type="submit" id="btn_f" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-extrabold py-3.5 px-4 rounded-xl shadow-md text-xs md:text-sm flex items-center justify-center gap-2 transition">
                                        <i class="fas fa-paper-plane"></i> Kirim Pengajuan
                                    </button>
                                </div>
                            </form>
                        </div>

                            <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200">
                                <h3 class="font-extrabold text-base text-slate-900 mb-3 flex items-center gap-2"><i class="fas fa-folder-open text-blue-600"></i> Draf Artikel Anda (${userDrafts.length})</h3>
                                <div class="space-y-2.5">
                                    ${userDrafts.map(d => `
                                        <div class="p-3.5 rounded-2xl bg-white border border-slate-300 flex items-center justify-between gap-3">
                                            <div class="min-w-0">
                                                <div class="font-extrabold text-sm text-slate-800 truncate">${d.title}</div>
                                                <div class="text-[11px] font-semibold text-slate-400">Disimpan: ${formatWaktu(d.created_at)}</div>
                                            </div>
                                            <div class="flex items-center gap-2 shrink-0">
                                                <button onclick="window.loadDraftToEditor('${d.id}')" class="bg-blue-600 text-white text-xs font-extrabold px-3.5 py-2 rounded-xl"><i class="fas fa-edit mr-1"></i>Lanjutkan</button>
                                                <button onclick="window.actArt('${d.id}', 'del')" class="bg-white text-slate-700 hover:text-slate-900 border border-slate-300 text-xs font-extrabold px-3 py-2 rounded-xl"><i class="fas fa-trash"></i></button>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `;
            }

            // F. HALAMAN SISTEM AKUN (PUTIH, LINE HITAM & AKSEN BIRU PROFESIONAL, TANPA TULISAN "BADGE ABU-ABU", FOTO PROFIL MAKS 1 MB REKOMENDASI 1:1)
            if (appState.view === 'account') {
                if (appState.currentUser) {
                    const u = appState.currentUser;
                    const myArticles = appState.articles.filter(a => String(a.user_id) === String(u.id));
                    const myApprovedArticles = myArticles.filter(a => a.status === 'approved');
                    const myPendingArticles = myArticles.filter(a => a.status === 'pending');
                    const myDraftArticles = myArticles.filter(a => a.status === 'draft');
                    const totalMyViews = myApprovedArticles.reduce((acc, cur) => acc + getArticleViews(cur), 0);
                    const totalMyComments = myApprovedArticles.reduce((acc, cur) => acc + getArticleComments(cur.id).length, 0);

                    return `
                        <div class="max-w-4xl mx-auto w-full p-4 md:p-8 animate-fade space-y-6">
                            <div class="bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-slate-900 flex flex-col md:flex-row items-center gap-6">
                                <!-- Foto Profil Maks 1 MB (Rekomendasi 1:1) + Tombol X untuk Batal saat Pilih File -->
                                <div class="flex flex-col items-center gap-3 shrink-0">
                                    ${u.avatar_url ? `
                                        <img src="${u.avatar_url}" alt="${u.full_name}" class="w-28 h-28 rounded-full aspect-square object-cover border-2 border-slate-900 shadow-sm">
                                    ` : `
                                        <div class="w-28 h-28 rounded-full bg-blue-600 text-white flex items-center justify-center text-4xl font-extrabold shadow-sm">
                                            ${(u.full_name || 'U').charAt(0).toUpperCase()}
                                        </div>
                                    `}
                                    <div class="flex flex-wrap items-center justify-center gap-2">
                                        <label class="cursor-pointer bg-white hover:bg-slate-50 text-slate-900 border border-slate-900 text-xs font-extrabold px-3.5 py-1.5 rounded-xl transition">
                                            <i class="fas fa-camera text-blue-600 mr-1"></i> ${u.avatar_url ? 'Ganti Foto' : 'Pilih Foto'}
                                            <input type="file" id="profile_avatar_input" accept="image/*" onchange="window.previewProfileAvatarSelection(event)" class="hidden">
                                        </label>
                                        ${u.avatar_url ? `
                                            <button onclick="window.handleRemoveAvatar()" class="bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 text-xs font-extrabold px-3 py-1.5 rounded-xl transition">
                                                <i class="fas fa-trash-alt mr-1"></i> Hapus
                                            </button>
                                        ` : ''}
                                    </div>

                                    <!-- Pratinjau Pilihan Foto Baru dengan Tombol X untuk Cancel -->
                                    <div id="profile_pending_avatar_box" class="hidden flex-col items-center gap-2 p-3 rounded-2xl bg-white border border-slate-900">
                                        <div class="relative">
                                            <img id="profile_pending_avatar_img" src="" class="w-20 h-20 rounded-full aspect-square object-cover border border-slate-900">
                                            <button type="button" onclick="window.cancelProfileAvatarSelection()" title="Batal Unggah Foto" class="absolute -top-1.5 -right-1.5 w-6 h-6 rounded-full bg-slate-900 hover:bg-slate-700 text-white text-xs flex items-center justify-center shadow">
                                                <i class="fas fa-times"></i>
                                            </button>
                                        </div>
                                        <button type="button" onclick="window.handleUpdateAvatar()" class="bg-blue-600 hover:bg-blue-700 text-white text-[11px] font-extrabold px-3 py-1.5 rounded-xl shadow-sm">
                                            <i class="fas fa-check mr-1"></i> Simpan Foto
                                        </button>
                                    </div>

                                    <span class="text-[10px] font-bold text-slate-500">Maks. 1 MB • Rekomendasi ukuran 1:1</span>
                                </div>

                                <!-- Detail Akun Zeniopost -->
                                <div class="flex-1 text-center md:text-left space-y-2">
                                    <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white text-slate-800 text-xs font-extrabold border border-slate-900">
                                        <i class="fas fa-check-circle text-slate-400"></i> Penulis Terverifikasi
                                    </div>
                                    <h2 class="text-2xl font-extrabold text-slate-900 flex items-center justify-center md:justify-start gap-1.5">
                                        <span>${u.full_name}</span>
                                        <i class="fas fa-check-circle text-slate-400 text-lg" title="Penulis Terdaftar Zeniopost"></i>
                                    </h2>
                                    <p class="text-sm font-bold text-blue-600">${u.email}</p>
                                    <div class="pt-3 flex flex-wrap justify-center md:justify-start gap-2.5">
                                        <button onclick="app.navigate('submit')" class="bg-slate-900 hover:bg-slate-800 text-white text-xs font-extrabold px-4 py-2.5 rounded-xl transition"><i class="fas fa-pen-nib mr-1"></i> Tulis Artikel</button>
                                        <button onclick="app.navigate('saved')" class="bg-white hover:bg-slate-50 text-slate-900 border border-slate-900 text-xs font-extrabold px-4 py-2.5 rounded-xl transition"><i class="fas fa-bookmark text-blue-600 mr-1"></i> Berita Tersimpan (${appState.savedArticles.length})</button>
                                        <button onclick="app.navigate('chat')" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-extrabold px-4 py-2.5 rounded-xl transition"><i class="fas fa-headset mr-1"></i> Hubungi Admin</button>
                                        <button onclick="window.logoutZeniopostUser()" class="bg-white hover:bg-slate-100 text-slate-800 border border-slate-400 text-xs font-extrabold px-4 py-2.5 rounded-xl transition"><i class="fas fa-sign-out-alt mr-1"></i> Keluar</button>
                                    </div>
                                </div>
                            </div>

                            <!-- Analitik Performa Artikel Pengguna (Desain Bersih Putih, Line Hitam & Aksen Biru) -->
                            <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-900 space-y-4">
                                <div class="flex flex-wrap items-center justify-between gap-2">
                                    <h3 class="font-extrabold text-lg text-slate-900 flex items-center gap-2">
                                        <span class="w-8 h-8 rounded-xl bg-blue-50 text-blue-600 border border-blue-200 flex items-center justify-center text-sm"><i class="fas fa-chart-pie"></i></span>
                                        Analitik Akun & Performa Berita Saya
                                    </h3>
                                    <span class="text-[11px] font-bold text-slate-500">Data pembacaan real-time</span>
                                </div>
                                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3.5">
                                    <div class="p-4 rounded-2xl bg-white border border-slate-900">
                                        <div class="text-[11px] font-extrabold text-slate-700 uppercase">Total Dibaca</div>
                                        <div class="text-2xl font-black text-slate-900 mt-1 flex items-center gap-2">
                                            <i class="far fa-eye text-blue-600 text-lg"></i> ${totalMyViews}
                                        </div>
                                        <div class="text-[10px] font-semibold text-slate-500 mt-0.5">Kali dilihat publik</div>
                                    </div>
                                    <div class="p-4 rounded-2xl bg-white border border-slate-900">
                                        <div class="text-[11px] font-extrabold text-slate-700 uppercase">Berita Tayang</div>
                                        <div class="text-2xl font-black text-slate-900 mt-1 flex items-center gap-2">
                                            <i class="fas fa-check-circle text-blue-600 text-lg"></i> ${myApprovedArticles.length}
                                        </div>
                                        <div class="text-[10px] font-semibold text-slate-500 mt-0.5">Disetujui Admin</div>
                                    </div>
                                    <div class="p-4 rounded-2xl bg-white border border-slate-900">
                                        <div class="text-[11px] font-extrabold text-slate-700 uppercase">Total Komentar</div>
                                        <div class="text-2xl font-black text-slate-900 mt-1 flex items-center gap-2">

                // Tampilan Belum Login: Hanya 2 Tab Utama (Masuk Akun & Daftar Akun). Fitur Lupa Sandi Disatukan di Bagian Masuk Akun!

                                        <div class="flex items-center justify-between pt-1">

                                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-extrabold py-3.5 rounded-xl shadow-md transition">Masuk ke Zeniopost</button>
                                    </form>

                                    <!-- Bagian Lupa Kata Sandi yang Menyatu Langsung di Dalam Masuk Akun (Wajib Gmail Aktif & Nomor Telepon) -->
                                    ${appState.showForgotForm ? `

                                                    <div>
                                                        <h3 class="text-sm font-extrabold text-slate-900 flex items-center gap-1.5">

                                                        </p>
                                                    </div>

                                                <form onsubmit="window.handleRequestPasswordRecovery(event)" class="space-y-3">

                                                        <input type="text" id="rec_zp_email" required placeholder="nama@zeniopost.com" class="w-full p-3 bg-white border border-slate-300 rounded-xl font-bold text-xs md:text-sm outline-none focus:border-blue-600">
                                                    </div>
                                                    <div>
                                                        <label class="block text-[11px] font-extrabold text-slate-700 mb-1">Email Google Aktif (Wajib @gmail.com untuk Terima Sandi Baru)</label>

                                                    <div>
                                                        <label class="block text-[11px] font-extrabold text-slate-700 mb-1">Nomor Telepon / WhatsApp Aktif (Wajib)</label>

                                                    <div>

                                                            <input type="password" id="rec_new_password" required minlength="6" maxlength="15" placeholder="Ketik kata sandi baru (maks. 15 karakter)..." class="w-full p-3 pr-11 bg-white border border-slate-300 rounded-xl font-bold text-xs md:text-sm outline-none focus:border-blue-600">
                                                            <button type="button" onclick="window.togglePasswordVisibility('rec_new_password', 'icon_rec_new_pass')" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-blue-600 transition" title="Tampilkan / Sembunyikan Kata Sandi">
                                                                <i id="icon_rec_new_pass" class="fas fa-eye text-slate-400"></i>
                                                            </button>
                                                        </div>
                                                    </div>
                                                    <div>
                                                        <label class="block text-[11px] font-extrabold text-slate-700 mb-1">Alasan Permintaan Ganti Sandi</label>

                                                    </div>
                                                    <button type="submit" class="w-full bg-slate-900 hover:bg-blue-600 text-white font-extrabold py-3 rounded-xl text-xs md:text-sm shadow-sm transition">

                                    <div>

            // G. HALAMAN LIVE CHAT DENGAN ADMIN
            if (appState.view === 'chat') {

                                <button onclick="app.navigate('account')" class="bg-blue-600 text-white font-extrabold px-6 py-3 rounded-xl text-xs md:text-sm shadow">Masuk / Daftar Akun</button>

                }

                const myChats = appState.messages.filter(m => String(m.user_id) === String(appState.currentUser.id));
                return `
                    <div class="max-w-3xl mx-auto p-4 md:p-8 animate-fade">
                        <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden flex flex-col h-[75vh]">

                                    <div>
                                        <h3 class="font-extrabold text-sm md:text-base">Ruang Percakapan Admin Zeniopost</h3>

                            <div class="flex-1 overflow-y-auto p-5 space-y-3 bg-slate-50">

                                    <option value="Akun Pengguna">Topik: Akun Pengguna</option>

                                    <option value="Kendala Website">Topik: Kendala Website</option>

            // H. HALAMAN DASHBOARD ADMIN TERPADU (TANPA TULISAN SUPABASE, ADMIN BISA LIHAT SANDI SETIAP USER, ACC SANDI KIRIM KE CHAT, & HAPUS PESAN)
            if (appState.view === 'admin') {
                if (!appState.user) {
                    return `
                        <div class="max-w-sm mx-auto mt-10 md:mt-16 p-8 bg-white rounded-3xl shadow-lg border border-slate-100 animate-fade text-center">

                                    <label class="block text-xs font-extrabold text-slate-600 mb-1">Email Admin</label>
                                    <input type="email" id="l_email" required placeholder="Email Admin" class="w-full p-4 bg-slate-50 rounded-xl font-bold outline-none border border-slate-200">
                                </div>
                                <div>
                                    <label class="block text-xs font-extrabold text-slate-600 mb-1">Kata Sandi Admin</label>
                                    <div class="relative">
                                        <input type="password" id="l_pass" required placeholder="Kata Sandi Admin" class="w-full p-4 pr-11 bg-slate-50 rounded-xl font-bold outline-none border border-slate-200">
                                        <button type="button" onclick="window.togglePasswordVisibility('l_pass', 'icon_admin_login_pass')" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-blue-600 transition" title="Tampilkan / Sembunyikan Kata Sandi">

                                        </button>
                                    </div>
                                </div>
                                <button type="submit" id="btn_l" class="w-full bg-blue-600 text-white font-extrabold py-4 rounded-xl shadow">Masuk Dashboard Admin</button>
                            </form>
                        </div>

                }

                const pendingUsers = appState.zpUsers.filter(u => u.status === 'pending');
                const pendingResets = appState.passwordResets.filter(r => r.status === 'pending');
                const pendingArts = appState.articles.filter(a => a.status === 'pending');
                const approvedArts = appState.articles.filter(a => a.status === 'approved');
                const top3List = getTrendingTop3();
                const unreadAdminMsg = getUnreadChatCountForAdmin();

                return `
                    <div class="max-w-6xl mx-auto p-4 md:p-8 animate-fade space-y-6">
                        <div class="flex flex-wrap justify-between items-center gap-4 bg-slate-900 text-white p-6 rounded-3xl">
                            <div>
                                <h1 class="text-2xl font-extrabold">Dashboard Admin Zeniopost</h1>
                                <p class="text-slate-400 text-xs md:text-sm font-bold">Pusat Kendali Akun, Sandi Pengguna, Artikel, Statistik Top 3 & Live Chat</p>
                            </div>
                            <button onclick="app.logout()" class="bg-red-500 hover:bg-red-600 px-4 py-2.5 rounded-xl font-extrabold text-xs"><i class="fas fa-power-off mr-1"></i> Keluar Admin</button>

                            <button onclick="window.switchAdminTab('chats')" class="shrink-0 px-4 py-2.5 rounded-xl text-xs font-extrabold transition ${appState.adminTab === 'chats' ? 'bg-blue-600 text-white shadow' : 'bg-white text-slate-700 border border-slate-200'}">
                                <i class="fas fa-comments mr-1"></i> Pesan Pengguna (${unreadAdminMsg} Belum Dibaca)
                            </button>

                        <!-- ISI MODUL ADMIN BERDASARKAN TAB -->
                        ${appState.adminTab === 'users' ? `
                            <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm space-y-4">
                                <div class="flex flex-wrap items-center justify-between gap-2">
                                    <h3 class="font-extrabold text-lg text-slate-900">Kelola Akun, Kata Sandi & Foto Profil Pengguna (${appState.zpUsers.length})</h3>
                                    <span class="text-xs font-bold bg-blue-50 text-blue-700 px-3 py-1 rounded-full"><i class="fas fa-key mr-1"></i>Admin dapat melihat kata sandi setiap pengguna</span>
                                </div>
                                <div class="space-y-3">
                                    ${appState.zpUsers.map(u => `
                                        <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-4">

                                                ${u.avatar_url ? `<img src="${u.avatar_url}" class="w-12 h-12 rounded-full object-cover border border-blue-300">` : `<div class="w-12 h-12 rounded-full bg-slate-200 text-slate-700 flex items-center justify-center font-extrabold">${(u.full_name || 'U').charAt(0)}</div>`}
                                                <div class="space-y-1">
                                                    <div class="font-extrabold text-sm text-slate-900 flex items-center gap-2 flex-wrap">
                                                        <span>${u.full_name}</span>
                                                        <span class="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold ${u.status === 'approved' ? 'bg-emerald-100 text-emerald-700' : u.status === 'rejected' ? 'bg-rose-100 text-rose-700' : 'bg-amber-100 text-amber-700'}">${u.status.toUpperCase()}</span>
                                                    </div>
                                                    <div class="text-xs font-bold text-blue-600">${u.email}</div>
                                                    <!-- Informasi Sandi Pengguna untuk Admin -->
                                                    <div class="inline-flex items-center gap-2 bg-white border border-slate-200 px-3 py-1 rounded-lg text-xs font-bold text-slate-700">
                                                        <i class="fas fa-key text-amber-500"></i>
                                                        <span>Sandi Saat Ini:</span>
                                                        <code class="font-extrabold text-slate-900 bg-amber-50 px-2 py-0.5 rounded border border-amber-200 select-all">${u.password_hash || '-'}</code>
                                                    </div>
                                                    <div class="text-[11px] text-slate-400 font-semibold">Terdaftar: ${formatWaktu(u.created_at)}</div>
                                                </div>
                                            </div>
                                            <div class="flex flex-wrap items-center gap-2">
                                                ${u.status !== 'approved' ? `<button onclick="window.adminActUser('${u.id}', 'approve')" class="bg-emerald-600 text-white text-xs font-extrabold px-3.5 py-2 rounded-xl"><i class="fas fa-check mr-1"></i>Aktifkan</button>` : ''}
                                                ${u.status !== 'rejected' ? `<button onclick="window.adminActUser('${u.id}', 'reject')" class="bg-amber-500 text-white text-xs font-extrabold px-3.5 py-2 rounded-xl"><i class="fas fa-ban mr-1"></i>Nonaktifkan</button>` : ''}
                                                ${u.avatar_url ? `<button onclick="window.handleRemoveAvatar('${u.id}')" class="bg-white border border-slate-300 text-slate-700 text-xs font-extrabold px-3 py-2 rounded-xl"><i class="fas fa-image mr-1"></i>Hapus Foto</button>` : ''}
                                                <button onclick="window.adminActUser('${u.id}', 'delete')" class="bg-rose-50 text-rose-600 border border-rose-200 text-xs font-extrabold px-3 py-2 rounded-xl"><i class="fas fa-trash"></i></button>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        ` : appState.adminTab === 'resets' ? `
                            <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm space-y-4">
                                <div class="flex flex-wrap items-center justify-between gap-2">
                                    <h3 class="font-extrabold text-lg text-slate-900">Permintaan Ganti Kata Sandi Baru (${appState.passwordResets.length})</h3>
                                    <span class="text-xs font-bold bg-emerald-50 text-emerald-700 px-3 py-1 rounded-full">Saat di-ACC, sandi otomatis diubah & dikirim ke Gmail aktif pengguna</span>
                                </div>
                                ${appState.passwordResets.length === 0 ? `<p class="text-xs font-bold text-slate-400">Tidak ada permintaan pemulihan kata sandi.</p>` : `
                                    <div class="space-y-3">
                                        ${appState.passwordResets.map(r => {
                                            const { reqPass, activeGmail, phoneNum, cleanReason } = parseResetRequestData(r);
                                            return `
                                                <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                                    <div class="space-y-1.5">
                                                        <div class="font-extrabold text-sm text-slate-900 flex items-center gap-2 flex-wrap">
                                                            <span>Akun Zeniopost: ${r.email}</span>
                                                            <span class="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold ${r.status === 'approved' ? 'bg-emerald-100 text-emerald-700' : r.status === 'rejected' ? 'bg-rose-100 text-rose-700' : 'bg-amber-100 text-amber-700'}">${r.status.toUpperCase()}</span>
                                                        </div>
                                                        <div class="flex flex-wrap items-center gap-2 text-xs font-bold">
                                                            <span class="bg-white border border-slate-200 px-2.5 py-1 rounded-lg text-slate-700">
                                                                <i class="fas fa-envelope text-red-500 mr-1"></i>Gmail Aktif: <b class="text-slate-900 select-all">${activeGmail || '-'}</b>
                                                            </span>
                                                            <span class="bg-white border border-slate-200 px-2.5 py-1 rounded-lg text-slate-700">
                                                                <i class="fas fa-phone text-emerald-600 mr-1"></i>No. Telp: <b class="text-slate-900 select-all">${phoneNum || '-'}</b>
                                                            </span>
                                                        </div>
                                                        <div class="inline-flex items-center gap-2 bg-white border border-blue-200 px-3 py-1 rounded-lg text-xs font-bold text-blue-900">
                                                            <i class="fas fa-lock-open text-blue-600"></i>
                                                            <span>Request Sandi Baru:</span>
                                                            <code class="font-extrabold text-blue-700 bg-blue-50 px-2 py-0.5 rounded select-all">${reqPass || '(Tidak tercantum)'}</code>
                                                        </div>
                                                        <p class="text-xs text-slate-600 font-semibold">Alasan: "${cleanReason}"</p>
                                                        <div class="text-[11px] text-slate-400">${formatWaktu(r.created_at)}</div>
                                                    </div>
                                                    ${r.status === 'pending' ? `
                                                        <div class="flex items-center gap-2 shrink-0">
                                                            <button onclick="window.adminActPasswordReset('${r.id}', 'approved')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-extrabold px-4 py-2.5 rounded-xl shadow-sm transition">
                                                                <i class="fas fa-envelope mr-1"></i> ACC & Kirim ke Gmail
                                                            </button>
                                                            <button onclick="window.adminActPasswordReset('${r.id}', 'rejected')" class="bg-rose-50 text-rose-600 border border-rose-200 text-xs font-extrabold px-4 py-2.5 rounded-xl">
                                                                Tolak
                                                            </button>
                                                        </div>
                                                    ` : activeGmail ? `
                                                        <div class="flex items-center gap-2 shrink-0">
                                                            <a href="https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(activeGmail)}&su=${encodeURIComponent('Pemulihan Kata Sandi Akun Zeniopost Anda')}&body=${encodeURIComponent(`Halo,\n\nKata sandi baru untuk akun Zeniopost (${r.email}) Anda adalah: ${reqPass}`)}" target="_blank" rel="noopener noreferrer" class="bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 text-xs font-extrabold px-3.5 py-2 rounded-xl">
                                                                <i class="fas fa-paper-plane mr-1"></i> Buka Gmail Lagi
                                                            </a>
                                                        </div>
                                                    ` : ''}
                                                </div>
                                            `;
                                        }).join('')}
                                    </div>
                                `}
                            </div>
                        ` : appState.adminTab === 'stats' ? `
                            <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm space-y-5">
                                <h3 class="font-extrabold text-lg text-slate-900"><i class="fas fa-fire text-orange-500 mr-1"></i> Statistik Pembacaan Aktual & Trending Top 3</h3>
                                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    ${top3List.map((t, i) => `
                                        <div class="p-4 rounded-2xl bg-orange-50/70 border border-orange-200 space-y-1">
                                            <span class="text-[11px] font-extrabold text-orange-600 uppercase">Peringkat Trending #${i + 1}</span>
                                            <h4 class="font-extrabold text-sm text-slate-900 line-clamp-2">${t.title}</h4>
                                            <div class="text-sm font-black text-blue-600 pt-1"><i class="fas fa-eye mr-1"></i>${getArticleViews(t)} Pembaca Aktual</div>
                                        </div>
                                    `).join('')}
                                </div>
                                <div class="space-y-2 pt-3 border-t border-slate-100">
                                    ${approvedArts.map(a => `
                                        <div class="p-3 rounded-xl bg-slate-50 border border-slate-200 flex items-center justify-between gap-3">
                                            <span class="font-bold text-xs md:text-sm text-slate-800 truncate">${a.title}</span>
                                            <span class="shrink-0 bg-blue-50 text-blue-700 font-extrabold text-xs px-3 py-1 rounded-lg">${getArticleViews(a)} Pembaca</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        ` : appState.adminTab === 'chats' ? `
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                                <div class="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm space-y-2.5">
                                    <h3 class="font-extrabold text-sm text-slate-900 mb-2">Daftar Percakapan Pengguna</h3>
                                    ${appState.zpUsers.map(u => {
                                        const unread = appState.messages.filter(m => String(m.user_id) === String(u.id) && m.sender_role === 'user' && !m.is_read).length;
                                        const active = String(appState.activeAdminChatUserId) === String(u.id);
                                        return `
                                            <button onclick="window.openAdminChatWithUser('${u.id}')" class="w-full p-3 rounded-2xl text-left flex items-center justify-between transition ${active ? 'bg-blue-600 text-white' : 'bg-slate-50 hover:bg-slate-100 text-slate-800'}">
                                                <div class="truncate">
                                                    <div class="font-extrabold text-xs truncate">${u.full_name}</div>
                                                    <div class="text-[10px] ${active ? 'text-blue-100' : 'text-slate-400'}">${u.email}</div>
                                                </div>
                                                ${unread > 0 ? `<span class="bg-rose-600 text-white text-[10px] font-extrabold px-2 py-0.5 rounded-full">${unread}</span>` : ''}
                                            </button>
                                        `;
                                    }).join('')}
                                </div>
                                <div class="md:col-span-2 bg-white rounded-3xl border border-slate-100 shadow-sm overflow-hidden flex flex-col h-[520px]">
                                    ${!appState.activeAdminChatUserId ? `
                                        <div class="flex-1 flex items-center justify-center text-slate-400 text-xs font-bold p-6">Pilih salah satu pengguna di sebelah kiri untuk membuka riwayat pesan, membalas, atau menghapus pesan.</div>
                                    ` : (() => {
                                        const targetU = appState.zpUsers.find(u => String(u.id) === String(appState.activeAdminChatUserId));
                                        const chatHistory = appState.messages.filter(m => String(m.user_id) === String(appState.activeAdminChatUserId));
                                        return `
                                            <div class="p-4 bg-slate-900 text-white flex items-center justify-between gap-2">
                                                <div class="font-extrabold text-sm truncate">Percakapan: ${targetU ? targetU.full_name : 'Pengguna'} (${targetU?.email || ''})</div>
                                                ${chatHistory.length > 0 ? `
                                                    <button onclick="window.deleteAllUserChatMessages('${appState.activeAdminChatUserId}')" class="bg-rose-600 hover:bg-rose-700 text-white text-[11px] font-extrabold px-3 py-1.5 rounded-xl shrink-0 transition">
                                                        <i class="fas fa-trash-alt mr-1"></i> Hapus Semua Pesan
                                                    </button>
                                                ` : ''}
                                            </div>
                                            <div class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50">
                                                ${chatHistory.length === 0 ? `<div class="text-center py-10 text-xs font-bold text-slate-400">Belum ada pesan pada percakapan ini.</div>` : chatHistory.map(m => `
                                                    <div class="flex ${m.sender_role === 'admin' ? 'justify-end' : 'justify-start'}">
                                                        <div class="max-w-[82%] p-3 rounded-2xl text-xs relative group ${m.sender_role === 'admin' ? 'bg-blue-600 text-white' : 'bg-white border border-slate-200 text-slate-800'}">
                                                            <div class="flex items-center justify-between gap-3 mb-1">
                                                                <span class="text-[10px] font-extrabold opacity-80">${m.sender_role === 'admin' ? 'Admin' : `${targetU?.full_name || 'User'} • [${m.category || 'Umum'}]`}</span>
                                                                <button type="button" onclick="window.deleteChatMessage('${m.id}')" title="Hapus Pesan Ini" class="text-[10px] px-1.5 py-0.5 rounded ${m.sender_role === 'admin' ? 'bg-blue-700 hover:bg-rose-500 text-white' : 'bg-rose-50 hover:bg-rose-600 text-rose-600 hover:text-white'} transition">
                                                                    <i class="fas fa-trash-alt"></i>
                                                                </button>
                                                            </div>
                                                            <div class="whitespace-pre-wrap leading-relaxed">${m.message}</div>
                                                            <div class="text-[9px] opacity-70 mt-1 text-right">${formatWaktu(m.created_at)}</div>
                                                        </div>
                                                    </div>
                                                `).join('')}
                                            </div>
                                            <form onsubmit="window.sendChatMessage(event, 'admin', '${appState.activeAdminChatUserId}')" class="p-3 bg-white border-t border-slate-200 flex gap-2">
                                                <input type="text" id="admin_chat_input" required placeholder="Tulis balasan Admin..." class="flex-1 p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold outline-none">
                                                <button type="submit" class="bg-blue-600 text-white font-extrabold px-5 rounded-xl text-xs">Balas</button>
                                            </form>
                                        `;
                                    })()}
                                </div>
                            </div>
                        ` : `
                            <!-- TAB UTAMA ADMIN: ARTIKEL, KATEGORI & TERBITKAN RESMI -->
                            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                <div class="lg:col-span-2 space-y-6">
                                    <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm space-y-4">
                                        <h3 class="font-extrabold text-lg text-orange-500">Pengajuan Artikel Menunggu Persetujuan (${pendingArts.length})</h3>
                                        ${pendingArts.length === 0 ? `<p class="text-xs font-bold text-slate-400">Tidak ada antrean pengajuan artikel.</p>` : pendingArts.map(x => `
                                            <div class="p-4 rounded-2xl bg-orange-50/50 border border-orange-200 flex flex-col sm:flex-row justify-between gap-4">
                                                <div>
                                                    <h4 class="font-extrabold text-sm text-slate-900">${x.title}</h4>
                                                    <p class="text-xs text-slate-600 line-clamp-2 mt-1">${stripHtml(x.content)}</p>
                                                    <div class="text-[11px] font-bold text-slate-400 mt-1">${formatWaktu(x.created_at)}</div>
                                                </div>
                                                <div class="flex items-center gap-2 shrink-0">
                                                    <button onclick="window.actArt('${x.id}', 'acc')" class="bg-emerald-600 text-white text-xs font-extrabold px-3.5 py-2 rounded-xl">Setujui & Publikasikan</button>
                                                    <button onclick="window.actArt('${x.id}', 'del')" class="bg-rose-50 text-rose-600 border border-rose-200 text-xs font-extrabold px-3 py-2 rounded-xl">Tolak</button>
                                                </div>
                                            </div>
                                        `).join('')}
                                    </div>

                                    <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm space-y-3">
                                        <h3 class="font-extrabold text-lg text-slate-900">Artikel Terpublikasi (${approvedArts.length})</h3>
                                        ${approvedArts.map(x => `
                                            <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200 flex items-center justify-between gap-2">
                                                <span onclick="window.openArticlePopup('${x.id}')" class="font-bold text-xs md:text-sm text-slate-800 hover:text-blue-600 cursor-pointer truncate">${x.title}</span>
                                                <div class="flex items-center gap-2 shrink-0">
                                                    <span class="text-xs font-extrabold text-blue-600 bg-blue-50 px-2.5 py-1 rounded-lg">${getArticleViews(x)}x dibaca</span>
                                                    <button onclick="window.actArt('${x.id}', 'del')" class="text-rose-600 text-xs font-extrabold px-2.5 py-1 rounded-lg hover:bg-rose-50"><i class="fas fa-trash"></i></button>
                                                </div>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>

                                <div class="space-y-6">
                                    <!-- Kelola Kategori -->
                                    <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm space-y-4">
                                        <h3 class="font-extrabold text-base text-slate-900">Kelola Kategori Berita</h3>
                                        <form onsubmit="window.addTopic(event)" class="flex gap-2">
                                            <input type="text" id="new_topic_name" required placeholder="Kategori baru..." class="flex-1 p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold outline-none">
                                            <button type="submit" class="bg-blue-600 text-white font-extrabold px-4 rounded-xl text-xs">Tambah</button>
                                        </form>
                                        <div class="space-y-2">
                                            ${appState.topics.map(t => `
                                                <div class="p-2.5 px-3.5 rounded-xl bg-slate-50 border border-slate-200 flex items-center justify-between text-xs font-extrabold">
                                                    <span>${t.name}</span>
                                                    <button onclick="window.confirmDeleteTopic('${t.id}')" class="text-rose-500 hover:text-rose-700"><i class="fas fa-trash"></i></button>
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>

                                    <!-- Terbitkan Berita Resmi -->
                                    <div class="bg-blue-50 p-6 rounded-3xl border border-blue-100 space-y-3">
                                        <h3 class="font-extrabold text-base text-blue-900">Terbitkan Artikel Resmi</h3>
                                        <form onsubmit="window.submitAdminForm(event)" class="space-y-3">
                                            <input type="text" id="a_title" required placeholder="Judul Berita Resmi" class="w-full p-3 bg-white rounded-xl text-xs font-bold border border-blue-100 outline-none">
                                            <select id="a_topic" required class="w-full p-3 bg-white rounded-xl text-xs font-bold border border-blue-100 outline-none">
                                                <option value="">Pilih Kategori...</option>
                                                ${appState.topics.map(t => `<option value="${t.id}">${t.name}</option>`).join('')}
                                            </select>
                                            <input type="file" id="a_image" accept="image/*" required onchange="window.previewAdminOfficialImage(event)" class="w-full text-xs bg-white p-2 rounded-xl">
                                            <div id="preview_a_wrap" class="hidden relative">
                                                <img id="preview_a_img" src="" class="w-full h-36 object-cover rounded-xl border border-blue-200 bg-white">
                                                <button type="button" onclick="window.clearImageUpload('a_image', null, 'preview_a_wrap')" title="Batalkan Gambar" class="absolute top-2 right-2 w-7 h-7 rounded-full bg-rose-600 hover:bg-rose-700 text-white text-xs flex items-center justify-center shadow">
                                                    <i class="fas fa-times"></i>
                                                </button>
                                            </div>
                                            ${renderRichTextEditor('a_content', 'Tulis berita resmi Zeniopost...', '', 'min-h-[140px]')}
                                            <input type="text" id="a_social" placeholder="Sosmed (Opsional)" class="w-full p-3 bg-white rounded-xl text-xs font-bold border border-blue-100 outline-none">
                                            <button type="submit" id="btn_a" class="w-full bg-blue-600 text-white font-extrabold py-3 rounded-xl text-xs">Terbitkan Sekarang</button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        `}
                    </div>
                `;
            }

            return '';
        };

        const renderApp = () => {
            const root = document.getElementById('app');
            if (!root) return;
            root.innerHTML = `
                ${renderHeader()}
                <div class="flex w-full min-h-[calc(100vh-80px)] md:min-h-[calc(100vh-96px)]">
                    ${renderNav()}
                    <main id="main-content" class="flex-1 md:ml-64 pb-24 md:pb-12 relative">${buildMainContent()}</main>
                </div>
            `;
        };

        document.getElementById('modal-container').addEventListener('click', () => window.closeModal());

        const init = async () => {
            renderApp();
            checkDynamicShareEndpoint();
            await autoSetupDatabase();
            if (!IS_PREVIEW && dbClient) {
                const { data } = await dbClient.auth.getSession();
                appState.user = data.session?.user || null;
            }
            await fetchData();

            const params = new URLSearchParams(window.location.search);
            const sharedArticleId = params.get('article');
            if (sharedArticleId) {
                const found = appState.articles.find(x => String(x.id) === String(sharedArticleId));
                if (found) {
                    app.navigate('article', found);
                    return;
                }
            }
            renderApp();
        };

        init();
    </script>
</body>
</html>
