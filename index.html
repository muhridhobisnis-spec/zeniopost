                                                        <i class="fas fa-eye text-blue-500"></i> ${getArticleViews(x)} Pembaca
                                                    </span>
                                                    <button onclick="window.openAdminReviewModal('${x.id}', 'edit')" class="text-blue-600 hover:bg-blue-50 px-3 py-1.5 rounded-lg text-xs font-bold border border-blue-100"><i class="fas fa-pen mr-1"></i>Edit</button>
                                                    <button onclick="window.actArt('${x.id}', 'del')" class="text-red-500 hover:bg-red-50 px-3 py-1.5 rounded-lg text-xs font-bold"><i class="fas fa-trash mr-1"></i>Hapus</button>
                                                </div>
                                            </div>`).join('')}
                                        </div>
                                    </div>
                                </div>
                                <div class="space-y-6">
                                    <!-- FORM KELOLA KATEGORI / TOPIK -->
                                    <div class="bg-white border border-slate-100 p-6 rounded-3xl shadow-sm">
                                        <div class="flex items-center justify-between mb-4">
                                            <h3 class="font-extrabold text-slate-900 flex items-center gap-2">
                                                <span class="w-8 h-8 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-sm">
                                                    <i class="fas fa-layer-group"></i>
                                                </span>
                                                Kelola Kategori Topik
                                            </h3>
                                            <span class="text-xs font-extrabold bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full">${appState.topics.length} Kategori</span>
                                        </div>

                                        <!-- Form Tambah Kategori Baru -->
                                        <form onsubmit="window.addTopic(event)" class="flex gap-2 mb-4">
                                            <input type="text"
                                                   id="new_topic_name"
                                                   required
                                                   maxlength="40"
                                                   placeholder="Nama kategori baru..."
                                                   class="flex-1 p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs md:text-sm font-bold outline-none focus:border-blue-500 transition">
                                            <button type="submit"
                                                    id="btn_add_topic"
                                                    class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 py-3 rounded-xl text-xs md:text-sm shadow-sm flex items-center gap-1.5 shrink-0 transition">
                                                <i class="fas fa-plus"></i> Tambah
                                            </button>
                                        </form>

                                        <!-- Daftar Kategori (Bisa Edit & Hapus) -->
                                        <div class="space-y-2 max-h-72 overflow-y-auto pr-1">
                                            ${appState.topics.length === 0 ? `
                                                <div class="text-center py-6 px-3 bg-slate-50 rounded-2xl border border-dashed border-slate-200 text-slate-400 text-xs font-bold">
                                                    Belum ada kategori topik. Silakan tambahkan di atas.
                                                </div>
                                            ` : appState.topics.map(t => {
                                                const isEditing = String(appState.editingTopicId) === String(t.id);
                                                const isDeleting = String(appState.deletingTopicId) === String(t.id);
                                                const countArt = appState.articles.filter(art => String(art.topic_id) === String(t.id)).length;
                                                const safeTopicName = (t.name || '').replace(/"/g, '&quot;');

                                                if (isEditing) {
                                                    return `
                                                        <div class="p-3 rounded-2xl bg-blue-50/70 border border-blue-200 space-y-2">
                                                            <div class="text-[10px] font-extrabold text-blue-600 uppercase tracking-wider">Edit Nama Kategori</div>
                                                            <div class="flex gap-1.5">
                                                                <input type="text"
                                                                       id="edit_topic_input_${t.id}"
                                                                       value="${safeTopicName}"
                                                                       maxlength="40"
                                                                       onkeydown="if(event.key==='Enter'){event.preventDefault();window.saveEditTopic('${t.id}');}else if(event.key==='Escape'){window.cancelEditTopic();}"
                                                                       class="flex-1 p-2.5 bg-white border border-blue-300 rounded-xl text-xs font-bold outline-none focus:border-blue-600">
                                                                <button type="button"
                                                                        onclick="window.saveEditTopic('${t.id}')"
                                                                        class="bg-green-500 hover:bg-green-600 text-white px-3 py-2 rounded-xl text-xs font-extrabold transition">
                                                                    <i class="fas fa-check"></i> Simpan
                                                                </button>
                                                                <button type="button"
                                                                        onclick="window.cancelEditTopic()"
                                                                        class="bg-white hover:bg-slate-100 text-slate-600 border border-slate-200 px-2.5 py-2 rounded-xl text-xs font-bold transition">
                                                                    Batal
                                                                </button>
                                                            </div>
                                                        </div>
                                                    `;
                                                }

                                                if (isDeleting) {
                                                    return `
                                                        <div class="p-3 rounded-2xl bg-red-50 border border-red-200 flex items-center justify-between gap-2">
                                                            <div class="text-xs font-bold text-red-700 leading-snug">
                                                                Hapus kategori <strong class="font-extrabold">"${t.name}"</strong>?
                                                            </div>
                                                            <div class="flex items-center gap-1.5 shrink-0">
                                                                <button type="button"
                                                                        onclick="window.confirmDeleteTopic('${t.id}')"
                                                                        class="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-lg text-xs font-extrabold transition">
                                                                    Ya, Hapus
                                                                </button>
                                                                <button type="button"
                                                                        onclick="window.cancelDeleteTopic()"
                                                                        class="bg-white hover:bg-slate-100 text-slate-600 border border-slate-200 px-2.5 py-1.5 rounded-lg text-xs font-bold transition">
                                                                    Batal
                                                                </button>
                                                            </div>
                                                        </div>
                                                    `;
                                                }

                                                return `
                                                    <div class="p-3 rounded-2xl bg-slate-50 hover:bg-slate-100/80 border border-slate-200/80 flex items-center justify-between gap-2 transition">
                                                        <div class="min-w-0">
                                                            <div class="font-extrabold text-xs md:text-sm text-slate-800 truncate">${t.name}</div>
                                                            <div class="text-[10px] font-bold text-slate-400">${countArt} Artikel</div>
                                                        </div>
                                                        <div class="flex items-center gap-1.5 shrink-0">
                                                            <button type="button"
                                                                    onclick="window.startEditTopic('${t.id}')"
                                                                    title="Edit Nama Kategori"
                                                                    class="bg-white hover:bg-blue-50 text-blue-600 border border-slate-200 hover:border-blue-200 px-2.5 py-1.5 rounded-lg text-xs font-bold transition">
                                                                <i class="fas fa-pen"></i> Edit
                                                            </button>
                                                            <button type="button"
                                                                    onclick="window.askDeleteTopic('${t.id}')"
                                                                    title="Hapus Kategori"
                                                                    class="bg-white hover:bg-red-50 text-red-500 border border-slate-200 hover:border-red-200 px-2.5 py-1.5 rounded-lg text-xs font-bold transition">
                                                                <i class="fas fa-trash-alt"></i>
                                                            </button>
                                                        </div>
                                                    </div>
                                                `;
                                            }).join('')}
                                        </div>
                                    </div>

                                    <!-- FORM TULIS RESMI -->
                                    <div class="bg-blue-50 border border-blue-100 p-6 rounded-3xl">
                                        <h3 class="font-extrabold text-blue-900 mb-4"><i class="fas fa-pen-nib"></i> Terbitkan Resmi</h3>
                                        <form onsubmit="window.submitAdminForm(event)" class="space-y-3">
                                            <input type="text" id="a_title" required placeholder="Judul Berita" class="w-full p-3 bg-white rounded-xl text-sm font-bold border border-blue-100 outline-none">
                                            <select id="a_topic" required class="w-full p-3 bg-white rounded-xl text-sm font-bold border border-blue-100 outline-none">
                                                <option value="">Kategori...</option>${appState.topics.map(t => `<option value="${t.id}">${t.name}</option>`).join('')}
                                            </select>
                                            <input type="file" id="a_image" accept="image/*" required class="w-full text-xs file:mr-2 file:py-1 file:px-3 file:rounded file:border-0 file:bg-blue-600 file:text-white bg-white p-2 rounded-xl">
                                            <textarea id="a_content" required rows="4" placeholder="Isi Berita..." class="w-full p-3 bg-white rounded-xl text-sm border border-blue-100 outline-none"></textarea>
                                            <input type="text" id="a_social" placeholder="Sosmed (Opsional, misal @zeniopost)" class="w-full p-3 bg-white rounded-xl text-sm font-bold border border-blue-100 outline-none">
                                            <button type="submit" id="btn_a" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl shadow-sm text-sm"><i class="fas fa-paper-plane"></i> Terbitkan</button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>`;
                }
            }

            return content;
        };

        const renderApp = () => {
            const root = document.getElementById('app');
            const content = buildMainContent();

            root.innerHTML = `
                ${renderHeader()}
                <div class="flex w-full min-h-[calc(100vh-64px)]">
                    ${renderNav()}
                    <main id="main-content" class="flex-1 md:ml-64 pb-24 md:pb-10 relative">${content}</main>
                </div>
            `;
        };

        window.login = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn_l'); btn.innerHTML = "Memproses..."; btn.disabled = true;
            try {
                if(IS_PREVIEW) { appState.user = { id: 'admin1' }; }
                else {
                    const { data, error } = await supabase.auth.signInWithPassword({
                        email: document.getElementById('l_email').value,
                        password: document.getElementById('l_pass').value
                    });
                    if (error) throw error;
                    appState.user = data.user;
                }
                showToast("Berhasil Login Admin!", "success");
                await fetchData();
                app.navigate('admin');
            } catch (err) { showToast(err.message, "error"); }
            finally { if(btn) { btn.innerHTML = "Masuk"; btn.disabled = false; } }
        };

        window.submitPublicForm = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn_f'); btn.innerHTML = "Mengunggah..."; btn.disabled = true;
            try {
                const img = await uploadFileKeSupabase('f_image');
                const rawName = document.getElementById('f_author').value.trim();
                const rawSocial = document.getElementById('f_social').value.trim();
                const combinedAuthor = rawSocial ? `${rawName} ||| ${rawSocial}` : rawName;

                const p = {
                    title: document.getElementById('f_title').value,
                    topic_id: document.getElementById('f_topic').value,
                    image_url: img,
                    content: document.getElementById('f_content').value,
                    author_name: combinedAuthor,
                    status: 'pending',
                    is_official: false,
                    created_at: new Date().toISOString()
                };
                if(IS_PREVIEW) { p.id = Date.now().toString(); mockArticles.unshift(p); }
                else {
                    const { error } = await supabase.from('articles').insert([p]);
                    if (error) throw error;
                }
                showToast("Berhasil dikirim! Menunggu ulasan admin.", "success");
                app.navigate('home');
            } catch (err) { showToast(err.message, "error"); }
            finally { if(btn) { btn.innerHTML = "Kirim Pengajuan"; btn.disabled = false; } }
        };

        window.submitAdminForm = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn_a'); btn.innerHTML = "Menerbitkan..."; btn.disabled = true;
            try {
                const img = await uploadFileKeSupabase('a_image');
                const rawSocial = document.getElementById('a_social') ? document.getElementById('a_social').value.trim() : '';
                const combinedAuthor = rawSocial ? `Zeniopost ||| ${rawSocial}` : 'Zeniopost';

                const p = {
                    title: document.getElementById('a_title').value,
                    topic_id: document.getElementById('a_topic').value,
                    image_url: img,
                    content: document.getElementById('a_content').value,
                    author_name: combinedAuthor,
                    status: 'approved',
                    is_official: true,
                    created_at: new Date().toISOString()
                };
                if(IS_PREVIEW) { p.id = Date.now().toString(); mockArticles.unshift(p); }
                else {
                    const { error } = await supabase.from('articles').insert([p]);
                    if (error) throw error;
                }
                showToast("Artikel resmi diterbitkan!", "success");
                await fetchData();
                renderApp();
            } catch (err) { showToast(err.message, "error"); }
            finally { if(btn) { btn.innerHTML = "<i class='fas fa-paper-plane'></i> Terbitkan"; btn.disabled = false; } }
        };

        window.actArt = async (id, act) => {
            try {
                if(IS_PREVIEW) {
                    if(act === 'acc') mockArticles.find(x => String(x.id) === String(id)).status = 'approved';
                    if(act === 'del') mockArticles = mockArticles.filter(x => String(x.id) !== String(id));
                } else {
                    if(act === 'acc') await supabase.from('articles').update({status: 'approved'}).eq('id', id);
                    if(act === 'del') await supabase.from('articles').delete().eq('id', id);
                }
                showToast(act === 'acc' ? "Diterima & Tayang!" : "Artikel Dihapus!", "success");
                await fetchData();
                renderApp();
            } catch (err) {
                showToast(err.message, "error");
            }
        };

        // Tutup modal saat area gelap di luar pop-up diklik
        document.getElementById('modal-container').addEventListener('click', () => {
            window.closeModal();
        });

        const init = async () => {
            if(!IS_PREVIEW && supabase) {
                const { data } = await supabase.auth.getSession();
                appState.user = data.session?.user || null;
            }
            await fetchData();
            renderApp();

            // Cek apakah pengguna membuka link dari hasil Share WhatsApp (?article=ID)
            const params = new URLSearchParams(window.location.search);
            const sharedArticleId = params.get('article');
            if (sharedArticleId) {
                window.openArticlePopup(sharedArticleId);
            }
        };

        init();
    </script>
</body>
</html>
