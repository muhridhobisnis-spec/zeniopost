                            <div class="text-slate-800 text-base leading-relaxed">${sanitizeAndFormatArticleHtml(a.content)}</div>
                        </div>

                        <!-- Kelola Komentar Artikel Ini di Modal Admin -->
                        ${renderCommentsSection(a.id, 'adminmod')}

                        <!-- Footer Aksi Cepat di Tab Preview -->
                        <div class="pt-3 border-t border-slate-100 flex flex-wrap gap-3 justify-between items-center">
                            <button type="button" onclick="window.switchAdminModalTab('edit')" class="bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 px-5 rounded-xl text-xs md:text-sm flex items-center gap-2 transition">
                                <i class="fas fa-pen-to-square"></i> Edit Teks / Ganti Gambar
                            </button>
                            <div class="flex flex-wrap gap-2 ml-auto">
                                ${isPending ? `
                                    <button type="button" onclick="window.actArt('${a.id}', 'acc'); window.closeModal();" class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-5 rounded-xl text-xs md:text-sm shadow-md flex items-center gap-2 transition">
                                        <i class="fas fa-check-circle"></i> Setujui & Tayangkan
                                    </button>
                                ` : ''}
                                <button type="button" onclick="window.actArt('${a.id}', 'del'); window.closeModal();" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 font-bold py-3 px-4 rounded-xl text-xs md:text-sm flex items-center gap-2 transition">
                                    <i class="fas fa-trash"></i> ${isPending ? 'Tolak & Hapus' : 'Hapus Artikel'}
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- TAB 2: FORM EDIT TEKS, GAMBAR & SOSIAL MEDIA -->
                    <form id="admin-tab-edit" onsubmit="window.saveAdminEdit(event, '${a.id}')" class="${initialTab === 'edit' ? 'block' : 'hidden'} overflow-y-auto p-6 space-y-4 flex-1">
                        <div class="bg-blue-50 border border-blue-100 p-3.5 rounded-2xl text-xs font-bold text-blue-800 flex items-center gap-2.5">
                            <i class="fas fa-lightbulb text-blue-600 text-base"></i>
                            <span>Anda dapat memperbaiki judul, memformat isi teks berita (Tebal, Miring, Garis Bawah, Rata Kiri/Tengah/Kanan), mengganti gambar, atau menyesuaikan informasi penulis.</span>
                        </div>

                        <!-- Edit Judul & Kategori -->
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div class="md:col-span-2">
                                <label class="block text-xs font-extrabold text-slate-600 mb-1.5">Judul Artikel</label>
                                <input type="text" id="edit_title" required value="${safeTitle}" class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl font-bold text-sm outline-none focus:border-blue-500">
                            </div>
                            <div>
                                <label class="block text-xs font-extrabold text-slate-600 mb-1.5">Kategori / Topik</label>
                                <select id="edit_topic" required class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl font-bold text-sm outline-none focus:border-blue-500">
                                    ${appState.topics.map(t => `<option value="${t.id}" ${String(t.id) === String(a.topic_id) ? 'selected' : ''}>${t.name}</option>`).join('')}
                                </select>
                            </div>
                        </div>

                        <!-- Edit / Ganti Gambar Artikel -->
                        <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200 space-y-3">
                            <label class="block text-xs font-extrabold text-slate-600">Gambar Artikel Saat Ini & Opsi Ganti Gambar</label>
                            <div class="flex flex-col sm:flex-row gap-4 items-start sm:items-center">
                                <img id="edit_img_preview" src="${a.image_url}" alt="Preview Gambar" class="w-full sm:w-44 h-28 object-cover rounded-xl border border-slate-200 bg-white shrink-0">
                                <div class="flex-1 w-full space-y-2">
                                    <label class="block text-[11px] font-bold text-slate-500">Unggah File Gambar Baru (Kosongkan jika tidak ingin mengganti gambar):</label>
                                    <input type="file" id="edit_image_file" accept="image/*" onchange="window.previewAdminEditImage(event)" class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-3.5 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-blue-600 file:text-white cursor-pointer bg-white p-2 rounded-xl border border-slate-200">
                                </div>
                            </div>
                        </div>

                        <!-- Edit Penulis & Sosial Media -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-extrabold text-slate-600 mb-1.5">Nama Penulis</label>
                                <input type="text" id="edit_author" required value="${a.is_official ? 'Zeniopost' : safeAuthor}" ${a.is_official ? 'readonly' : ''} class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl font-bold text-sm outline-none focus:border-blue-500">
                            </div>
                            <div>
                                <label class="block text-xs font-extrabold text-slate-600 mb-1.5">Link / Username Sosmed Penulis (Opsional)</label>
                                <div class="flex gap-2">
                                    <input type="text" id="edit_social" value="${safeSocial}" placeholder="Contoh: @username atau https://..." class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl font-bold text-sm outline-none focus:border-blue-500">
                                    <button type="button" onclick="window.testAdminSocialInput()" title="Cek Link Sosial Media" class="shrink-0 px-3.5 bg-blue-50 hover:bg-blue-100 text-blue-600 border border-blue-200 rounded-xl text-xs font-extrabold flex items-center gap-1 transition">
                                        <i class="fas fa-external-link-alt"></i> Cek
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Edit Isi Berita Lengkap dengan Rich Text Toolbar -->
                        <div>
                            <label class="block text-xs font-extrabold text-slate-600 mb-1.5">Isi Teks Berita Lengkap</label>
                            ${renderRichTextEditor('edit_content', 'Tulis isi berita lengkap...', a.content || '', 'min-h-[220px]')}
                        </div>

                        <!-- Tombol Simpan Edit / Simpan & Tayangkan -->
                        <div class="pt-3 border-t border-slate-100 flex flex-wrap gap-3 justify-end items-center">
                            <button type="button" onclick="window.switchAdminModalTab('preview')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 px-4 rounded-xl text-xs md:text-sm transition">
                                Batal / Kembali ke Preview
                            </button>
                            <button type="submit" id="btn_save_edit" class="bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 px-5 rounded-xl text-xs md:text-sm shadow-sm flex items-center gap-2 transition">
                                <i class="fas fa-save"></i> Simpan Perubahan
                            </button>
                            ${isPending ? `
                                <button type="button" id="btn_save_approve" onclick="window.saveAdminEdit(event, '${a.id}', true)" class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-5 rounded-xl text-xs md:text-sm shadow-md flex items-center gap-2 transition">
                                    <i class="fas fa-check-double"></i> Simpan & Langsung Tayangkan
                                </button>
                            ` : ''}
                        </div>
                    </form>
                </div>
            `;
        };

        window.switchAdminModalTab = (tab) => {
            const pTab = document.getElementById('admin-tab-preview');
            const eTab = document.getElementById('admin-tab-edit');
            const pBtn = document.getElementById('tab-btn-preview');
            const eBtn = document.getElementById('tab-btn-edit');
            if (!pTab || !eTab) return;

            if (tab === 'edit') {
                pTab.classList.add('hidden');
                eTab.classList.remove('hidden');
                if (eBtn) eBtn.className = 'px-3 py-1.5 rounded-lg text-xs font-extrabold transition bg-blue-600 text-white';
                if (pBtn) pBtn.className = 'px-3 py-1.5 rounded-lg text-xs font-extrabold transition text-slate-300 hover:text-white';
            } else {
                eTab.classList.add('hidden');
                pTab.classList.remove('hidden');
                if (pBtn) pBtn.className = 'px-3 py-1.5 rounded-lg text-xs font-extrabold transition bg-blue-600 text-white';
                if (eBtn) eBtn.className = 'px-3 py-1.5 rounded-lg text-xs font-extrabold transition text-slate-300 hover:text-white';
            }
        };

        window.previewAdminEditImage = (event) => {
            const file = event.target.files[0];
            const imgEl = document.getElementById('edit_img_preview');
            if (file && imgEl) {
                const reader = new FileReader();
                reader.onload = e => { imgEl.src = e.target.result; };
                reader.readAsDataURL(file);
            }
        };

        window.testAdminSocialInput = () => {
            const val = (document.getElementById('edit_social')?.value || '').trim();
            if (!val) {
                showToast('Kolom sosial media masih kosong.', 'info');
                return;
            }
            const parsed = parseAuthorInfo({ author_name: `Tester ||| ${val}` });
            if (parsed.socialUrl) {
                window.open(parsed.socialUrl, '_blank', 'noopener,noreferrer');
            }
        };

        window.saveAdminEdit = async (e, articleId, approveAfterSave = false) => {
            if (e) e.preventDefault();
            const target = appState.articles.find(x => String(x.id) === String(articleId));
            if (!target) return;

            const editorData = getRichEditorContent('edit_content');
            if (!editorData.text) {
                showToast('Isi teks berita tidak boleh kosong.', 'error');
                return;
            }

            const btnSave = document.getElementById('btn_save_edit');
            const btnAcc = document.getElementById('btn_save_approve');
            if (btnSave) { btnSave.innerHTML = 'Menyimpan...'; btnSave.disabled = true; }
            if (btnAcc) { btnAcc.innerHTML = 'Memproses...'; btnAcc.disabled = true; }

            try {
                let newImageUrl = target.image_url;
                const fileInput = document.getElementById('edit_image_file');
                if (fileInput && fileInput.files && fileInput.files[0]) {
                    newImageUrl = await uploadFileKeSupabase('edit_image_file');
                }

                const newTitle = document.getElementById('edit_title').value.trim();
                const newTopic = document.getElementById('edit_topic').value;
                const newContent = editorData.html;
                const rawName = (document.getElementById('edit_author').value || 'Anonim').trim();
                const rawSocial = (document.getElementById('edit_social').value || '').trim();
                const combinedAuthor = rawSocial ? `${rawName} ||| ${rawSocial}` : rawName;
                const nextStatus = approveAfterSave ? 'approved' : target.status;

                const updatedFields = {
                    title: newTitle,
                    topic_id: newTopic,
                    image_url: newImageUrl,
                    content: newContent,
                    author_name: combinedAuthor,
                    status: nextStatus
                };

                if (IS_PREVIEW) {
                    Object.assign(target, updatedFields);
                } else {
                    const { error } = await supabase.from('articles').update(updatedFields).eq('id', articleId);
                    if (error) throw error;
                }

                showToast(
                    approveAfterSave 
                        ? 'Perubahan disimpan & artikel resmi ditayangkan!' 
                        : 'Perubahan artikel berhasil disimpan!',
                    'success'
                );
                await fetchData();
                renderApp();
                window.closeModal();
            } catch (err) {
                showToast(err.message || 'Gagal menyimpan perubahan.', 'error');
                if (btnSave) { btnSave.innerHTML = '<i class="fas fa-save"></i> Simpan Perubahan'; btnSave.disabled = false; }
                if (btnAcc) { btnAcc.innerHTML = '<i class="fas fa-check-double"></i> Simpan & Langsung Tayangkan'; btnAcc.disabled = false; }
            }
        };

        window.previewImageUpload = (event, elId) => {
            const f = event.target.files[0];
            const el = document.getElementById(elId);
            if(f) {
                const r = new FileReader();
                r.onload = e => { el.style.backgroundImage = `url('${e.target.result}')`; el.classList.remove('hidden'); };
                r.readAsDataURL(f);
            } else {
                el.classList.add('hidden');
            }
        };

        const uploadFileKeSupabase = async (fileInputId) => {
            if(IS_PREVIEW) return 'https://placehold.co/800x500/slate/white?text=Gambar+Berhasil+Diunggah';
            const file = document.getElementById(fileInputId).files[0];
            if(!file) return null;
            const ext = file.name.split('.').pop();
            const filename = `${Math.random().toString(36).substring(2, 15)}.${ext}`;
            const { error } = await supabase.storage.from('news-images').upload(filename, file);
            if(error) throw error;
            const { data } = supabase.storage.from('news-images').getPublicUrl(filename);
            return data.publicUrl;
        };

        const fetchData = async () => {
            if(IS_PREVIEW) {
                appState.topics = [...mockTopics];
                appState.articles = appState.user ? mockArticles : mockArticles.filter(a => a.status === 'approved');
                appState.comments = [...mockComments];
                return;
            }
            
            try {
                const { data: tData, error: tErr } = await supabase.from('topics').select('*').order('created_at');
                appState.topics = (!tErr && tData) ? tData : [];
                
                let query = supabase.from('articles').select('*').order('created_at', {ascending: false});
                if(!appState.user) query = query.eq('status', 'approved');
                const { data: aData } = await query;
                appState.articles = aData || [];

                const { data: cData, error: cErr } = await supabase.from('comments').select('*').order('created_at', {ascending: false});
                if (!cErr && cData) {
                    appState.comments = cData;
                }
            } catch (err) {
                console.error("Gagal memuat data:", err);
                appState.topics = [];
            }
        };

        // =====================================================================
        // FITUR KELOLA KATEGORI / TOPIK (TAMBAH, EDIT, HAPUS KHUSUS ADMIN)
        // =====================================================================
        window.addTopic = async (e) => {
            e.preventDefault();
            const inputEl = document.getElementById('new_topic_name');
            const btnEl = document.getElementById('btn_add_topic');
            const name = (inputEl?.value || '').trim();

            if (!name) {
                showToast('Nama kategori tidak boleh kosong.', 'error');
                return;
            }

            const isDuplicate = appState.topics.some(t => (t.name || '').toLowerCase() === name.toLowerCase());
            if (isDuplicate) {
                showToast('Kategori dengan nama tersebut sudah ada.', 'error');
                return;
            }

            if (btnEl) {
                btnEl.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
                btnEl.disabled = true;
            }

            try {
                if (IS_PREVIEW) {
                    mockTopics.push({ id: 't_' + Date.now(), name, created_at: new Date().toISOString() });
                } else {
                    const { error } = await supabase.from('topics').insert([{ name }]);
                    if (error) throw error;
                }
                if (inputEl) inputEl.value = '';
                showToast(`Kategori "${name}" berhasil ditambahkan!`, 'success');
                await fetchData();
                renderApp();
            } catch (err) {
                showToast(err.message || 'Gagal menambahkan kategori.', 'error');
                if (btnEl) {
                    btnEl.innerHTML = '<i class="fas fa-plus"></i> Tambah';
                    btnEl.disabled = false;
                }
            }
        };

        window.startEditTopic = (topicId) => {
            appState.editingTopicId = String(topicId);
            appState.deletingTopicId = null;
            renderApp();
            setTimeout(() => {
                const input = document.getElementById(`edit_topic_input_${topicId}`);
                if (input) {
                    input.focus();
                    input.select();
                }
            }, 50);
        };

        window.cancelEditTopic = () => {
            appState.editingTopicId = null;
            renderApp();
        };

        window.saveEditTopic = async (topicId) => {
            const inputEl = document.getElementById(`edit_topic_input_${topicId}`);
            const newName = (inputEl?.value || '').trim();

            if (!newName) {
                showToast('Nama kategori tidak boleh kosong.', 'error');
                return;
            }

            try {
                if (IS_PREVIEW) {
                    const target = mockTopics.find(t => String(t.id) === String(topicId));
                    if (target) target.name = newName;
                } else {
                    const { error } = await supabase.from('topics').update({ name: newName }).eq('id', topicId);
                    if (error) throw error;
                }
                appState.editingTopicId = null;
                showToast('Nama kategori berhasil diperbarui!', 'success');
                await fetchData();
                renderApp();
            } catch (err) {
                showToast(err.message || 'Gagal mengubah nama kategori.', 'error');
            }
        };

            appState.deletingTopicId = String(topicId);
            appState.editingTopicId = null;
            renderApp();
        };

        window.cancelDeleteTopic = () => {
            appState.deletingTopicId = null;
            renderApp();
        };

        window.confirmDeleteTopic = async (topicId) => {
            try {
                if (IS_PREVIEW) {
                    mockTopics = mockTopics.filter(t => String(t.id) !== String(topicId));
                } else {
                    const { error } = await supabase.from('topics').delete().eq('id', topicId);
                    if (error) throw error;
                }
                appState.deletingTopicId = null;
                showToast('Kategori berhasil dihapus!', 'success');

        const renderHeader = () => `

                <button onclick="app.navigate('trending')" class="flex flex-col items-center justify-center w-full space-y-1 transition ${appState.view === 'trending' ? 'text-orange-500' : 'text-slate-400'}"><i class="fas fa-fire text-xl"></i><span class="text-[10px] font-bold">Trending</span></button>

                content = `

                                                </div>
                                            ` : appState.topics.map(t => {
                                                const isEditing = String(appState.editingTopicId) === String(t.id);
                                                const isDeleting = String(appState.deletingTopicId) === String(t.id);
                                                const countArt = appState.articles.filter(art => String(art.topic_id) === String(t.id)).length;
                                                const safeTopicName = (t.name || '').replace(/"/g, '&quot;');

                                                if (isEditing) {
                                                    return `
                                                        <div class="p-3 rounded-2xl bg-blue-50/70 border border-blue-200 space-y-2">
                                                            <div class="text-[10px] font-extrabold text-blue-600 uppercase tracking-wider">Edit Nama Kategori</div>
                                                            <div class="flex gap-1.5">
                                                                <input type="text"
                                                                       id="edit_topic_input_${t.id}"
                                                                       value="${safeTopicName}"
                                                                       maxlength="40"
                                                                       onkeydown="if(event.key==='Enter'){event.preventDefault();window.saveEditTopic('${t.id}');}else if(event.key==='Escape'){window.cancelEditTopic();}"
                                                                       class="flex-1 p-2.5 bg-white border border-blue-300 rounded-xl text-xs font-bold outline-none focus:border-blue-600">
                                                                <button type="button"
                                                                        onclick="window.saveEditTopic('${t.id}')"
                                                                        class="bg-green-500 hover:bg-green-600 text-white px-3 py-2 rounded-xl text-xs font-extrabold transition">
                                                                    <i class="fas fa-check"></i> Simpan
                                                                </button>
                                                                <button type="button"
                                                                        onclick="window.cancelEditTopic()"
                                                                        class="bg-white hover:bg-slate-100 text-slate-600 border border-slate-200 px-2.5 py-2 rounded-xl text-xs font-bold transition">
                                                                    Batal
                                                                </button>
                                                            </div>
                                                        </div>
                                                    `;
                                                }

                                                if (isDeleting) {
                                                    return `
                                                        <div class="p-3 rounded-2xl bg-red-50 border border-red-200 flex items-center justify-between gap-2">
                                                            <div class="text-xs font-bold text-red-700 leading-snug">
                                                                Hapus kategori <strong class="font-extrabold">"${t.name}"</strong>?
                                                            </div>
                                                            <div class="flex items-center gap-1.5 shrink-0">
                                                                <button type="button"
                                                                        onclick="window.confirmDeleteTopic('${t.id}')"
                                                                        class="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-lg text-xs font-extrabold transition">
                                                                    Ya, Hapus
                                                                </button>
                                                                <button type="button"
                                                                        onclick="window.cancelDeleteTopic()"
                                                                        class="bg-white hover:bg-slate-100 text-slate-600 border border-slate-200 px-2.5 py-1.5 rounded-lg text-xs font-bold transition">
                                                                    Batal
                                                                </button>
                                                            </div>
                                                        </div>
                                                    `;
                                                }

                                                return `
                                                    <div class="p-3 rounded-2xl bg-slate-50 hover:bg-slate-100/80 border border-slate-200/80 flex items-center justify-between gap-2 transition">
                                                        <div class="min-w-0">
                                                            <div class="font-extrabold text-xs md:text-sm text-slate-800 truncate">${t.name}</div>
                                                            <div class="text-[10px] font-bold text-slate-400">${countArt} Artikel</div>
                                                        </div>
                                                        <div class="flex items-center gap-1.5 shrink-0">
                                                            <button type="button"
                                                                    onclick="window.startEditTopic('${t.id}')"
                                                                    title="Edit Nama Kategori"
                                                                    class="bg-white hover:bg-blue-50 text-blue-600 border border-slate-200 hover:border-blue-200 px-2.5 py-1.5 rounded-lg text-xs font-bold transition">
                                                                <i class="fas fa-pen"></i> Edit
                                                            </button>
                                                            <button type="button"
                                                                    onclick="window.askDeleteTopic('${t.id}')"
                                                                    title="Hapus Kategori"
                                                                    class="bg-white hover:bg-red-50 text-red-500 border border-slate-200 hover:border-red-200 px-2.5 py-1.5 rounded-lg text-xs font-bold transition">
                                                                <i class="fas fa-trash-alt"></i>
                                                            </button>
                                                        </div>
                                                    </div>
                                                `;
                                            }).join('')}
                                        </div>
                                    </div>

                                    <!-- FORM TULIS RESMI DENGAN RICH TEXT EDITOR -->
                                    <div class="bg-blue-50 border border-blue-100 p-6 rounded-3xl">
                                        <h3 class="font-extrabold text-blue-900 mb-4"><i class="fas fa-pen-nib"></i> Terbitkan Resmi</h3>
                                        <form onsubmit="window.submitAdminForm(event)" class="space-y-3">
                                            <input type="text" id="a_title" required placeholder="Judul Berita" class="w-full p-3 bg-white rounded-xl text-sm font-bold border border-blue-100 outline-none">
                                            <select id="a_topic" required class="w-full p-3 bg-white rounded-xl text-sm font-bold border border-blue-100 outline-none">
                                                <option value="">Kategori...</option>${appState.topics.map(t => `<option value="${t.id}">${t.name}</option>`).join('')}
                                            </select>
                                            <input type="file" id="a_image" accept="image/*" required class="w-full text-xs file:mr-2 file:py-1 file:px-3 file:rounded file:border-0 file:bg-blue-600 file:text-white bg-white p-2 rounded-xl">
                                            <div>
                                                ${renderRichTextEditor('a_content', 'Tulis isi berita resmi...', '', 'min-h-[140px]')}
                                            </div>
                                            <input type="text" id="a_social" placeholder="Sosmed (Opsional, misal @zeniopost)" class="w-full p-3 bg-white rounded-xl text-sm font-bold border border-blue-100 outline-none">
                                            <button type="submit" id="btn_a" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl shadow-sm text-sm"><i class="fas fa-paper-plane"></i> Terbitkan</button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>`;
                }
            }

            return content;
        };

        const renderApp = () => {
            const root = document.getElementById('app');
            const content = buildMainContent();

            root.innerHTML = `
                ${renderHeader()}
                <div class="flex w-full min-h-[calc(100vh-64px)]">
                    ${renderNav()}
                    <main id="main-content" class="flex-1 md:ml-64 pb-24 md:pb-10 relative">${content}</main>
                </div>
            `;
        };

        window.login = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn_l'); btn.innerHTML = "Memproses..."; btn.disabled = true;
            try {
                if(IS_PREVIEW) { appState.user = { id: 'admin1' }; }
                else {
                    const { data, error } = await supabase.auth.signInWithPassword({
                        email: document.getElementById('l_email').value,
                        password: document.getElementById('l_pass').value
                    });
                    if (error) throw error;
                    appState.user = data.user;
                }
                showToast("Berhasil Login Admin!", "success");
                await fetchData();
                app.navigate('admin');
            } catch (err) { showToast(err.message, "error"); }
            finally { if(btn) { btn.innerHTML = "Masuk"; btn.disabled = false; } }
        };

        window.submitPublicForm = async (e) => {
            e.preventDefault();
            const editorData = getRichEditorContent('f_content');
            if (!editorData.text) {
                showToast("Isi berita tidak boleh kosong.", "error");
                return;
            }

            const btn = document.getElementById('btn_f'); btn.innerHTML = "Mengunggah..."; btn.disabled = true;
            try {
                const img = await uploadFileKeSupabase('f_image');
                const rawName = document.getElementById('f_author').value.trim();
                const rawSocial = document.getElementById('f_social').value.trim();
                const combinedAuthor = rawSocial ? `${rawName} ||| ${rawSocial}` : rawName;

                const p = {
                    title: document.getElementById('f_title').value,
                    topic_id: document.getElementById('f_topic').value,
                    image_url: img,
                    content: editorData.html,
                    author_name: combinedAuthor,
                    status: 'pending',
                    is_official: false,
                    created_at: new Date().toISOString()
                };
                if(IS_PREVIEW) { p.id = Date.now().toString(); mockArticles.unshift(p); }
                else {
                    const { error } = await supabase.from('articles').insert([p]);
                    if (error) throw error;
                }
                showToast("Berhasil dikirim! Menunggu ulasan admin.", "success");
                app.navigate('home');
            } catch (err) { showToast(err.message, "error"); }
            finally { if(btn) { btn.innerHTML = "Kirim Pengajuan"; btn.disabled = false; } }
        };

        window.submitAdminForm = async (e) => {
            e.preventDefault();
            const editorData = getRichEditorContent('a_content');
            if (!editorData.text) {
                showToast("Isi berita tidak boleh kosong.", "error");
                return;
            }

            const btn = document.getElementById('btn_a'); btn.innerHTML = "Menerbitkan..."; btn.disabled = true;
            try {
                const img = await uploadFileKeSupabase('a_image');
                const rawSocial = document.getElementById('a_social') ? document.getElementById('a_social').value.trim() : '';
                const combinedAuthor = rawSocial ? `Zeniopost ||| ${rawSocial}` : 'Zeniopost';

                const p = {
                    title: document.getElementById('a_title').value,
                    topic_id: document.getElementById('a_topic').value,
                    image_url: img,
                    content: editorData.html,
                    author_name: combinedAuthor,
                    status: 'approved',
                    is_official: true,
                    created_at: new Date().toISOString()
                };
                if(IS_PREVIEW) { p.id = Date.now().toString(); mockArticles.unshift(p); }
                else {
                    const { error } = await supabase.from('articles').insert([p]);
                    if (error) throw error;
                }
                showToast("Artikel resmi diterbitkan!", "success");
                await fetchData();
                renderApp();
            } catch (err) { showToast(err.message, "error"); }
            finally { if(btn) { btn.innerHTML = "<i class='fas fa-paper-plane'></i> Terbitkan"; btn.disabled = false; } }
        };

        window.actArt = async (id, act) => {
            try {
                if(IS_PREVIEW) {
                    if(act === 'acc') mockArticles.find(x => String(x.id) === String(id)).status = 'approved';
                    if(act === 'del') mockArticles = mockArticles.filter(x => String(x.id) !== String(id));
                } else {
                    if(act === 'acc') await supabase.from('articles').update({status: 'approved'}).eq('id', id);
                    if(act === 'del') await supabase.from('articles').delete().eq('id', id);
                }
                showToast(act === 'acc' ? "Diterima & Tayang!" : "Artikel Dihapus!", "success");
                await fetchData();
                renderApp();
            } catch (err) {
                showToast(err.message, "error");
            }
        };

        // Tutup modal saat area gelap di luar pop-up diklik
        document.getElementById('modal-container').addEventListener('click', () => {
            window.closeModal();
        });

        const init = async () => {
            renderApp();
            checkDynamicShareEndpoint();
            if(!IS_PREVIEW && supabase) {
                const { data } = await supabase.auth.getSession();
                appState.user = data.session?.user || null;
            }
            await fetchData();

            // Jika pengunjung membuka link berita yang disebar (?article=ID), langsung arahkan ke isi artikel di web utama
            const params = new URLSearchParams(window.location.search);
            const sharedArticleId = params.get('article');
            if (sharedArticleId) {
                const found = appState.articles.find(x => String(x.id) === String(sharedArticleId));
                if (found) {
                    app.navigate('article', found);
                    return;
                }
            }

            renderApp();
        };

        init();
    </script>

</body></html>
