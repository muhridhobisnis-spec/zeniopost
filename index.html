                    </button>
                    <button onclick="app.navigate('topics')" class="flex items-center gap-3.5 p-3.5 rounded-2xl transition font-bold text-sm ${appState.view === 'topics' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-700 hover:bg-slate-50'}"><i class="fas fa-layer-group w-5"></i> Kategori Topik</button>

                    `}
                    <button onclick="app.navigate('chat')" class="flex items-center justify-between p-3.5 rounded-2xl transition font-bold text-sm ${appState.view === 'chat' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-700 hover:bg-slate-50'}">
                        <span class="flex items-center gap-3.5"><i class="fas fa-comments w-5 ${appState.view === 'chat' ? 'text-white' : 'text-slate-700'}"></i> Chat Admin</span>

                </nav>

                <nav class="md:hidden fixed bottom-0 left-0 right-0 w-full max-w-full bg-white/95 backdrop-blur-md border-t border-slate-200/80 flex justify-around items-center h-[68px] z-50 pb-safe shadow-[0_-8px_20px_rgba(15,23,42,0.06)] rounded-t-3xl px-1">
                    <button onclick="app.navigate('home')" class="flex flex-col items-center justify-center w-full space-y-1 ${appState.view === 'home' ? 'text-blue-600' : 'text-slate-400'}"><i class="fas fa-home text-base"></i><span class="text-[10px] font-bold">Beranda</span></button>

                    ` : `
                        <button onclick="app.navigate('account'); window.switchUserDashTab('publish')" class="flex flex-col items-center justify-center w-full space-y-1 ${appState.view === 'account' && appState.userDashTab === 'publish' ? 'text-blue-600' : 'text-slate-400'}"><i class="fas fa-plus-circle text-base"></i><span class="text-[10px] font-bold">Publikasi</span></button>

                    <div>

                    ${!isPersonalPublish ? `

                            <label class="block text-xs font-extrabold text-slate-600 mb-1.5">Nama Penulis (Tamu)</label>
                            <input type="text" id="f_author" required placeholder="Nama Penulis (Wajib)" class="w-full p-3.5 sm:p-4 bg-slate-50 border border-slate-200 rounded-2xl font-bold text-sm outline-none focus:border-blue-500">
                        </div>
                    ` : `
                        <input type="hidden" id="f_author" value="${(appState.currentUser?.full_name || '').replace(/"/g, '&quot;')}">

                            <div class="flex items-center gap-3 min-w-0">
                                ${appState.currentUser?.avatar_url ? `

                                ` : `
                                    <div class="w-10 h-10 rounded-full bg-blue-600 text-white flex items-center justify-center font-extrabold text-sm shrink-0">${(appState.currentUser?.full_name || 'U').charAt(0).toUpperCase()}</div>

                                <div class="min-w-0">
                                    <div class="text-xs font-extrabold text-slate-900 flex items-center gap-1.5 truncate">
                                        <span>${appState.currentUser?.full_name}</span>
                                        <i class="fas fa-check-circle text-slate-400" title="Penulis Terverifikasi"></i>
                                    </div>
                                    <div class="text-[11px] font-semibold text-blue-600 truncate">Diterbitkan langsung dengan identitas akun resmi Anda</div>
                                </div>
                            </div>
                        </div>
                    `}

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-2">
                        <button type="button" onclick="window.previewSubmissionArticle()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-extrabold py-3.5 px-4 rounded-2xl text-xs md:text-sm flex items-center justify-center gap-2 transition">
                            <i class="fas fa-eye text-blue-600"></i> Pratinjau Berita

                            <i class="fas fa-save text-slate-600"></i> Simpan Draf
                        </button>

                            <i class="fas ${isPersonalPublish ? 'fa-globe' : 'fa-paper-plane'}"></i> ${isPersonalPublish ? (appState.editingDraftId ? 'Perbarui & Terbitkan' : 'Publikasikan Sekarang') : 'Kirim Pengajuan'}
                        </button>
                    </div>
                </form>
            `;
        };

        const buildMainContent = () => {
            // A. HALAMAN BACA ARTIKEL PENUH (DENGAN FOTO PROFIL AKUN RESMI & CENTANG ABU-ABU/BIRU)
            if (appState.view === 'article' && appState.readArticle) {
                const a = appState.readArticle;
                if (appState.countedInOpen !== String(a.id)) {
                    appState.countedInOpen = String(a.id);
                    recordArticleView(a.id);
                }
                const info = parseAuthorInfo(a);
                const isGuest = !appState.currentUser;
                const saved = isArticleSaved(a.id);

                return `
                    <div class="max-w-3xl mx-auto bg-white min-h-screen animate-fade pb-20 shadow-sm">
                        <div class="p-4 flex justify-between items-center gap-2 sticky top-16 sm:top-20 md:top-24 bg-white/95 backdrop-blur-md z-40 border-b border-slate-100">
                            <button onclick="app.navigate('home')" class="font-bold text-slate-700 bg-slate-50 border border-slate-200/80 hover:bg-slate-100 px-4 py-2 rounded-full text-xs md:text-sm transition"><i class="fas fa-arrow-left mr-2"></i>Kembali</button>
                            <div class="flex items-center gap-2">
                                <button onclick="window.toggleSaveArticle('${a.id}', event)" class="px-4 py-2 rounded-full text-xs font-extrabold border transition ${saved ? 'bg-blue-600 text-white border-blue-600' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-blue-50 hover:text-blue-600'}">

                                <div class="flex items-center gap-3.5">
                                    ${renderAuthorAvatar(a, info, 'w-12 h-12 text-lg')}

                                        <div class="text-base md:text-lg flex items-center gap-1.5">
                                            ${renderAuthorNameWithBadge(a, info, 'text-base')}
                                        </div>
                                        <p class="text-xs font-bold text-slate-400 mt-1 flex flex-wrap items-center gap-2">
                                            <span><i class="far fa-clock mr-1"></i>${formatWaktu(a.created_at)}</span>
                                            <span>•</span>
                                            <span class="text-blue-600 font-extrabold"><i class="far fa-eye mr-1"></i>${getArticleViews(a)}x dibaca</span>
                                        </p>
                                    </div>
                                </div>
                                ${!a.is_official && info.socialUrl ? `
                                    <a href="${info.socialUrl}" target="_blank" rel="noopener noreferrer" class="flex items-center gap-2 px-3.5 py-2 rounded-xl bg-white border border-blue-100 hover:border-blue-300 text-xs font-extrabold text-blue-600 shadow-sm">

                                    </a>
                                ` : ''}

                            <div class="text-base md:text-lg text-slate-700 leading-relaxed mb-10 break-words">${sanitizeAndFormatArticleHtml(a.content)}</div>

                            ${renderRecommendationsBlock(a, false)}
                        </div>
                    </div>
                `;
            }

            // B. HALAMAN BERANDA
            if (appState.view === 'home' || appState.view === 'topics') {
                const allApproved = appState.articles.filter(a => a.status === 'approved');

                const visibleList = filtered.slice(0, appState.visibleCount);
                const hasMore = filtered.length > visibleList.length;

                return `
                    <div class="max-w-6xl mx-auto w-full min-w-0 p-3.5 sm:p-5 md:p-8 animate-fade">

                            <h2 class="text-lg sm:text-xl md:text-2xl font-extrabold text-slate-900 truncate">

                    <div class="max-w-6xl mx-auto w-full min-w-0 p-3.5 sm:p-5 md:p-8 animate-fade">
                        <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm mb-6 flex flex-wrap items-center justify-between gap-4">
                            <div class="flex items-center gap-3.5">
                                <div class="w-12 h-12 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center text-xl"><i class="fas fa-bookmark"></i></div>

                                    <h1 class="text-xl md:text-2xl font-extrabold text-slate-900">Daftar Berita Tersimpan</h1>

                                <i class="far fa-bookmark text-4xl text-slate-300 block"></i>
                                <p class="text-slate-500 font-bold text-sm">Anda belum menyimpan artikel apa pun di akun ini.</p>
                                <button onclick="app.navigate('home')" class="bg-blue-600 text-white text-xs font-extrabold px-5 py-2.5 rounded-xl">Jelajahi Berita</button>
                            </div>
                        ` : `
                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 sm:gap-6">
                                ${savedList.map(a => renderArticleCard(a)).join('')}
                            </div>

                    </div>
                `;
            }

            // E. HALAMAN PENGAJUAN ARTIKEL KHUSUS TAMU (JIKA USER LOGIN OTOMATIS DIARAHKAN KE PUBLIKASI PRIBADI DI DASHBOARD)
            if (appState.view === 'submit') {
                if (appState.currentUser) {
                    appState.view = 'account';
                    appState.userDashTab = 'publish';
                    return buildMainContent();

                return `
                    <div class="max-w-3xl mx-auto w-full min-w-0 p-3.5 sm:p-5 md:p-8 animate-fade space-y-6">
                        <div class="bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-slate-100">
                            <div class="flex flex-wrap items-center justify-between gap-2 mb-6">
                                <div>
                                    <h2 class="text-xl md:text-2xl font-extrabold text-slate-900 flex items-center gap-2.5"><i class="fas fa-pen-nib text-blue-600"></i> Ajukan Artikel (Tamu)</h2>
                                    <p class="text-xs font-semibold text-slate-500 mt-1">Ingin menerbitkan berita langsung tanpa antrean & mendapat centang terverifikasi? <button type="button" onclick="app.navigate('account')" class="text-blue-600 font-extrabold hover:underline">Masuk / Buat Akun Zeniopost</button></p>
                                </div>
                                <span class="text-xs font-bold bg-slate-100 text-slate-700 px-3 py-1 rounded-full">Menunggu Persetujuan Admin</span>

                        </div>
                    </div>
                `;

            if (appState.view === 'account') {
                if (appState.currentUser) {
                    const u = appState.currentUser;
                    const myArticles = appState.articles.filter(a => String(a.user_id) === String(u.id));
                    const myApprovedArticles = myArticles.filter(a => a.status === 'approved');
                    const myDraftArticles = myArticles.filter(a => a.status === 'draft');
                    const totalMyViews = myApprovedArticles.reduce((acc, cur) => acc + getArticleViews(cur), 0);
                    const totalMyComments = myApprovedArticles.reduce((acc, cur) => acc + getArticleComments(cur.id).length, 0);

                    return `

                                            ` : `
                                                <div class="w-24 h-24 sm:w-28 sm:h-28 rounded-3xl bg-blue-600 text-white flex items-center justify-center text-4xl font-extrabold border-4 border-white shadow-md">
                                                    ${(u.full_name || 'U').charAt(0).toUpperCase()}
                                                </div>
                                            `}
                                        </div>

                                        <div class="space-y-1 pt-1 sm:pb-1">
                                            <div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-600 text-[11px] font-extrabold">
                                                <i class="fas fa-check-circle text-slate-400"></i> Akun Penulis Resmi
                                            </div>
                                            <h2 class="text-xl sm:text-2xl font-extrabold text-slate-900 flex items-center gap-1.5">
                                                <span>${u.full_name}</span>
                                                <i class="fas fa-check-circle text-slate-400 text-lg" title="Penulis Terverifikasi"></i>
                                            </h2>
                                            <p class="text-xs sm:text-sm font-bold text-blue-600">${u.email}</p>
                                        </div>
                                    </div>

                                        <label class="cursor-pointer bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-extrabold px-3.5 py-2.5 rounded-xl transition flex items-center gap-1.5">
                                            <i class="fas fa-camera text-blue-600"></i> <span>${u.avatar_url ? 'Ganti Foto' : 'Unggah Foto'}</span>

                                        </label>
                                        ${u.avatar_url ? `
                                            <button onclick="window.handleRemoveAvatar()" class="bg-slate-100 hover:bg-rose-50 text-slate-600 hover:text-rose-600 text-xs font-extrabold px-3 py-2.5 rounded-xl transition" title="Hapus Foto Profil">
                                                <i class="fas fa-trash-alt"></i>
                                            </button>
                                        ` : ''}
                                        <button onclick="window.switchUserDashTab('publish')" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-extrabold px-4 py-2.5 rounded-xl shadow-sm transition flex items-center gap-1.5">
                                            <i class="fas fa-plus-circle"></i> <span>Publikasi Berita Baru</span>

                                        <i class="fas fa-check mr-1"></i> Simpan Foto
                                    </button>
                                </div>

                                <!-- Navigasi Tab Dashboard Pribadi Pengguna -->
                                <div class="px-5 sm:px-8 border-t border-slate-100 bg-slate-50/50 flex items-center gap-1.5 overflow-x-auto no-scrollbar py-2.5">
                                    <button onclick="window.switchUserDashTab('overview')" class="shrink-0 px-4 py-2 rounded-xl text-xs font-extrabold transition flex items-center gap-1.5 ${appState.userDashTab === 'overview' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-600 hover:bg-white'}">
                                        <i class="fas fa-chart-pie"></i> Ringkasan & Analitik
                                    </button>
                                    <button onclick="window.switchUserDashTab('publish')" class="shrink-0 px-4 py-2 rounded-xl text-xs font-extrabold transition flex items-center gap-1.5 ${appState.userDashTab === 'publish' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-600 hover:bg-white'}">
                                        <i class="fas fa-feather-pointed"></i> ${appState.editingDraftId ? 'Edit Artikel / Draf' : 'Publikasi Berita Pribadi'}
                                    </button>
                                    <button onclick="window.switchUserDashTab('articles')" class="shrink-0 px-4 py-2 rounded-xl text-xs font-extrabold transition flex items-center gap-1.5 ${appState.userDashTab === 'articles' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-600 hover:bg-white'}">

                            ${appState.userDashTab === 'publish' ? `
                                <div class="bg-white rounded-3xl p-5 sm:p-8 shadow-sm border border-slate-100 space-y-5">
                                    <div class="flex flex-wrap items-center justify-between gap-2 pb-4 border-b border-slate-100">
                                        <div>
                                            <h3 class="text-lg sm:text-xl font-extrabold text-slate-900 flex items-center gap-2">

                                            <p class="text-xs font-semibold text-slate-500 mt-0.5">Artikel yang Anda terbitkan langsung tayang ke publik lengkap dengan foto profil dan centang terverifikasi Anda.</p>

                                        ${appState.editingDraftId ? `
                                            <button onclick="appState.editingDraftId=null; window.switchUserDashTab('publish')" class="text-xs font-extrabold text-slate-500 hover:text-slate-800 bg-slate-100 px-3 py-1.5 rounded-xl">Batal Edit</button>

                                        <h3 class="font-extrabold text-lg text-slate-900">Draf Artikel Tersimpan (${myDraftArticles.length})</h3>

                                    </div>
                                    ${myDraftArticles.length === 0 ? `
                                        <div class="text-center py-10 text-slate-400 text-xs font-bold">Belum ada draf artikel yang disimpan.</div>

                                            ${myDraftArticles.map(d => `

                                                        <div class="font-extrabold text-sm text-slate-900 truncate">${d.title}</div>
                                                        <div class="text-[11px] font-semibold text-slate-400 mt-0.5">Disimpan: ${formatWaktu(d.created_at)}</div>
                                                    </div>
                                                    <div class="flex items-center gap-2 shrink-0">
                                                        <button onclick="window.loadDraftToEditor('${d.id}')" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-extrabold px-3.5 py-2 rounded-xl"><i class="fas fa-edit mr-1"></i> Lanjutkan & Terbitkan</button>
                                                        <button onclick="window.deleteMyArticle('${d.id}')" class="bg-white hover:bg-rose-50 text-slate-500 hover:text-rose-600 border border-slate-200 text-xs font-extrabold px-3 py-2 rounded-xl"><i class="fas fa-trash"></i></button>
                                                    </div>
                                                </div>
                                            `).join('')}
                                        </div>
                                    `}
                                </div>

                                    <div class="p-5 rounded-3xl bg-white border border-slate-100 shadow-sm flex items-center gap-4">
                                        <div class="w-12 h-12 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center text-xl shrink-0"><i class="far fa-eye"></i></div>
                                        <div>
                                            <div class="text-[11px] font-extrabold text-slate-400 uppercase tracking-wider">Total Dibaca</div>
                                            <div class="text-2xl font-black text-slate-900 mt-0.5">${totalMyViews}</div>
                                        </div>
                                    </div>
                                    <div class="p-5 rounded-3xl bg-white border border-slate-100 shadow-sm flex items-center gap-4">
                                        <div class="w-12 h-12 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center text-xl shrink-0"><i class="fas fa-globe"></i></div>
                                        <div>
                                            <div class="text-[11px] font-extrabold text-slate-400 uppercase tracking-wider">Berita Tayang</div>
                                            <div class="text-2xl font-black text-slate-900 mt-0.5">${myApprovedArticles.length}</div>
                                        </div>
                                    </div>
                                    <div class="p-5 rounded-3xl bg-white border border-slate-100 shadow-sm flex items-center gap-4">
                                        <div class="w-12 h-12 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center text-xl shrink-0"><i class="far fa-comments"></i></div>
                                        <div>
                                            <div class="text-[11px] font-extrabold text-slate-400 uppercase tracking-wider">Komentar</div>
                                            <div class="text-2xl font-black text-slate-900 mt-0.5">${totalMyComments}</div>
                                        </div>
                                    </div>
                                    <div class="p-5 rounded-3xl bg-white border border-slate-100 shadow-sm flex items-center gap-4">
                                        <div class="w-12 h-12 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center text-xl shrink-0"><i class="far fa-folder"></i></div>
                                        <div>
                                            <div class="text-[11px] font-extrabold text-slate-400 uppercase tracking-wider">Draf Berita</div>
                                            <div class="text-2xl font-black text-slate-900 mt-0.5">${myDraftArticles.length}</div>
                                        </div>
                                    </div>
                                </div>

                                <div class="bg-white rounded-3xl p-5 sm:p-8 shadow-sm border border-slate-100 space-y-4">
                                    <div class="flex flex-wrap items-center justify-between gap-2">
                                        <div>
                                            <h3 class="font-extrabold text-lg text-slate-900">Publikasi & Performa Artikel Saya (${myApprovedArticles.length})</h3>
                                            <p class="text-xs font-semibold text-slate-400">Seluruh berita yang Anda publikasikan beserta statistik pembacanya</p>
                                        </div>
                                        <button onclick="window.switchUserDashTab('publish')" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-extrabold px-4 py-2 rounded-xl shadow-sm"><i class="fas fa-plus mr-1"></i> Terbitkan Berita</button>
                                    </div>

                                    ${myApprovedArticles.length === 0 ? `
                                        <div class="text-center py-12 bg-slate-50/70 rounded-2xl border border-dashed border-slate-200 space-y-3">

                                            <p class="text-xs font-semibold text-slate-400 max-w-md mx-auto">Mulai tulis dan publikasikan berita pertama Anda secara langsung dari dashboard akun ini.</p>
                                            <button onclick="window.switchUserDashTab('publish')" class="bg-blue-600 text-white text-xs font-extrabold px-5 py-2.5 rounded-xl shadow-sm">Mulai Publikasi Sekarang</button>

                                    ` : `
                                        <div class="space-y-3">

                                                const aComments = getArticleComments(a.id).length;

                                                            <div class="min-w-0">
                                                                <div onclick="window.openArticlePopup('${a.id}')" class="font-extrabold text-sm text-slate-900 hover:text-blue-600 cursor-pointer truncate">${a.title}</div>

                                                                    <span><i class="far fa-clock mr-1"></i>${formatWaktu(a.created_at)}</span>
                                                                    <span class="text-blue-600 font-extrabold"><i class="far fa-eye mr-1"></i>${aViews}x dibaca</span>
                                                                    <span class="text-slate-600 font-bold"><i class="far fa-comment-dots mr-1"></i>${aComments} komentar</span>
                                                                </div>
                                                            </div>
                                                        </div>
                                                        <div class="flex items-center gap-2 shrink-0 self-end sm:self-center">
                                                            <button onclick="window.openArticlePopup('${a.id}')" class="bg-white hover:bg-blue-50 text-slate-700 hover:text-blue-600 border border-slate-200 text-xs font-extrabold px-3 py-1.5 rounded-xl transition"><i class="fas fa-eye mr-1"></i> Lihat</button>
                                                            <button onclick="window.loadDraftToEditor('${a.id}')" class="bg-white hover:bg-blue-50 text-blue-600 border border-slate-200 text-xs font-extrabold px-3 py-1.5 rounded-xl transition"><i class="fas fa-pen mr-1"></i> Edit</button>
                                                            <button onclick="window.deleteMyArticle('${a.id}')" class="bg-white hover:bg-rose-50 text-slate-400 hover:text-rose-600 border border-slate-200 text-xs font-extrabold px-2.5 py-1.5 rounded-xl transition"><i class="fas fa-trash"></i></button>
                                                        </div>
                                                    </div>
                                                `;
                                            }).join('')}
                                        </div>
                                    `}
                                </div>
                            `}
                        </div>
                    `;
                }

                // Tampilan Belum Login: Clean Tanpa Line Hitam (2 Tab: Masuk Akun & Daftar Akun)
                return `
                    <div class="max-w-lg mx-auto w-full min-w-0 p-4 md:p-8 animate-fade">
                        <div class="bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-slate-100">
                            <!-- Switcher 2 Tab: Masuk Akun & Daftar Akun -->
                            <div class="grid grid-cols-2 gap-2 bg-slate-100 p-1.5 rounded-2xl mb-6">
                                <button onclick="window.switchAccountTab('login')" class="py-2.5 rounded-xl text-xs font-extrabold transition ${appState.accountTab === 'login' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-600'}">Masuk Akun</button>
                                <button onclick="window.switchAccountTab('register')" class="py-2.5 rounded-xl text-xs font-extrabold transition ${appState.accountTab === 'register' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-600'}">Daftar Akun</button>
                            </div>

                            ${appState.accountTab === 'login' ? `
                                <div class="space-y-5">
                                    <form onsubmit="window.handleUserLogin(event)" class="space-y-4">
                                        <div class="text-center mb-3">
                                            <h2 class="text-xl font-extrabold text-slate-900">Masuk Akun Zeniopost</h2>
                                            <p class="text-xs font-semibold text-slate-500 mt-1">Gunakan email <b>@zeniopost.com</b> dan kata sandi Anda</p>
                                        </div>
                                        <div>
                                            <label class="block text-xs font-extrabold text-slate-700 mb-1">Email Zeniopost</label>
                                            <input type="text" id="usr_login_email" required placeholder="nama@zeniopost.com" class="w-full p-3.5 bg-slate-50 border border-slate-300 rounded-xl font-bold text-sm outline-none focus:border-blue-600">
                                        </div>
                                        <div>
                                            <label class="block text-xs font-extrabold text-slate-700 mb-1">Kata Sandi (Maks. 15 Karakter)</label>
                                            <div class="relative">
                                                <input type="password" id="usr_login_pass" required maxlength="15" placeholder="Masukkan kata sandi..." class="w-full p-3.5 pr-11 bg-slate-50 border border-slate-300 rounded-xl font-bold text-sm outline-none focus:border-blue-600">
                                                <button type="button" onclick="window.togglePasswordVisibility('usr_login_pass', 'icon_usr_login_pass')" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-blue-600 transition" title="Tampilkan / Sembunyikan Kata Sandi">
                                                    <i id="icon_usr_login_pass" class="fas fa-eye text-slate-400"></i>
                                                </button>
                                            </div>
                                        </div>

                                        <div class="flex items-center justify-between pt-1">
                                            <button type="button" onclick="window.toggleForgotFormInLogin()" class="text-xs font-extrabold text-blue-600 hover:text-blue-800 flex items-center gap-1.5">
                                                <i class="fas fa-key"></i> ${appState.showForgotForm ? 'Tutup Form Lupa Kata Sandi' : 'Lupa Kata Sandi?'}
                                            </button>
                                        </div>

                                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-extrabold py-3.5 rounded-xl shadow-md transition">Masuk ke Zeniopost</button>
                                    </form>

                                    <!-- Bagian Lupa Kata Sandi yang Menyatu Langsung di Dalam Masuk Akun -->
                                    ${appState.showForgotForm ? `
                                        <div class="pt-5 border-t border-slate-100 animate-fade">
                                            <div class="bg-slate-50 border border-slate-200/80 rounded-2xl p-4 space-y-3.5">
                                                <div class="flex items-start justify-between gap-2">
                                                    <div>
                                                        <h3 class="text-sm font-extrabold text-slate-900 flex items-center gap-1.5">
                                                            <i class="fas fa-unlock-alt text-blue-600"></i> Permohonan Ganti Kata Sandi Baru
                                                        </h3>
                                                        <p class="text-[11px] font-semibold text-slate-500 mt-0.5 leading-relaxed">
                                                            Wajib mengisi <b>Email Google (@gmail.com) aktif</b> dan <b>Nomor Telepon</b>. Saat disetujui Admin, kata sandi baru Anda akan dikirimkan langsung ke <b>Gmail</b> Anda.
                                                        </p>
                                                    </div>
                                                </div>

                                                <form onsubmit="window.handleRequestPasswordRecovery(event)" class="space-y-3">
                                                    <div>
                                                        <label class="block text-[11px] font-extrabold text-slate-700 mb-1">Akun Zeniopost yang Dipulihkan</label>
                                                        <input type="text" id="rec_zp_email" required placeholder="nama@zeniopost.com" class="w-full p-3 bg-white border border-slate-300 rounded-xl font-bold text-xs md:text-sm outline-none focus:border-blue-600">
                                                    </div>
                                                    <div>
                                                        <label class="block text-[11px] font-extrabold text-slate-700 mb-1">Email Google Aktif (Wajib @gmail.com untuk Terima Sandi Baru)</label>
                                                        <input type="email" id="rec_gmail" required placeholder="namaanda@gmail.com" class="w-full p-3 bg-white border border-slate-300 rounded-xl font-bold text-xs md:text-sm outline-none focus:border-blue-600">
                                                    </div>
                                                    <div>
                                                        <label class="block text-[11px] font-extrabold text-slate-700 mb-1">Nomor Telepon / WhatsApp Aktif (Wajib)</label>
                                                        <input type="tel" id="rec_phone" required placeholder="Contoh: 081234567890" class="w-full p-3 bg-white border border-slate-300 rounded-xl font-bold text-xs md:text-sm outline-none focus:border-blue-600">
                                                    </div>
                                                    <div>
                                                        <label class="block text-[11px] font-extrabold text-slate-700 mb-1">Request Kata Sandi Baru (6 - 15 Karakter)</label>
                                                        <div class="relative">
                                                            <input type="password" id="rec_new_password" required minlength="6" maxlength="15" placeholder="Ketik kata sandi baru (maks. 15 karakter)..." class="w-full p-3 pr-11 bg-white border border-slate-300 rounded-xl font-bold text-xs md:text-sm outline-none focus:border-blue-600">
                                                            <button type="button" onclick="window.togglePasswordVisibility('rec_new_password', 'icon_rec_new_pass')" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-blue-600 transition" title="Tampilkan / Sembunyikan Kata Sandi">
                                                                <i id="icon_rec_new_pass" class="fas fa-eye text-slate-400"></i>
                                                            </button>
                                                        </div>
                                                    </div>
                                                    <div>
                                                        <label class="block text-[11px] font-extrabold text-slate-700 mb-1">Alasan Permintaan Ganti Sandi</label>
                                                        <textarea id="rec_reason" required rows="2" placeholder="Tuliskan alasan lupa/ganti kata sandi untuk ditinjau Admin..." class="w-full p-3 bg-white border border-slate-300 rounded-xl font-semibold text-xs md:text-sm outline-none focus:border-blue-600"></textarea>
                                                    </div>
                                                    <button type="submit" class="w-full bg-slate-900 hover:bg-blue-600 text-white font-extrabold py-3 rounded-xl text-xs md:text-sm shadow-sm transition">
                                                        <i class="fas fa-paper-plane mr-1"></i> Kirim Request Sandi Baru ke Admin
                                                    </button>
                                                </form>
                                            </div>
                                        </div>
                                    ` : ''}
                                </div>
                            ` : `
                                <!-- Form Daftar Akun Baru Tanpa Username Unik, Langsung Otomatis Login & Tombol X Batal Foto -->
                                <form onsubmit="window.handleUserRegister(event)" class="space-y-4">
                                    <div class="text-center mb-2">
                                        <h2 class="text-xl font-extrabold text-slate-900">Pendaftaran Akun Zeniopost</h2>
                                        <p class="text-xs font-semibold text-slate-500 mt-1">Akun langsung aktif dan otomatis masuk setelah pendaftaran</p>
                                    </div>
                                    <div>
                                        <label class="block text-xs font-extrabold text-slate-700 mb-1">Nama Lengkap</label>
                                        <input type="text" id="reg_fullname" required placeholder="Contoh: Budi Santoso" class="w-full p-3.5 bg-slate-50 border border-slate-300 rounded-xl font-bold text-sm outline-none focus:border-blue-600">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-extrabold text-slate-700 mb-1">Nama Email Zeniopost (Domain Otomatis)</label>
                                        <div class="flex items-center rounded-xl border border-slate-300 bg-slate-50 overflow-hidden focus-within:border-blue-600">
                                            <input type="text" id="reg_email_prefix" required placeholder="namaanda" class="flex-1 p-3.5 bg-transparent font-bold text-sm outline-none">
                                            <span class="bg-blue-50 text-blue-700 font-extrabold text-xs px-3.5 py-4 border-l border-slate-300 select-none">@zeniopost.com</span>
                                        </div>
                                    </div>
                                    <div>
                                        <label class="block text-xs font-extrabold text-slate-700 mb-1">Kata Sandi (6 - 15 Karakter)</label>
                                        <div class="relative">
                                            <input type="password" id="reg_password" required minlength="6" maxlength="15" placeholder="6 - 15 karakter" class="w-full p-3.5 pr-11 bg-slate-50 border border-slate-300 rounded-xl font-bold text-sm outline-none focus:border-blue-600">
                                            <button type="button" onclick="window.togglePasswordVisibility('reg_password', 'icon_reg_pass')" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-blue-600 transition" title="Tampilkan / Sembunyikan Kata Sandi">
                                                <i id="icon_reg_pass" class="fas fa-eye text-slate-400"></i>
                                            </button>
                                        </div>
                                    </div>
                                    <div>
                                        <label class="block text-xs font-extrabold text-slate-700 mb-1">Foto Profil (Opsional • Maks. 1 MB, Rekomendasi Ukuran 1:1)</label>
                                        <input type="file" id="reg_avatar" accept="image/*" onchange="window.previewRegisterAvatar(event)" class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:bg-blue-600 file:text-white font-bold">
                                        <div id="reg_avatar_preview_wrap" class="hidden mt-3 relative inline-block">
                                            <img id="reg_avatar_preview_img" src="" class="w-20 h-20 rounded-full aspect-square object-cover border border-slate-900 shadow-sm">
                                            <button type="button" onclick="window.clearRegisterAvatar()" title="Batalkan Foto Profil" class="absolute -top-1.5 -right-1.5 w-6 h-6 rounded-full bg-slate-900 hover:bg-slate-700 text-white text-xs flex items-center justify-center shadow">
                                                <i class="fas fa-times"></i>
                                            </button>
                                        </div>
                                    </div>
                                    <button type="submit" id="btn_reg_submit" class="w-full bg-slate-900 hover:bg-blue-600 text-white font-extrabold py-3.5 rounded-xl shadow-md transition">Daftar & Masuk Sekarang</button>
                                </form>
                            `}
                        </div>
                    </div>
                `;
            }

            // G. HALAMAN LIVE CHAT DENGAN ADMIN
            if (appState.view === 'chat') {
                if (!appState.currentUser) {
                    return `
                        <div class="max-w-lg mx-auto p-6 md:p-10 animate-fade">
                            <div class="bg-white rounded-3xl p-8 text-center border border-slate-100 shadow-sm space-y-4">
                                <div class="w-16 h-16 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center text-3xl mx-auto"><i class="fas fa-comments"></i></div>
                                <h2 class="text-xl font-extrabold text-slate-900">Layanan Chat Langsung Admin</h2>
                                <p class="text-xs md:text-sm text-slate-500 font-semibold leading-relaxed">Silakan masuk ke akun <b>@zeniopost.com</b> Anda terlebih dahulu untuk mengirim pesan, menerima konfirmasi sandi baru, atau berkonsultasi dengan Admin.</p>
                                <button onclick="app.navigate('account')" class="bg-blue-600 text-white font-extrabold px-6 py-3 rounded-xl text-xs md:text-sm shadow">Masuk / Daftar Akun</button>
                            </div>
                        </div>
                    `;
                }

                const myChats = appState.messages.filter(m => String(m.user_id) === String(appState.currentUser.id));
                return `
                    <div class="max-w-3xl mx-auto p-4 md:p-8 animate-fade">
                        <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden flex flex-col h-[75vh]">
                            <div class="p-4 px-6 bg-slate-900 text-white flex items-center justify-between">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center"><i class="fas fa-headset"></i></div>
                                    <div>
                                        <h3 class="font-extrabold text-sm md:text-base">Ruang Percakapan Admin Zeniopost</h3>
                                        <p class="text-[11px] text-slate-300 font-semibold">Tanyakan seputar akun, pemulihan kata sandi, pengajuan artikel & kendala website</p>
                                    </div>
                                </div>
                            </div>

                            <div class="flex-1 overflow-y-auto p-5 space-y-3 bg-slate-50">
                                ${myChats.length === 0 ? `
                                    <div class="text-center py-12 text-slate-400 text-xs font-bold">Belum ada riwayat percakapan. Silakan pilih topik dan kirim pesan kepada Admin di bawah ini.</div>
                                ` : myChats.map(m => {
                                    const isMe = m.sender_role === 'user';
                                    return `
                                        <div class="flex ${isMe ? 'justify-end' : 'justify-start'}">
                                            <div class="max-w-[80%] p-3.5 rounded-2xl text-xs md:text-sm shadow-sm ${isMe ? 'bg-blue-600 text-white rounded-br-none' : 'bg-white text-slate-800 border border-slate-200 rounded-bl-none'}">
                                                <div class="text-[10px] font-extrabold mb-1 ${isMe ? 'text-blue-100' : 'text-blue-600'}">
                                                    ${isMe ? `Anda • [${m.category || 'Umum'}]` : `Admin Zeniopost • [${m.category || 'Info'}]`}
                                                </div>
                                                <p class="leading-relaxed whitespace-pre-wrap">${m.message}</p>
                                                <div class="text-[10px] mt-1.5 flex items-center justify-end gap-1 ${isMe ? 'text-blue-200' : 'text-slate-400'}">
                                                    <span>${formatWaktu(m.created_at)}</span>
                                                    ${isMe ? `<i class="fas fa-check-double ${m.is_read ? 'text-emerald-300' : ''}"></i>` : ''}
                                                </div>
                                            </div>
                                        </div>
                                    `;
                                }).join('')}

                                <div class="space-y-6">
                                    <!-- Pengaturan Logo Website (Ganti Gambar & Ukuran Proporsional) -->
                                    <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm space-y-4">
                                        <div class="flex items-center justify-between">
                                            <h3 class="font-extrabold text-base text-slate-900 flex items-center gap-2">
                                                <i class="fas fa-image text-blue-600"></i> Pengaturan Logo Website
                                            </h3>
                                            <button type="button" onclick="window.resetDefaultLogoSettings()" class="text-[11px] font-bold text-slate-400 hover:text-blue-600">Reset Default</button>
                                        </div>
                                        <div class="p-3.5 rounded-2xl bg-slate-50 border border-slate-200/70 flex items-center justify-center">
                                            <img id="admin_logo_preview_img" src="${getLogoUrl()}" onerror="this.src='${getLogoFallbackUrl()}'" style="height:${appState.logoHeightMobile}px;" class="w-auto max-w-full object-contain block">
                                        </div>
                                        <form onsubmit="window.saveAdminLogoSettings(event)" class="space-y-3">
                                            <div>
                                                <label class="block text-[11px] font-extrabold text-slate-600 mb-1">Unggah File Logo Baru (Opsional)</label>
                                                <input type="file" id="admin_logo_file_input" accept="image/*" onchange="window.previewAdminLogoUpload(event)" class="w-full text-xs bg-slate-50 p-2 rounded-xl border border-slate-200 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-blue-600 file:text-white font-bold">
                                            </div>
                                            <div>
                                                <label class="block text-[11px] font-extrabold text-slate-600 mb-1">Atau Tempel URL Gambar Logo</label>
                                                <input type="url" id="admin_logo_url_input" value="${getLogoUrl()}" placeholder="https://..." class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold outline-none focus:border-blue-500">
                                            </div>
                                            <div class="grid grid-cols-2 gap-2.5">
                                                <div>
                                                    <label class="block text-[10px] font-extrabold text-slate-500 mb-1">Tinggi di HP (px)</label>
                                                    <input type="number" id="admin_logo_h_mobile" min="28" max="80" value="${appState.logoHeightMobile}" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-extrabold outline-none focus:border-blue-500">
                                                </div>
                                                <div>
                                                    <label class="block text-[10px] font-extrabold text-slate-500 mb-1">Tinggi di Desktop (px)</label>
                                                    <input type="number" id="admin_logo_h_desktop" min="36" max="110" value="${appState.logoHeightDesktop}" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-extrabold outline-none focus:border-blue-500">
                                                </div>
                                            </div>
                                            <button type="submit" id="btn_save_logo" class="w-full bg-slate-900 hover:bg-blue-600 text-white font-extrabold py-2.5 rounded-xl text-xs transition shadow-sm">
                                                <i class="fas fa-save mr-1"></i> Simpan Logo & Ukuran
                                            </button>
                                        </form>
                                    </div>

                                    <!-- Kelola Kategori -->
                                    <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm space-y-4">
                                        <h3 class="font-extrabold text-base text-slate-900">Kelola Kategori Berita</h3>
                                        <form onsubmit="window.addTopic(event)" class="flex gap-2">
                                            <input type="text" id="new_topic_name" required placeholder="Kategori baru..." class="flex-1 p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold outline-none">
                                            <button type="submit" class="bg-blue-600 text-white font-extrabold px-4 rounded-xl text-xs">Tambah</button>
                                        </form>
                                        <div class="space-y-2">
                                            ${appState.topics.map(t => `
                                                <div class="p-2.5 px-3.5 rounded-xl bg-slate-50 border border-slate-200 flex items-center justify-between text-xs font-extrabold">
                                                    <span>${t.name}</span>
                                                    <button onclick="window.confirmDeleteTopic('${t.id}')" class="text-rose-500 hover:text-rose-700"><i class="fas fa-trash"></i></button>
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>

                                    <!-- Terbitkan Berita Resmi -->
                                    <div class="bg-blue-50 p-6 rounded-3xl border border-blue-100 space-y-3">
                                        <h3 class="font-extrabold text-base text-blue-900">Terbitkan Artikel Resmi</h3>
                                        <form onsubmit="window.submitAdminForm(event)" class="space-y-3">
                                            <input type="text" id="a_title" required placeholder="Judul Berita Resmi" class="w-full p-3 bg-white rounded-xl text-xs font-bold border border-blue-100 outline-none">
                                            <select id="a_topic" required class="w-full p-3 bg-white rounded-xl text-xs font-bold border border-blue-100 outline-none">
                                                <option value="">Pilih Kategori...</option>
                                                ${appState.topics.map(t => `<option value="${t.id}">${t.name}</option>`).join('')}
                                            </select>
                                            <input type="file" id="a_image" accept="image/*" required onchange="window.previewAdminOfficialImage(event)" class="w-full text-xs bg-white p-2 rounded-xl">
                                            <div id="preview_a_wrap" class="hidden relative">
                                                <img id="preview_a_img" src="" class="w-full h-36 object-cover rounded-xl border border-blue-200 bg-white">
                                                <button type="button" onclick="window.clearImageUpload('a_image', null, 'preview_a_wrap')" title="Batalkan Gambar" class="absolute top-2 right-2 w-7 h-7 rounded-full bg-rose-600 hover:bg-rose-700 text-white text-xs flex items-center justify-center shadow">
                                                    <i class="fas fa-times"></i>
                                                </button>
                                            </div>
                                            ${renderRichTextEditor('a_content', 'Tulis berita resmi Zeniopost...', '', 'min-h-[140px]')}
                                            <input type="text" id="a_social" placeholder="Sosmed (Opsional)" class="w-full p-3 bg-white rounded-xl text-xs font-bold border border-blue-100 outline-none">
                                            <button type="submit" id="btn_a" class="w-full bg-blue-600 text-white font-extrabold py-3 rounded-xl text-xs">Terbitkan Sekarang</button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        `}
                    </div>
                `;
            }

            return '';
        };

        const renderApp = () => {
            const root = document.getElementById('app');
            if (!root) return;
            root.innerHTML = `
                ${renderHeader()}
                <div class="flex w-full max-w-full overflow-x-hidden min-h-[calc(100vh-80px)] md:min-h-[calc(100vh-96px)]">
                    ${renderNav()}
                    <main id="main-content" class="flex-1 min-w-0 w-full max-w-full overflow-x-hidden md:ml-64 pb-24 md:pb-12 relative">${buildMainContent()}</main>
                </div>
            `;
        };

        document.getElementById('modal-container').addEventListener('click', () => window.closeModal());

        const init = async () => {
            renderApp();
            checkDynamicShareEndpoint();
            await autoSetupDatabase();
            if (!IS_PREVIEW && dbClient) {
                const { data } = await dbClient.auth.getSession();
                appState.user = data.session?.user || null;
            }
            await fetchData();

            const params = new URLSearchParams(window.location.search);
            const sharedArticleId = params.get('article');
            if (sharedArticleId) {
                const found = appState.articles.find(x => String(x.id) === String(sharedArticleId));
                if (found) {
                    app.navigate('article', found);
                    return;
                }
            }
            renderApp();
        };

        init();
    </script>
</body>
</html>
