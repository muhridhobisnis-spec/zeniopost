            { id: 'm2', user_id: 'u1', sender_role: 'admin', category: 'Pengajuan Artikel', message: 'Halo Kak Budi, terima kasih! Artikel Anda sudah kami setujui dan kini tayang di beranda.', is_read: true, created_at: new Date(Date.now() - 1800000).toISOString() }
        ];

        // =====================================================================
        // 4. AUTO SETUP DATABASE
        // =====================================================================
        const autoSetupDatabase = async () => {
            if (IS_PREVIEW || !dbClient) return;
            try {
                const { data: existingTopics } = await dbClient.from('topics').select('id').limit(1);
                if (existingTopics && existingTopics.length === 0) {
                    await dbClient.from('topics').insert([
                        { name: 'Nasional' },
                        { name: 'Teknologi' },
                        { name: 'Lingkungan' },
                        { name: 'Pendidikan' },
                        { name: 'Ekonomi' }
                    ]);
                }
            } catch (e) {}
        };

        // =====================================================================
        // 5. UTILITAS VISIBILITAS PASSWORD, FORMAT WAKTU, SANITASI & GAMBAR 750x750
        // =====================================================================
        window.togglePasswordVisibility = (inputId, iconId) => {
            const inp = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (!inp) return;
            if (inp.type === 'password') {
                inp.type = 'text';
                if (icon) icon.className = 'fas fa-eye-slash text-blue-600';
            } else {
                inp.type = 'password';
                if (icon) icon.className = 'fas fa-eye text-slate-400';
            }
        };

        const showToast = (msg, type = 'info') => {
            const cont = document.getElementById('toast-container');
            if (!cont) return;
            const el = document.createElement('div');
            el.className = `p-4 rounded-2xl shadow-lg text-white font-bold text-xs md:text-sm pointer-events-auto transition-all flex items-center gap-2 max-w-sm ${type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-blue-600'}`;
            el.innerHTML = msg;
            cont.appendChild(el);
            setTimeout(() => el.remove(), 3800);
        };

        const formatWaktu = (iso) => {
            if (!iso) return '-';
            const d = new Date(iso);
            const tgl = d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
            const jam = d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }).replace('.', ':');
            return `${tgl} • ${jam} WITA`;
        };

        const getLocalDateString = (iso) => {
            if (!iso) return '';
            const d = new Date(iso);
            if (isNaN(d.getTime())) return '';
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        const formatLabelTanggal = (ymd, shortMonth = false) => {
            if (!ymd) return '';
            const parts = ymd.split('-');
            if (parts.length !== 3) return ymd;
            const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
            return d.toLocaleDateString('id-ID', {
                day: 'numeric',
                month: shortMonth ? 'short' : 'long',
                year: 'numeric'
            });
        };

        const stripHtml = (rawHtml) => {
            if (!rawHtml) return '';
            const withSpaces = String(rawHtml)
                .replace(/<br\s*\/?>/gi, ' ')
                .replace(/<\/(p|div|li|h[1-6]|blockquote)>/gi, ' ');
            const temp = document.createElement('div');
            temp.innerHTML = withSpaces;
            return (temp.textContent || temp.innerText || '').replace(/\s+/g, ' ').trim();
        };

        const sanitizeAndFormatArticleHtml = (rawContent) => {
            if (!rawContent) return '';
            const str = String(rawContent);
            const hasHtmlTag = /<\/?[a-z][\s\S]*>/i.test(str);
            if (!hasHtmlTag) {
                const escaped = str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                return `<div class="whitespace-pre-wrap">${escaped}</div>`;
            }
            const temp = document.createElement('div');
            temp.innerHTML = str;
            temp.querySelectorAll('script, iframe, object, embed, style, link, meta').forEach(el => el.remove());
            temp.querySelectorAll('*').forEach(el => {
                Array.from(el.attributes).forEach(attr => {
                    const name = attr.name.toLowerCase();
                    if (name.startsWith('on') || (name === 'href' && attr.value.trim().toLowerCase().startsWith('javascript:'))) {
                        el.removeAttribute(attr.name);
                    }
                });
                if (el.tagName === 'A') {
                    el.setAttribute('target', '_blank');
                    el.setAttribute('rel', 'noopener noreferrer');
                }
            });
            return `<div class="article-rich-content">${temp.innerHTML}</div>`;
        };

        const prepareInitialEditorHtml = (rawContent) => {
            if (!rawContent) return '';
            const str = String(rawContent);
            if (/<\/?[a-z][\s\S]*>/i.test(str)) return str;
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
        };

        // Validasi Foto Profil Maksimal Ukuran File 1 MB (Rekomendasi Rasio 1:1)
        const validateProfileImageDimensions = (file) => {
            return new Promise((resolve, reject) => {
                if (!file) return reject(new Error('Pilih file foto terlebih dahulu.'));
                if (!file.type.startsWith('image/')) return reject(new Error('File harus berupa gambar (JPG/PNG/WebP).'));
                const maxBytes = 1024 * 1024; // 1 MB
                if (file.size > maxBytes) {
                    const sizeInMb = (file.size / (1024 * 1024)).toFixed(2);
                    return reject(new Error(`Ukuran foto profil Anda (${sizeInMb} MB) melebihi batas maksimal 1 MB!`));
                }
                const img = new Image();
                const objectUrl = URL.createObjectURL(file);
                img.onload = () => {
                    URL.revokeObjectURL(objectUrl);
                    resolve({ width: img.width, height: img.height, size: file.size });
                };
                img.onerror = () => {
                    URL.revokeObjectURL(objectUrl);
                    reject(new Error('Gagal membaca file gambar.'));
                };
                img.src = objectUrl;
            });
        };

        const uploadFileMedia = async (fileInputId, folderPrefix = 'articles') => {
            const inputEl = document.getElementById(fileInputId);
            const file = inputEl?.files?.[0];
            if (!file) return null;

            if (IS_PREVIEW) {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = e => resolve(e.target.result);
                    reader.readAsDataURL(file);
                });
            }

            const ext = file.name.split('.').pop();
            const filename = `${folderPrefix}_${Date.now()}_${Math.random().toString(36).substring(2, 10)}.${ext}`;
            const { error } = await dbClient.storage.from('news-images').upload(filename, file);
            if (error) throw error;
            const { data } = dbClient.storage.from('news-images').getPublicUrl(filename);
            return data.publicUrl;

        // =====================================================================
        // 6. EDITOR ARTIKEL LENGKAP (BOLD, ITALIC, HEADING, ALIGN, LINK, QUOTE, LIST BERTINGKAT)
        // =====================================================================
        const renderRichTextEditor = (editorId, placeholder = 'Tulis isi berita lengkap di sini...', initialContent = '', minHeightClass = 'min-h-[240px]') => {
            const safeInitial = prepareInitialEditorHtml(initialContent);
            return `
                <div class="border border-slate-200 rounded-2xl overflow-hidden bg-white focus-within:border-blue-500 focus-within:ring-2 focus-within:ring-blue-500/15 transition">
                    <!-- Toolbar Editor Lengkap -->
                    <div class="flex flex-wrap items-center gap-1 p-2 bg-slate-100/95 border-b border-slate-200 text-slate-700 select-none">
                        <button type="button" onmousedown="event.preventDefault()" onclick="window.formatEditorText('${editorId}', 'bold')" title="Tebal (Bold)" class="w-8 h-8 rounded-lg hover:bg-white hover:text-blue-600 hover:shadow-sm flex items-center justify-center text-xs font-extrabold transition"><i class="fas fa-bold"></i></button>
                        <button type="button" onmousedown="event.preventDefault()" onclick="window.formatEditorText('${editorId}', 'italic')" title="Miring (Italic)" class="w-8 h-8 rounded-lg hover:bg-white hover:text-blue-600 hover:shadow-sm flex items-center justify-center text-xs transition"><i class="fas fa-italic"></i></button>
                        <button type="button" onmousedown="event.preventDefault()" onclick="window.formatEditorText('${editorId}', 'underline')" title="Garis Bawah (Underline)" class="w-8 h-8 rounded-lg hover:bg-white hover:text-blue-600 hover:shadow-sm flex items-center justify-center text-xs transition"><i class="fas fa-underline"></i></button>

                        <span class="w-px h-5 bg-slate-300 mx-0.5"></span>

                        <button type="button" onmousedown="event.preventDefault()" onclick="window.formatEditorHeading('${editorId}', 'H2')" title="Subjudul Besar (Heading 2)" class="px-2 h-8 rounded-lg hover:bg-white hover:text-blue-600 hover:shadow-sm flex items-center justify-center text-[11px] font-extrabold transition">H2</button>
                        <button type="button" onmousedown="event.preventDefault()" onclick="window.formatEditorHeading('${editorId}', 'H3')" title="Subjudul Kecil (Heading 3)" class="px-2 h-8 rounded-lg hover:bg-white hover:text-blue-600 hover:shadow-sm flex items-center justify-center text-[11px] font-extrabold transition">H3</button>
                        <button type="button" onmousedown="event.preventDefault()" onclick="window.formatEditorHeading('${editorId}', 'P')" title="Paragraf Normal" class="px-2 h-8 rounded-lg hover:bg-white hover:text-blue-600 hover:shadow-sm flex items-center justify-center text-[11px] font-bold transition">Teks</button>

                        <span class="w-px h-5 bg-slate-300 mx-0.5"></span>

                        <button type="button" onmousedown="event.preventDefault()" onclick="window.formatEditorText('${editorId}', 'justifyLeft')" title="Rata Kiri" class="w-8 h-8 rounded-lg hover:bg-white hover:text-blue-600 hover:shadow-sm flex items-center justify-center text-xs transition"><i class="fas fa-align-left"></i></button>
                        <button type="button" onmousedown="event.preventDefault()" onclick="window.formatEditorText('${editorId}', 'justifyCenter')" title="Rata Tengah" class="w-8 h-8 rounded-lg hover:bg-white hover:text-blue-600 hover:shadow-sm flex items-center justify-center text-xs transition"><i class="fas fa-align-center"></i></button>
                        <button type="button" onmousedown="event.preventDefault()" onclick="window.formatEditorText('${editorId}', 'justifyRight')" title="Rata Kanan" class="w-8 h-8 rounded-lg hover:bg-white hover:text-blue-600 hover:shadow-sm flex items-center justify-center text-xs transition"><i class="fas fa-align-right"></i></button>
                        <button type="button" onmousedown="event.preventDefault()" onclick="window.formatEditorText('${editorId}', 'justifyFull')" title="Rata Kanan-Kiri (Justify)" class="w-8 h-8 rounded-lg hover:bg-white hover:text-blue-600 hover:shadow-sm flex items-center justify-center text-xs transition"><i class="fas fa-align-justify"></i></button>

                        <span class="w-px h-5 bg-slate-300 mx-0.5"></span>

                        <button type="button" onmousedown="event.preventDefault()" onclick="window.formatEditorText('${editorId}', 'insertOrderedList')" title="Daftar Bernomor Otomatis (1, 2, 3)" class="w-8 h-8 rounded-lg hover:bg-white hover:text-blue-600 hover:shadow-sm flex items-center justify-center text-xs transition"><i class="fas fa-list-ol"></i></button>
                        <button type="button" onmousedown="event.preventDefault()" onclick="window.formatEditorText('${editorId}', 'insertUnorderedList')" title="Daftar Poin (Bullet List)" class="w-8 h-8 rounded-lg hover:bg-white hover:text-blue-600 hover:shadow-sm flex items-center justify-center text-xs transition"><i class="fas fa-list-ul"></i></button>
                        <button type="button" onmousedown="event.preventDefault()" onclick="window.formatEditorText('${editorId}', 'indent')" title="Tingkatkan Level Daftar Bertingkat (Tab / Sub-list)" class="w-8 h-8 rounded-lg hover:bg-white hover:text-blue-600 hover:shadow-sm flex items-center justify-center text-xs transition"><i class="fas fa-indent"></i></button>
                        <button type="button" onmousedown="event.preventDefault()" onclick="window.formatEditorText('${editorId}', 'outdent')" title="Kurangi Level Daftar Bertingkat (Shift+Tab)" class="w-8 h-8 rounded-lg hover:bg-white hover:text-blue-600 hover:shadow-sm flex items-center justify-center text-xs transition"><i class="fas fa-outdent"></i></button>

                        <span class="w-px h-5 bg-slate-300 mx-0.5"></span>

                        <button type="button" onmousedown="event.preventDefault()" onclick="window.formatEditorHeading('${editorId}', 'BLOCKQUOTE')" title="Kutipan (Blockquote)" class="w-8 h-8 rounded-lg hover:bg-white hover:text-blue-600 hover:shadow-sm flex items-center justify-center text-xs transition"><i class="fas fa-quote-right"></i></button>
                        <button type="button" onmousedown="event.preventDefault()" onclick="window.insertEditorLink('${editorId}')" title="Sisipkan Tautan (Link URL)" class="w-8 h-8 rounded-lg hover:bg-white hover:text-blue-600 hover:shadow-sm flex items-center justify-center text-xs transition"><i class="fas fa-link"></i></button>
                    </div>

                    <div id="${editorId}"
                         contenteditable="true"
                         onkeydown="window.handleEditorKeydown(event, '${editorId}')"
                         data-placeholder="${placeholder.replace(/"/g, '&quot;')}"
                         class="rich-editor w-full p-4 ${minHeightClass} max-h-[420px] overflow-y-auto text-sm md:text-base leading-relaxed outline-none">${safeInitial}</div>
                </div>
            `;
        };

        window.formatEditorText = (editorId, command, value = null) => {
            const editor = document.getElementById(editorId);
            if (!editor) return;
            editor.focus();
            document.execCommand(command, false, value);
        };

        window.formatEditorHeading = (editorId, tag) => {
            const editor = document.getElementById(editorId);
            if (!editor) return;
            editor.focus();
            document.execCommand('formatBlock', false, `<${tag}>`);
        };

        window.insertEditorLink = (editorId) => {
            const editor = document.getElementById(editorId);
            if (!editor) return;
            const url = prompt('Masukkan URL tautan (contoh: https://zeniopost.com):', 'https://');
            if (url && url.trim() && url.trim() !== 'https://') {
                editor.focus();
                document.execCommand('createLink', false, url.trim());
            }
        };

        window.handleEditorKeydown = (e, editorId) => {
            if (e.key === 'Tab') {
                e.preventDefault();
                if (e.shiftKey) {
                    document.execCommand('outdent', false, null);
                } else {
                    document.execCommand('indent', false, null);
                }
            }
        };

        const getRichEditorContent = (editorId) => {
            const editor = document.getElementById(editorId);
            if (!editor) return { html: '', text: '' };
            const html = editor.innerHTML.trim();
            const text = stripHtml(html);
            return { html, text };
        };

        // =====================================================================
        // 7. FETCH DATA DARI SERVER & SINKRONISASI STATE
        // =====================================================================
        const fetchData = async () => {
            if (IS_PREVIEW) {
                appState.topics = [...mockTopics];
                appState.articles = [...mockArticles];
                appState.comments = [...mockComments];
                appState.zpUsers = [...mockUsers];
                appState.passwordResets = [...mockPasswordResets];
                appState.messages = [...mockMessages];
                if (!appState.currentUser) {
                    appState.savedArticles = [];
                }
                return;
            }

            try {
                // 1. Kategori Topik
                const { data: tData } = await dbClient.from('topics').select('*').order('created_at');
                appState.topics = tData || [];

                // 2. Artikel
                const { data: aData } = await dbClient.from('articles').select('*').order('created_at', { ascending: false });
                appState.articles = aData || [];

                // 3. Komentar Pembaca
                const { data: cData } = await dbClient.from('comments').select('*').order('created_at', { ascending: false });
                appState.comments = cData || [];

                // 4. Akun Pengguna Zeniopost (@zeniopost.com)
                const { data: uData } = await dbClient.from('zp_users').select('*').order('created_at', { ascending: false });
                if (uData) {
                    appState.zpUsers = uData;
                    if (appState.currentUser) {
                        const refreshed = uData.find(u => String(u.id) === String(appState.currentUser.id));
                        if (refreshed) {
                            appState.currentUser = refreshed;
                            localStorage.setItem('zeniopost_current_user', JSON.stringify(refreshed));
                        }
                    }
                }

                // 5. Permintaan Pemulihan Kata Sandi
                const { data: prData } = await dbClient.from('zp_password_resets').select('*').order('created_at', { ascending: false });
                if (prData) appState.passwordResets = prData;

                // 6. Berita Tersimpan (Hanya aktif bagi pengguna yang login)
                if (appState.currentUser) {
                    const userSavedKey = `zeniopost_saved_${appState.currentUser.id}`;
                    const localUserSaved = JSON.parse(localStorage.getItem(userSavedKey) || '[]');
                    const { data: sData } = await dbClient.from('zp_saved_articles').select('article_id').eq('user_id', appState.currentUser.id);
                    if (sData) {
                        const dbSavedIds = sData.map(x => String(x.article_id));
                        const merged = Array.from(new Set([...localUserSaved.map(String), ...dbSavedIds]));
                        appState.savedArticles = merged;
                        localStorage.setItem(userSavedKey, JSON.stringify(merged));
                    } else {
                        appState.savedArticles = localUserSaved;
                    }
                } else {
                    appState.savedArticles = [];
                }

                // 7. Riwayat Percakapan Chat dengan Admin
                const { data: mData } = await dbClient.from('zp_messages').select('*').order('created_at', { ascending: true });
                if (mData) appState.messages = mData;
            } catch (err) {
                console.warn('Sinkronisasi sebagian tabel belum siap:', err);
            }
        };

        // =====================================================================
        // 8. LOGIKA PEMBACAAN, TRENDING TOP 3, SIMPAN BERITA (KHUSUS AKUN) & REKOMENDASI
        // =====================================================================
        const getArticleViews = (article) => {
            if (!article) return 0;
            const dbViews = Number(article.views) || 0;
            const localBonus = Number(appState.localViewsMap[String(article.id)]) || 0;
            return Math.max(dbViews, localBonus);
        };

        const recordArticleView = async (articleId) => {
            if (!articleId) return;
            const idStr = String(articleId);
            const target = appState.articles.find(x => String(x.id) === idStr);
            if (!target) return;

            const nextViews = getArticleViews(target) + 1;
            target.views = nextViews;
            appState.localViewsMap[idStr] = nextViews;

            if (!IS_PREVIEW && dbClient) {
                try {
                    const { error: rpcError } = await dbClient.rpc('increment_article_views', { art_id: articleId });
                    if (rpcError) {
                        await dbClient.from('articles').update({ views: nextViews }).eq('id', articleId);
                    }
                } catch (e) {}
            }
        };

        // Trending Top 3 - Hanya menampilkan 3 berita terpopuler berdasarkan data pembacaan aktual
        const getTrendingTop3 = () => {
            const approved = appState.articles.filter(a => a.status === 'approved');
            return [...approved]
                .sort((a, b) => {
                    const diff = getArticleViews(b) - getArticleViews(a);
                    if (diff !== 0) return diff;
                    return new Date(b.created_at) - new Date(a.created_at);
                })
                .slice(0, 3);
        };

        // Simpan Berita: Khusus untuk pengguna yang memiliki akun & sedang login
        const isArticleSaved = (articleId) => {
            if (!appState.currentUser) return false;
            return appState.savedArticles.map(String).includes(String(articleId));
        };

        window.toggleSaveArticle = async (articleId, e = null) => {
            if (e) e.stopPropagation();

            // Jika tamu (belum login), fitur simpan terkunci & diarahkan ke halaman login
            if (!appState.currentUser) {
                showToast('<i class="fas fa-lock mr-1.5"></i> Fitur Simpan Berita terkunci untuk Tamu. Silakan masuk ke akun Zeniopost Anda terlebih dahulu!', 'error');
                window.closeModal();
                appState.accountTab = 'login';
                app.navigate('account');
                return false;
            }

            const idStr = String(articleId);
            const alreadySaved = isArticleSaved(idStr);
            const userSavedKey = `zeniopost_saved_${appState.currentUser.id}`;

            if (alreadySaved) {
                appState.savedArticles = appState.savedArticles.filter(id => String(id) !== idStr);
                showToast('<i class="fas fa-bookmark mr-1"></i> Artikel dihapus dari daftar tersimpan.', 'info');
                if (!IS_PREVIEW && dbClient) {
                    try {
                        await dbClient.from('zp_saved_articles').delete().eq('user_id', appState.currentUser.id).eq('article_id', articleId);
                    } catch (err) {}
                }
            } else {
                appState.savedArticles.push(idStr);
                showToast('<i class="fas fa-bookmark mr-1"></i> Artikel berhasil disimpan ke akun Anda!', 'success');
                if (!IS_PREVIEW && dbClient) {
                    try {
                        await dbClient.from('zp_saved_articles').insert([{ user_id: appState.currentUser.id, article_id: articleId }]);
                    } catch (err) {}
                }
            }

            localStorage.setItem(userSavedKey, JSON.stringify(appState.savedArticles));
            renderApp();
            return true;
        };

        // Rekomendasi Berita di Bagian Paling Bawah Artikel
        const getRecommendedArticles = (currentArticle, limit = 3) => {
            if (!currentArticle) return [];
            const candidates = appState.articles.filter(a => a.status === 'approved' && String(a.id) !== String(currentArticle.id));
            if (candidates.length === 0) return [];

            const currentWords = new Set(
                `${currentArticle.title || ''} ${stripHtml(currentArticle.content || '')}`
                    .toLowerCase()
                    .split(/[^a-z0-9]+/)
                    .filter(w => w.length > 3)
            );

            const scored = candidates.map(item => {
                let score = 0;
                if (String(item.topic_id) === String(currentArticle.topic_id)) score += 50;
                const itemWords = `${item.title || ''} ${stripHtml(item.content || '')}`
                    .toLowerCase()
                    .split(/[^a-z0-9]+/)
                    .filter(w => w.length > 3);
                itemWords.forEach(w => {
                    if (currentWords.has(w)) score += 2;
                });
                return { item, score };
            });

            scored.sort((a, b) => {
                if (b.score !== a.score) return b.score - a.score;
                return getArticleViews(b.item) - getArticleViews(a.item);
            });

            return scored.slice(0, limit).map(s => s.item);
        };

        const renderRecommendationsBlock = (article, isInsideModal = false) => {
            const recs = getRecommendedArticles(article, 3);
            if (recs.length === 0) return '';

            return `
                <div class="mt-8 pt-6 border-t border-slate-200">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-base md:text-lg font-extrabold text-slate-900 flex items-center gap-2">
                            <span class="w-8 h-8 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-sm">
                                <i class="fas fa-compass"></i>
                            </span>
                            Rekomendasi Berita Terkait
                        </h3>
                        <span class="text-[11px] font-bold text-slate-400">Berdasarkan topik & isi serupa</span>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        ${recs.map(r => {
                            const tObj = appState.topics.find(t => String(t.id) === String(r.topic_id));
                            const tName = tObj ? tObj.name : 'Berita';
                            const rViews = getArticleViews(r);
                            const clickAction = isInsideModal
                                ? `window.openArticlePopup('${r.id}')`
                                : `app.navigate('article', '${r.id}')`;
                            return `
                                <div onclick="${clickAction}" class="group cursor-pointer bg-slate-50 hover:bg-white rounded-2xl overflow-hidden border border-slate-200/80 hover:border-blue-300 transition shadow-sm flex flex-col justify-between">
                                    <div>
                                        <div class="h-28 bg-slate-200 overflow-hidden relative">
                                            <img src="${r.image_url}" alt="${r.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                                            <span class="absolute top-2 left-2 bg-slate-900/75 text-white text-[10px] font-bold px-2.5 py-0.5 rounded-full">${tName}</span>
                                        </div>
                                        <div class="p-3">
                                            <h4 class="font-extrabold text-xs md:text-sm text-slate-900 group-hover:text-blue-600 line-clamp-2 leading-snug">${r.title}</h4>
                                        </div>
                                    </div>
                                    <div class="px-3 pb-3 pt-1 text-[10px] font-semibold text-slate-400 flex items-center justify-between">
                                        <span><i class="far fa-eye text-blue-500 mr-1"></i>${rViews}x dibaca</span>
                                        <span class="text-blue-600 font-extrabold">Baca <i class="fas fa-arrow-right ml-0.5"></i></span>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        };

        // =====================================================================
        // 9. SISTEM AKUN PENGGUNA (@zeniopost.com), LOGIN & LUPA SANDI MENYATU
        // =====================================================================
        window.switchAccountTab = (tab) => {
            appState.accountTab = tab;
            appState.showForgotForm = false;
            renderApp();
        };

        window.toggleForgotFormInLogin = () => {
            appState.showForgotForm = !appState.showForgotForm;
            renderApp();
        };

        // Preview & Batal (X) Foto Profil pada Form Pendaftaran
        window.previewRegisterAvatar = (event) => {
            const file = event.target.files?.[0];
            const wrap = document.getElementById('reg_avatar_preview_wrap');
            const img = document.getElementById('reg_avatar_preview_img');
            if (!file) {
                if (wrap) wrap.classList.add('hidden');
                return;
            }
            validateProfileImageDimensions(file)
                .then(() => {
                    const reader = new FileReader();
                    reader.onload = e => {
                        if (img) img.src = e.target.result;
                        if (wrap) wrap.classList.remove('hidden');
                    };
                    reader.readAsDataURL(file);
                })
                .catch(err => {
                    event.target.value = '';
                    if (wrap) wrap.classList.add('hidden');
                    showToast(err.message, 'error');
                });
        };

        window.clearRegisterAvatar = () => {
            const inp = document.getElementById('reg_avatar');
            const wrap = document.getElementById('reg_avatar_preview_wrap');
            const img = document.getElementById('reg_avatar_preview_img');
            if (inp) inp.value = '';
            if (img) img.src = '';
            if (wrap) wrap.classList.add('hidden');
        };

        // Pendaftaran Akun Baru Tanpa Username Unik & Langsung Otomatis Login (Maks Sandi 15 Karakter)
        window.handleUserRegister = async (e) => {
            e.preventDefault();
            const fullName = (document.getElementById('reg_fullname')?.value || '').trim();
            const rawEmailPrefix = (document.getElementById('reg_email_prefix')?.value || '')
                .trim()
                .toLowerCase()
                .replace(/@.*$/, '')
                .replace(/[^a-z0-9._-]/g, '');
            const password = document.getElementById('reg_password')?.value || '';
            const btn = document.getElementById('btn_reg_submit');

            if (!fullName || !rawEmailPrefix || !password) {
                showToast('Harap lengkapi semua kolom pendaftaran.', 'error');
                return;
            }
            if (password.length < 6) {
                showToast('Kata sandi minimal 6 karakter.', 'error');
                return;
            }
            if (password.length > 15) {
                showToast('Kata sandi maksimal 15 karakter.', 'error');
                return;
            }

            const finalEmail = `${rawEmailPrefix}@zeniopost.com`;

            const emailExists = appState.zpUsers.some(
                u => (u.email || '').toLowerCase() === finalEmail.toLowerCase()
            );
            if (emailExists) {
                showToast(`Email "${finalEmail}" sudah terdaftar.`, 'error');
                return;
            }

            if (btn) { btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> Mendaftarkan...'; btn.disabled = true; }

            try {
                let avatarUrl = '';
                const avatarInput = document.getElementById('reg_avatar');
                if (avatarInput?.files?.[0]) {
                    await validateProfileImageDimensions(avatarInput.files[0]);
                    avatarUrl = await uploadFileMedia('reg_avatar', 'avatar');
                }

                const newUserPayload = {
                    full_name: fullName,
                    username: rawEmailPrefix,
                    email: finalEmail,
                    password_hash: password,
                    avatar_url: avatarUrl || '',
                    status: 'approved',
                    created_at: new Date().toISOString()
                };

                let createdUser = null;
                if (IS_PREVIEW) {
                    newUserPayload.id = 'u_' + Date.now();
                    mockUsers.unshift(newUserPayload);
                    createdUser = newUserPayload;
                } else {
                    const { data, error } = await dbClient.from('zp_users').insert([newUserPayload]).select();
                    if (error) throw error;
                    createdUser = data?.[0] || newUserPayload;
                }

                appState.currentUser = createdUser;
                localStorage.setItem('zeniopost_current_user', JSON.stringify(createdUser));
                await fetchData();
                showToast(`Pendaftaran berhasil! Selamat datang, <b>${fullName}</b>.`, 'success');
                renderApp();
            } catch (err) {
                showToast(err.message || 'Gagal mendaftarkan akun.', 'error');
                if (btn) { btn.innerHTML = 'Daftar & Masuk Sekarang'; btn.disabled = false; }
            }
        };

        // Login Pengguna Menggunakan Email @zeniopost.com & Kata Sandi (Maks 15 Karakter)
        window.handleUserLogin = async (e) => {
            e.preventDefault();
            let rawEmail = (document.getElementById('usr_login_email')?.value || '').trim().toLowerCase();
            const password = (document.getElementById('usr_login_pass')?.value || '').slice(0, 15);

            if (!rawEmail.includes('@')) {
                rawEmail = `${rawEmail}@zeniopost.com`;
            }

            await fetchData();
            const foundUser = appState.zpUsers.find(
                u => (u.email || '').toLowerCase() === rawEmail && u.password_hash === password
            );

            if (!foundUser) {
                showToast('Email Zeniopost atau kata sandi tidak sesuai.', 'error');
                return;
            }

            if (foundUser.status === 'rejected') {
                showToast('Maaf, akun Anda telah dinonaktifkan oleh Admin.', 'error');
                return;
            }

            appState.currentUser = foundUser;
            localStorage.setItem('zeniopost_current_user', JSON.stringify(foundUser));
            await fetchData();
            showToast(`Selamat datang kembali, ${foundUser.full_name}!`, 'success');
            renderApp();
        };

        window.logoutZeniopostUser = () => {
            appState.currentUser = null;
            appState.savedArticles = [];
            localStorage.removeItem('zeniopost_current_user');
            showToast('Anda telah keluar dari akun pengguna Zeniopost.', 'info');
            renderApp();
        };

        // Pratinjau + Tombol X (Batal) Sebelum Simpan Foto Profil di Halaman Akun
        window.previewProfileAvatarSelection = (event) => {
            const file = event.target.files?.[0];
            const box = document.getElementById('profile_pending_avatar_box');
            const img = document.getElementById('profile_pending_avatar_img');
            if (!file) {
                if (box) box.classList.add('hidden');
                return;
            }
            validateProfileImageDimensions(file)
                .then(() => {
                    const reader = new FileReader();
                    reader.onload = e => {
                        if (img) img.src = e.target.result;
                        if (box) box.classList.remove('hidden');
                    };
                    reader.readAsDataURL(file);
                })
                .catch(err => {
                    event.target.value = '';
                    if (box) box.classList.add('hidden');
                    showToast(err.message, 'error');
                });
        };

        window.cancelProfileAvatarSelection = () => {
            const inp = document.getElementById('profile_avatar_input');
            const box = document.getElementById('profile_pending_avatar_box');
            const img = document.getElementById('profile_pending_avatar_img');
            if (inp) inp.value = '';
            if (img) img.src = '';
            if (box) box.classList.add('hidden');
        };

        // Unggah / Ganti Foto Profil dengan Validasi Maksimal 1 MB (Rekomendasi 1:1)
        window.handleUpdateAvatar = async () => {
            const inputEl = document.getElementById('profile_avatar_input');
            const file = inputEl?.files?.[0];
            if (!file || !appState.currentUser) {
                showToast('Pilih foto terlebih dahulu.', 'error');
                return;
            }

            try {
                await validateProfileImageDimensions(file);
                showToast('Memproses foto profil...', 'info');
                const uploadedUrl = await uploadFileMedia('profile_avatar_input', 'avatar');

                if (IS_PREVIEW) {
                    const u = mockUsers.find(x => String(x.id) === String(appState.currentUser.id));
                    if (u) u.avatar_url = uploadedUrl;
                    appState.currentUser.avatar_url = uploadedUrl;
                } else {
                    const { error } = await dbClient.from('zp_users').update({ avatar_url: uploadedUrl }).eq('id', appState.currentUser.id);
                    if (error) throw error;
                    appState.currentUser.avatar_url = uploadedUrl;
                }

                localStorage.setItem('zeniopost_current_user', JSON.stringify(appState.currentUser));
                await fetchData();
                showToast('Foto profil berhasil diperbarui!', 'success');
                renderApp();
            } catch (err) {
                if (inputEl) inputEl.value = '';
                showToast(err.message || 'Gagal mengunggah foto profil.', 'error');
            }
        };

        // Hapus Foto Profil Pengguna
        window.handleRemoveAvatar = async (targetUserId = null) => {
            const uid = targetUserId || appState.currentUser?.id;
            if (!uid) return;

            try {
                if (IS_PREVIEW) {
                    const u = mockUsers.find(x => String(x.id) === String(uid));
                    if (u) u.avatar_url = '';
                } else {
                    const { error } = await dbClient.from('zp_users').update({ avatar_url: '' }).eq('id', uid);
                    if (error) throw error;
                }

                if (appState.currentUser && String(appState.currentUser.id) === String(uid)) {
                    appState.currentUser.avatar_url = '';
                    localStorage.setItem('zeniopost_current_user', JSON.stringify(appState.currentUser));
                }

                await fetchData();
                showToast('Foto profil berhasil dihapus.', 'success');
                renderApp();
            } catch (err) {
                showToast(err.message || 'Gagal menghapus foto profil.', 'error');
            }
        };

        // Pengajuan Lupa Kata Sandi Menyatu di Bagian Masuk Akun:
        // Wajib mengisi Email Google (Gmail) Aktif dan Nomor Telepon karena sandi baru akan dikirim ke Gmail (bukan ke Chat).
        window.handleRequestPasswordRecovery = async (e) => {
            e.preventDefault();
            let rawZpEmail = (document.getElementById('rec_zp_email')?.value || '').trim().toLowerCase();
            const activeGmail = (document.getElementById('rec_gmail')?.value || '').trim().toLowerCase();
            const phoneNum = (document.getElementById('rec_phone')?.value || '').trim();
            const reqNewPassword = (document.getElementById('rec_new_password')?.value || '').trim();
            const reason = (document.getElementById('rec_reason')?.value || '').trim();

            if (!rawZpEmail) {
                showToast('Harap isi akun Zeniopost yang ingin dipulihkan.', 'error');
                return;
            }
            if (!rawZpEmail.includes('@')) rawZpEmail = `${rawZpEmail}@zeniopost.com`;

            if (!activeGmail || !activeGmail.endsWith('@gmail.com')) {
                showToast('Wajib mengisi alamat email Google aktif (@gmail.com) karena sandi baru akan dikirim ke Gmail Anda.', 'error');
                return;
            }
            if (!phoneNum || phoneNum.replace(/[^0-9]/g, '').length < 8) {
                showToast('Wajib mengisi nomor telepon aktif yang valid.', 'error');
                return;
            }
            if (reqNewPassword.length < 6 || reqNewPassword.length > 15) {
                showToast('Request kata sandi baru harus 6 hingga 15 karakter.', 'error');
                return;
            }
            if (!reason) {
                showToast('Harap tuliskan alasan permohonan ganti sandi.', 'error');
                return;
            }

            await fetchData();
            const targetUser = appState.zpUsers.find(u => (u.email || '').toLowerCase() === rawZpEmail);
            if (!targetUser) {
                showToast(`Akun "${rawZpEmail}" tidak ditemukan dalam sistem Zeniopost.`, 'error');
                return;
            }

            const existingRequest = appState.passwordResets.find(
                r => (r.email || '').toLowerCase() === rawZpEmail && r.status === 'pending'
            );
            if (existingRequest) {
                showToast(`Sudah ada pengajuan sandi baru untuk ${rawZpEmail} yang sedang menunggu persetujuan Admin.`, 'info');
                return;
            }

            // Simpan metadata Gmail Aktif, Nomor Telepon, dan Request Sandi Baru
            const encodedReason = `[GMAIL:${activeGmail}][TELP:${phoneNum}][SANDI_BARU:${reqNewPassword}] ${reason}`;

            const payload = {
                user_id: targetUser.id,
                email: rawZpEmail,
                active_email: activeGmail,
                phone_number: phoneNum,
                requested_password: reqNewPassword,
                reason: encodedReason,
                status: 'pending',
                created_at: new Date().toISOString()
            };

            try {
                if (IS_PREVIEW) {
                    payload.id = 'pr_' + Date.now();
                    mockPasswordResets.unshift(payload);
                } else {
                    const { error } = await dbClient.from('zp_password_resets').insert([payload]);
                    if (error) {
                        // Fallback kompatibilitas jika kolom baru belum ditambahkan di tabel lama
                        const fallbackPayload = {
                            user_id: targetUser.id,
                            email: rawZpEmail,
                            reason: encodedReason,
                            status: 'pending',
                            created_at: new Date().toISOString()
                        };
                        const { error: err2 } = await dbClient.from('zp_password_resets').insert([fallbackPayload]);
                        if (err2) throw err2;
                    }
                }
                await fetchData();
                showToast(`Permintaan sandi baru berhasil dikirim! Setelah disetujui Admin, sandi baru akan dikirimkan ke Gmail <b>${activeGmail}</b>.`, 'success');
                appState.showForgotForm = false;
                renderApp();
            } catch (err) {
                showToast(err.message || 'Gagal mengajukan permintaan sandi baru.', 'error');
            }
        };

        // Helper mengekstrak Gmail aktif, Nomor Telepon, Request Sandi Baru & Alasan dari objek reset
        const parseResetRequestData = (r) => {
            let reqPass = r.requested_password || '';
            let activeGmail = r.active_email || '';
            let phoneNum = r.phone_number || '';
            let cleanReason = r.reason || '';

            const gmailMatch = cleanReason.match(/\[GMAIL:([^\]]+)\]/);
            if (gmailMatch) {
                if (!activeGmail) activeGmail = gmailMatch[1];
                cleanReason = cleanReason.replace(gmailMatch[0], '');
            }
            const phoneMatch = cleanReason.match(/\[TELP:([^\]]+)\]/);
            if (phoneMatch) {
                if (!phoneNum) phoneNum = phoneMatch[1];
                cleanReason = cleanReason.replace(phoneMatch[0], '');
            }
            const passMatch = cleanReason.match(/\[SANDI_BARU:([^\]]+)\]/);
            if (passMatch) {
                if (!reqPass) reqPass = passMatch[1];
                cleanReason = cleanReason.replace(passMatch[0], '');
            }
            cleanReason = cleanReason.trim();
            return { reqPass, activeGmail, phoneNum, cleanReason };
        };

        // =====================================================================
        // 10. CHAT DENGAN ADMIN + FITUR HAPUS PESAN OLEH ADMIN
        // =====================================================================
        const getUnreadChatCountForUser = () => {
            if (!appState.currentUser) return 0;
            return appState.messages.filter(
                m => String(m.user_id) === String(appState.currentUser.id) && m.sender_role === 'admin' && !m.is_read
            ).length;
        };

        const getUnreadChatCountForAdmin = () => {
            return appState.messages.filter(m => m.sender_role === 'user' && !m.is_read).length;
        };

        const markMessagesAsRead = async (userId, viewerRole) => {
            if (!userId) return;
            const targetSender = viewerRole === 'admin' ? 'user' : 'admin';
            const unreadList = appState.messages.filter(
                m => String(m.user_id) === String(userId) && m.sender_role === targetSender && !m.is_read
            );
            if (unreadList.length === 0) return;

            unreadList.forEach(m => { m.is_read = true; });
            if (!IS_PREVIEW && dbClient) {
                try {
                    const ids = unreadList.map(m => m.id);
                    await dbClient.from('zp_messages').update({ is_read: true }).in('id', ids);
                } catch (e) {}
            }
        };

        window.sendChatMessage = async (e, senderRole = 'user', targetUserId = null) => {
            e.preventDefault();
            const uid = senderRole === 'admin' ? targetUserId : appState.currentUser?.id;
            if (!uid) {
                showToast('Silakan login ke akun Zeniopost Anda terlebih dahulu untuk mengirim pesan chat.', 'error');
                return;
            }

            const inputId = senderRole === 'admin' ? 'admin_chat_input' : 'user_chat_input';
            const catId = senderRole === 'admin' ? null : 'user_chat_category';
            const text = (document.getElementById(inputId)?.value || '').trim();
            const category = catId ? (document.getElementById(catId)?.value || 'Pertanyaan Umum') : 'Balasan Admin';

            if (!text) return;

            const payload = {
                user_id: uid,
                sender_role: senderRole,
                category,
                message: text,
                is_read: false,
                created_at: new Date().toISOString()
            };

            try {
                if (IS_PREVIEW) {
                    payload.id = 'm_' + Date.now();
                    mockMessages.push(payload);
                    appState.messages.push(payload);
                } else {
                    const { data, error } = await dbClient.from('zp_messages').insert([payload]).select();
                    if (error) throw error;
                    if (data && data[0]) appState.messages.push(data[0]);
                }
                const inp = document.getElementById(inputId);
                if (inp) inp.value = '';
                renderApp();
            } catch (err) {
                showToast(err.message || 'Gagal mengirim pesan.', 'error');
            }
        };

        // Fitur Hapus Pesan Chat oleh Admin (Pesan Tunggal atau Seluruh Percakapan Pengguna)
        window.deleteChatMessage = async (messageId) => {
            try {
                if (!IS_PREVIEW && dbClient) {
                    const { error } = await dbClient.from('zp_messages').delete().eq('id', messageId);
                    if (error) throw error;
                }
                appState.messages = appState.messages.filter(m => String(m.id) !== String(messageId));
                mockMessages = mockMessages.filter(m => String(m.id) !== String(messageId));
                showToast('Pesan berhasil dihapus.', 'success');
                renderApp();
            } catch (err) {
                showToast(err.message || 'Gagal menghapus pesan.', 'error');
            }
        };

        window.deleteAllUserChatMessages = async (userId) => {
            if (!userId) return;
            try {
                if (!IS_PREVIEW && dbClient) {
                    const { error } = await dbClient.from('zp_messages').delete().eq('user_id', userId);
                    if (error) throw error;
                }
                appState.messages = appState.messages.filter(m => String(m.user_id) !== String(userId));
                mockMessages = mockMessages.filter(m => String(m.user_id) !== String(userId));
                showToast('Seluruh riwayat pesan pengguna ini telah dihapus.', 'success');
                renderApp();
            } catch (err) {
                showToast(err.message || 'Gagal menghapus riwayat percakapan.', 'error');
            }
        };

        // =====================================================================
        // 11. KOMENTAR BERJENJANG & SUKA KOMENTAR
        // =====================================================================
        const parseCommentMeta = (c) => {
            let rawContent = c.content || '';
            let parentId = c.parent_id ? String(c.parent_id) : null;
            let replyToName = '';
            const replyMatch = rawContent.match(/^\[REPLY:([^:\]]+):([^\]]*)\]\s*/);
            if (replyMatch) {
                if (!parentId) parentId = String(replyMatch[1]);
                replyToName = replyMatch[2] || '';
                rawContent = rawContent.slice(replyMatch[0].length);
            }
            return { ...c, cleanContent: rawContent, parsedParentId: parentId, replyToName };
        };

        const getCommentLikes = (c) => {
            if (!c) return 0;
            const idStr = String(c.id);
            if (appState.localCommentLikesMap[idStr] !== undefined) {
                return Math.max(0, Number(appState.localCommentLikesMap[idStr]));
            }
            return Math.max(0, Number(c.likes) || 0);
        };

        const isCommentLiked = (commentId) => appState.likedCommentIds.includes(String(commentId));

        const getArticleComments = (articleId) => {
            return (appState.comments || [])
                .filter(c => String(c.article_id) === String(articleId))
                .map(c => parseCommentMeta(c))
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
        };

        const renderSingleCommentItem = (c, allComments, articleId, prefix, isReply = false) => {
            const isAnon = Boolean(c.is_anonymous) || (c.author_name || '').toLowerCase() === 'anonim';
            const displayName = isAnon ? 'Anonim' : (c.author_name || 'Pembaca');
            const safeDisplayName = displayName.replace(/'/g, "\\'").replace(/"/g, '&quot;');
            const likeCount = getCommentLikes(c);
            const liked = isCommentLiked(c.id);
            const replies = allComments
                .filter(r => String(r.parsedParentId) === String(c.id))
                .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

            return `
                <div class="${isReply ? 'p-3.5 rounded-2xl bg-slate-50/90 border border-slate-200/80' : 'p-4 rounded-2xl bg-white border border-slate-100 shadow-sm'} space-y-2.5">
                    <div class="flex items-start justify-between gap-2">
                        <div class="flex items-center gap-2.5">
                            <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold shrink-0 ${isAnon ? 'bg-slate-800 text-white' : 'bg-blue-100 text-blue-700'}">
                                <i class="fas ${isAnon ? 'fa-user-secret' : 'fa-user'}"></i>
                            </div>
                            <div>
                                <div class="flex items-center gap-1.5 flex-wrap">
                                    <span class="text-xs md:text-sm font-extrabold text-slate-900">${displayName}</span>
                                    ${isAnon ? `<span class="text-[10px] font-bold bg-slate-100 text-slate-500 px-2 py-0.5 rounded-full">Anonim</span>` : ''}
                                    ${c.replyToName ? `<span class="text-[10px] font-bold bg-blue-50 text-blue-600 px-2 py-0.5 rounded-full flex items-center gap-1"><i class="fas fa-reply text-[9px]"></i> @${c.replyToName}</span>` : ''}
                                </div>
                                <div class="text-[11px] font-semibold text-slate-400 flex items-center gap-1 mt-0.5">
                                    <i class="far fa-calendar-alt text-blue-500"></i> ${formatWaktu(c.created_at)}
                                </div>
                            </div>
                        </div>
                        ${appState.user ? `
                            <button type="button" onclick="window.deleteComment('${c.id}', '${articleId}')" class="bg-red-50 hover:bg-red-600 text-red-600 hover:text-white border border-red-200 px-3 py-1.5 rounded-xl text-xs font-extrabold flex items-center gap-1.5 transition shrink-0">
                                <i class="fas fa-trash-alt"></i> Hapus
                            </button>
                        ` : ''}
                    </div>
                    <p class="text-xs md:text-sm text-slate-700 leading-relaxed whitespace-pre-wrap pl-10">${c.cleanContent || ''}</p>
                    <div class="pl-10 pt-1 flex items-center gap-3 flex-wrap">
                        <button type="button" onclick="window.toggleLikeComment('${c.id}', '${articleId}')" class="px-3 py-1.5 rounded-xl text-xs font-extrabold border transition flex items-center gap-1.5 ${liked ? 'bg-rose-50 text-rose-600 border-rose-200 shadow-sm' : 'bg-slate-50 hover:bg-rose-50/60 text-slate-600 hover:text-rose-600 border-slate-200'}">
                            <i class="${liked ? 'fas' : 'far'} fa-heart ${liked ? 'text-rose-600' : ''}"></i>
                            <span>Suka</span>
                            ${likeCount > 0 ? `<span class="px-1.5 py-0.2 rounded-full text-[11px] ${liked ? 'bg-rose-100 text-rose-700' : 'bg-slate-200/70 text-slate-700'}">${likeCount}</span>` : ''}
                        </button>
                        <button type="button" onclick="window.toggleReplyBox('${prefix}', '${c.id}')" class="px-3 py-1.5 rounded-xl text-xs font-extrabold bg-slate-50 hover:bg-blue-50 text-slate-600 hover:text-blue-600 border border-slate-200 transition flex items-center gap-1.5">
                            <i class="fas fa-reply text-[11px]"></i> <span>Balas</span>
                        </button>
                    </div>
                    <div id="reply-box-${prefix}-${c.id}" class="hidden pl-6 md:pl-10 pt-2">
                        <form onsubmit="window.submitReply(event, '${articleId}', '${c.id}', '${safeDisplayName}', '${prefix}')" class="bg-slate-50 border border-blue-200 rounded-2xl p-3.5 space-y-3 shadow-sm">
                            <div class="flex items-center justify-between">
                                <span class="text-[11px] font-extrabold text-blue-700"><i class="fas fa-reply mr-1"></i>Membalas @${displayName}</span>
                                <button type="button" onclick="window.toggleReplyBox('${prefix}', '${c.id}')" class="text-slate-400 hover:text-red-500 text-xs font-bold"><i class="fas fa-times"></i> Batal</button>
                            </div>
                            <input type="text" id="reply-name-${prefix}-${c.id}" value="${appState.currentUser ? appState.currentUser.full_name : ''}" placeholder="Nama Anda (Kosongkan untuk Anonim)..." class="w-full p-2.5 bg-white border border-slate-200 rounded-xl text-xs font-bold outline-none focus:border-blue-500">
                            <textarea id="reply-text-${prefix}-${c.id}" required rows="2" placeholder="Tulis balasan Anda..." class="w-full p-2.5 bg-white border border-slate-200 rounded-xl text-xs font-medium outline-none focus:border-blue-500"></textarea>
                            <div class="flex justify-end">
                                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-xl text-xs"><i class="fas fa-paper-plane mr-1"></i>Kirim Balasan</button>
                            </div>
                        </form>
                    </div>
                    ${replies.length > 0 ? `<div class="pl-4 md:pl-8 ml-4 md:ml-6 border-l-2 border-blue-100 space-y-2.5 pt-2">${replies.map(r => renderSingleCommentItem(r, allComments, articleId, prefix, true)).join('')}</div>` : ''}
                </div>
            `;
        };

        const renderCommentsSection = (articleId, prefix = 'pop') => {
            const allList = getArticleComments(articleId);
            const allIds = new Set(allList.map(c => String(c.id)));
            const rootComments = allList.filter(c => !c.parsedParentId || !allIds.has(String(c.parsedParentId)));
            const defaultAuthor = appState.currentUser ? appState.currentUser.full_name : '';

            return `
                <div id="comments-wrapper-${prefix}-${articleId}" class="mt-6 pt-6 border-t border-slate-200 space-y-5">
                    <div class="flex items-center justify-between">
                        <h3 class="text-base md:text-lg font-extrabold text-slate-900 flex items-center gap-2">
                            <span class="w-8 h-8 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-sm"><i class="fas fa-comments"></i></span>
                            Komentar Pembaca
                            <span class="text-xs font-extrabold bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full">${allList.length}</span>
                        </h3>
                    </div>
                    <form onsubmit="window.submitComment(event, '${articleId}', '${prefix}')" class="bg-slate-50 border border-slate-200 rounded-2xl p-4 space-y-3">
                        <input type="text" id="comment-name-${prefix}" value="${defaultAuthor}" placeholder="Nama Anda (Kosongkan jika ingin sebagai Anonim)" class="w-full p-3 bg-white border border-slate-200 rounded-xl text-xs md:text-sm font-bold outline-none focus:border-blue-500">
                        <textarea id="comment-text-${prefix}" required rows="3" placeholder="Tulis tanggapan atau komentar Anda..." class="w-full p-3 bg-white border border-slate-200 rounded-xl text-xs md:text-sm font-medium outline-none focus:border-blue-500"></textarea>
                        <div class="flex justify-end">
                            <button type="submit" class="bg-slate-900 hover:bg-blue-600 text-white font-bold py-2.5 px-5 rounded-xl text-xs md:text-sm shadow-sm flex items-center gap-2 transition">
                                <i class="fas fa-paper-plane"></i> Kirim Komentar
                            </button>
                        </div>
                    </form>
                    <div class="space-y-3">
                        ${rootComments.length === 0 ? `<div class="text-center py-6 px-4 bg-white rounded-2xl border border-slate-100 text-slate-400 text-xs font-bold">Belum ada komentar. Jadilah yang pertama memberikan tanggapan!</div>` : rootComments.map(c => renderSingleCommentItem(c, allList, articleId, prefix, false)).join('')}
                    </div>
                </div>
            `;
        };

        const refreshCommentViews = (articleId) => {
            ['pop', 'page', 'adminmod'].forEach(pref => {
                const wrap = document.getElementById(`comments-wrapper-${pref}-${articleId}`);
                if (wrap) wrap.outerHTML = renderCommentsSection(articleId, pref);
            });
        };

        window.submitComment = async (e, articleId, prefix = 'pop') => {
            e.preventDefault();
            const rawName = (document.getElementById(`comment-name-${prefix}`)?.value || '').trim();
            const rawText = (document.getElementById(`comment-text-${prefix}`)?.value || '').trim();
            if (!rawText) return;
            const isAnon = !rawName;
            const payload = {
                article_id: articleId,
                author_name: isAnon ? 'Anonim' : rawName,
                is_anonymous: isAnon,
                content: rawText,
                created_at: new Date().toISOString()
            };
            if (IS_PREVIEW) {
                const saved = { ...payload, id: 'c_' + Date.now() };
                mockComments.unshift(saved);
                appState.comments.unshift(saved);
            } else if (dbClient) {
                const { data } = await dbClient.from('comments').insert([payload]).select();
                appState.comments.unshift(data?.[0] || { ...payload, id: 'local_' + Date.now() });
            }
            showToast('Komentar berhasil dikirim!', 'success');
            refreshCommentViews(articleId);
        };

        window.toggleReplyBox = (prefix, commentId) => {
            const box = document.getElementById(`reply-box-${prefix}-${commentId}`);
            if (box) box.classList.toggle('hidden');
        };

        window.submitReply = async (e, articleId, parentCommentId, replyToName, prefix = 'pop') => {
            e.preventDefault();
            const rawName = (document.getElementById(`reply-name-${prefix}-${parentCommentId}`)?.value || '').trim();
            const rawText = (document.getElementById(`reply-text-${prefix}-${parentCommentId}`)?.value || '').trim();
            if (!rawText) return;
            const isAnon = !rawName;
            const payload = {
                article_id: articleId,
                author_name: isAnon ? 'Anonim' : rawName,
                is_anonymous: isAnon,
                content: `[REPLY:${parentCommentId}:${replyToName}] ${rawText}`,
                created_at: new Date().toISOString()
            };
            if (IS_PREVIEW) {
                const saved = { ...payload, id: 'c_' + Date.now() };
                mockComments.unshift(saved);
                appState.comments.unshift(saved);
            } else if (dbClient) {
                const { data } = await dbClient.from('comments').insert([payload]).select();
                appState.comments.unshift(data?.[0] || { ...payload, id: 'local_' + Date.now() });
            }
            showToast('Balasan terkirim!', 'success');
            refreshCommentViews(articleId);
        };

        window.toggleLikeComment = async (commentId, articleId) => {
            const idStr = String(commentId);
            const target = appState.comments.find(c => String(c.id) === idStr);
            if (!target) return;
            const alreadyLiked = isCommentLiked(idStr);
            const nextLikes = alreadyLiked ? Math.max(0, getCommentLikes(target) - 1) : getCommentLikes(target) + 1;
            if (alreadyLiked) appState.likedCommentIds = appState.likedCommentIds.filter(id => id !== idStr);
            else appState.likedCommentIds.push(idStr);
            target.likes = nextLikes;
            appState.localCommentLikesMap[idStr] = nextLikes;
            localStorage.setItem('zeniopost_liked_comments', JSON.stringify(appState.likedCommentIds));
            localStorage.setItem('zeniopost_comment_likes_map', JSON.stringify(appState.localCommentLikesMap));
            refreshCommentViews(articleId);
            if (!IS_PREVIEW && dbClient && !idStr.startsWith('local_')) {
                try { await dbClient.from('comments').update({ likes: nextLikes }).eq('id', commentId); } catch (e) {}
            }
        };

        window.deleteComment = async (commentId, articleId = null) => {
            if (!IS_PREVIEW && dbClient) {
                await dbClient.from('comments').delete().eq('id', commentId);
            }
            appState.comments = appState.comments.filter(c => String(c.id) !== String(commentId));
            mockComments = mockComments.filter(c => String(c.id) !== String(commentId));
            showToast('Komentar dihapus oleh Admin.', 'success');
            refreshCommentViews(articleId);
            if (appState.view === 'admin') renderApp();
        };

        // =====================================================================
        // 12. HELPER PENULIS, META SHARE & POP-UP BACA BERITA
        // =====================================================================
        const parseAuthorInfo = (article) => {
            let rawName = article.author_name || 'Anonim';
            let social = article.author_social || '';
            if (rawName.includes('|||')) {
                const parts = rawName.split('|||');
                rawName = parts[0].trim();
                social = social || (parts[1] ? parts[1].trim() : '');
            }
            social = social.trim();
            let socialUrl = '';
            let socialLabel = social;
            if (social) {
                if (social.startsWith('http://') || social.startsWith('https://')) {
                    socialUrl = social;
                    try {
                        const u = new URL(social);
                        const path = u.pathname.replace(/^\/+|\/+$/g, '');
                        socialLabel = path ? `${u.hostname.replace('www.', '')}/${path}` : u.hostname.replace('www.', '');
                    } catch (e) {}
                } else {
                    const cleanHandle = social.replace(/^@/, '').trim();
                    if (cleanHandle) {
                        socialUrl = `https://instagram.com/${cleanHandle}`;
                        socialLabel = `@${cleanHandle}`;
                    }
                }
            }
            const authorUser = article.user_id
                ? appState.zpUsers.find(u => String(u.id) === String(article.user_id))
                : null;
            const hasAccount = Boolean(article.user_id || authorUser);
            const avatarUrl = authorUser?.avatar_url || '';

            return { name: rawName, social, socialUrl, socialLabel, avatarUrl, hasAccount };
        };

        // Helper merender Nama Penulis + Badge Centang (Biru = Resmi Admin Zeniopost, Abu-abu = Punya Akun, Tanpa Badge = Tamu)
        const renderAuthorNameWithBadge = (article, info = null, sizeClass = 'text-xs') => {
            const parsed = info || parseAuthorInfo(article);
            if (article.is_official) {
                return `<span class="text-slate-900">Zeniopost</span> <i class="fas fa-check-circle text-blue-600 ${sizeClass}" title="Akun Resmi Zeniopost"></i>`;
            }
            if (parsed.hasAccount) {
                return `<span class="text-slate-800 truncate">${parsed.name}</span> <i class="fas fa-check-circle text-slate-400 ${sizeClass}" title="Penulis Terdaftar Zeniopost"></i>`;
            }
            return `<span class="text-slate-800 truncate">${parsed.name}</span>`;
        };

        const updateMetaTags = (article) => {
            if (!article) return;
            document.title = `${article.title} - Zeniopost`;
            document.getElementById('og-title')?.setAttribute('content', article.title);
            document.getElementById('og-desc')?.setAttribute('content', stripHtml(article.content || '').substring(0, 150));
            if (article.image_url) document.getElementById('og-image')?.setAttribute('content', article.image_url);
        };

        const safeUpdateHistory = (articleId = null, title = 'Zeniopost') => {
            try {
                if (window.location.protocol === 'http:' || window.location.protocol === 'https:') {
                    const targetUrl = articleId ? `?article=${articleId}` : window.location.pathname;
                    window.history.replaceState({}, title, targetUrl);
                }
            } catch (e) {}
        };

        const getShareUrl = (articleId) => {
            const origin = (window.location.protocol === 'http:' || window.location.protocol === 'https:')
                ? window.location.origin
                : 'https://www.zeniopost.my.id';
            if (appState.hasDynamicShare) {
                return `${origin}/api/share?id=${articleId}`;
            }
            if (window.location.protocol === 'http:' || window.location.protocol === 'https:') {
                return `${window.location.origin}${window.location.pathname}?article=${articleId}`;
            }
            return `${origin}/?article=${articleId}`;
        };

        window.shareArticle = async (articleId) => {
            const a = appState.articles.find(x => String(x.id) === String(articleId)) || appState.readArticle;
            if (!a) return;
            updateMetaTags(a);
            const shareUrl = getShareUrl(a.id);
            if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent || '') && navigator.share) {
                try { await navigator.share({ title: a.title, url: shareUrl }); return; } catch (e) {}
            }
            navigator.clipboard?.writeText(shareUrl);
            showToast('<i class="fas fa-check-circle mr-1"></i> Link berita berhasil disalin!', 'success');
        };

                    <!-- Header Pop-up dengan Logo Proporsional & Tanpa Shape Latar Belakang -->

                        <div class="flex items-center shrink-0">
                            <img src="${LOGO_URL}" alt="Logo Zeniopost" onerror="this.src='${LOGO_FALLBACK_URL}'" class="h-12 sm:h-14 md:h-16 w-auto object-contain block">
                        </div>
                        <div class="flex items-center gap-1.5 md:gap-2 flex-wrap justify-end">
                            <button type="button" onclick="window.toggleSaveArticle('${a.id}', event); if(window.isUserLoggedIn()) window.openArticlePopup('${a.id}')" class="px-3.5 py-2 rounded-xl text-xs font-extrabold border flex items-center gap-1.5 transition ${isGuest ? 'bg-white text-slate-600 border-slate-300 hover:border-slate-900 hover:text-slate-900' : saved ? 'bg-blue-600 text-white border-blue-600' : 'bg-white hover:bg-slate-50 text-slate-800 border-slate-900'}">
                                <i class="fas ${isGuest ? 'fa-lock text-slate-500' : saved ? 'fa-bookmark' : 'far fa-bookmark'}"></i>
                                <span>${isGuest ? 'Simpan (Login)' : saved ? 'Tersimpan' : 'Simpan'}</span>

                            <button type="button" onclick="window.closeModal(); app.navigate('article', '${a.id}')" class="bg-white hover:bg-slate-50 text-slate-800 border border-slate-300 px-3 py-2 rounded-xl text-xs font-extrabold flex items-center gap-1.5 transition">
                                <i class="fas fa-expand text-blue-600"></i> <span class="hidden sm:inline">Layar Penuh</span>
                            </button>
                            <button type="button" onclick="window.shareArticle('${a.id}')" class="bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-2 rounded-xl text-xs font-extrabold flex items-center gap-1.5 transition">
                                <i class="fas fa-share-nodes"></i> <span>Bagikan</span>
                            </button>
                            <button type="button" onclick="window.closeModal()" class="w-9 h-9 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center transition">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Isi Artikel Scrollable -->
                    <div class="overflow-y-auto p-6 space-y-5 flex-1">
                        <div class="rounded-2xl overflow-hidden bg-slate-100 border border-slate-100">
                            <img src="${a.image_url}" alt="${a.title}" class="w-full max-h-96 object-cover">
                        </div>
                        <h1 class="text-2xl md:text-3xl font-extrabold text-slate-900 leading-snug">${a.title}</h1>

                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 p-4 rounded-2xl bg-slate-50 border border-slate-100">
                            <div class="flex items-center gap-3">
                                ${a.is_official ? '' : info.avatarUrl ? `
                                    <img src="${info.avatarUrl}" alt="${info.name}" class="w-10 h-10 rounded-full object-cover border border-blue-200 shrink-0">

                                    <div class="w-10 h-10 rounded-full flex items-center justify-center text-base font-bold shrink-0 bg-slate-200 text-slate-700"><i class="fas fa-user"></i></div>
                                `}
                                <div>
                                    <div class="font-extrabold text-sm md:text-base flex items-center gap-1.5">
                                        ${renderAuthorNameWithBadge(a, info, 'text-sm')}

                                        <span>•</span>
                                        <span class="text-blue-600 font-extrabold"><i class="far fa-eye mr-1"></i>${getArticleViews(a)}x dibaca</span>
                                    </div>
                                </div>
                            </div>
                            ${!a.is_official && info.socialUrl ? `
                                <a href="${info.socialUrl}" target="_blank" rel="noopener noreferrer" class="flex items-center gap-2 px-3.5 py-2 rounded-xl bg-white border border-blue-100 hover:border-blue-300 text-xs font-extrabold text-blue-600">
                                    <i class="fas fa-link"></i> <span>${info.socialLabel}</span> <i class="fas fa-external-link-alt text-[10px]"></i>
                                </a>
                            ` : ''}
                        </div>

                        <div class="text-slate-700 text-base leading-relaxed pt-2">${sanitizeAndFormatArticleHtml(a.content)}</div>

                        <!-- Komentar Pembaca -->
                        ${renderCommentsSection(a.id, 'pop')}

                        ${renderRecommendationsBlock(a, true)}
                    </div>
                </div>
            `;
        };

        window.isUserLoggedIn = () => Boolean(appState.currentUser);

        // Pratinjau Artikel Sebelum Diajukan / Disimpan Draf
        window.previewSubmissionArticle = () => {

            const topicId = document.getElementById('f_topic')?.value || '';

            const previewEl = document.getElementById('preview_f');

            const imgMatch = bgStyle.match(/url\(["']?([^"']*)["']?\)/);

                        </div>
                        <button onclick="window.closeModal()" class="w-8 h-8 rounded-full bg-slate-800 hover:bg-red-500 text-white flex items-center justify-center"><i class="fas fa-times"></i></button>
                    </div>
                    <div class="p-6 overflow-y-auto space-y-4">
                        <img src="${imgUrl}" class="w-full max-h-72 object-cover rounded-2xl border border-slate-200">
