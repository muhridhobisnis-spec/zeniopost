            background-color: #f8fafc !important;
            color: #0f172a !important;

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Styling Rich Text Editor Berita */
        .rich-editor {
            background-color: #ffffff !important;
            color: #0f172a !important;
            word-break: break-word;
            overflow-wrap: break-word;

        .rich-editor:empty:before {
            content: attr(data-placeholder);
            color: #94a3b8;
            pointer-events: none;
            display: block;
        }

            font-weight: 800;
        }
        .rich-editor i, .rich-editor em, .article-rich-content i, .article-rich-content em {
            font-style: italic;
        }
        .rich-editor u, .article-rich-content u {
            text-decoration: underline;
        }
        .article-rich-content p, .article-rich-content div {
            margin-bottom: 0.5rem;
        }

        const supabase = IS_PREVIEW ? null : createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const appState = {
            view: 'home', 
            activeTopicId: null,
            articles: [],
            topics: [],
            comments: [],
            user: null,
            readArticle: null,
            shareModalArticle: null,
            confirmDeleteId: null,
            editingTopicId: null,
            deletingTopicId: null,
            searchQuery: '',
            filterDate: '',
            localViewsMap: {},
            countedInOpen: null,
            hasDynamicShare: false,
            likedCommentIds: JSON.parse(localStorage.getItem('zeniopost_liked_comments') || '[]'),
            localCommentLikesMap: JSON.parse(localStorage.getItem('zeniopost_comment_likes_map') || '{}')
        };

        // Cek apakah endpoint preview WhatsApp (/api/share) sudah aktif di Vercel
        const checkDynamicShareEndpoint = async () => {
            try {
                if (window.location.protocol !== 'http:' && window.location.protocol !== 'https:') return;
                const res = await fetch('/api/share?ping=1', { method: 'GET' });
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.ok) appState.hasDynamicShare = true;
                }
            } catch (e) {
                appState.hasDynamicShare = false;
            }
        };

        // Data Cadangan Jika Mode Preview
        let mockTopics = [{ id: '1', name: 'Teknologi' }, { id: '2', name: 'Nasional' }];
        let mockArticles = [
            { id: '101', title: 'Perkembangan AI 2026 di Indonesia', content: 'Teknologi <b>kecerdasan buatan</b> semakin maju dan membantu berbagai sektor industri maupun pendidikan masyarakat luas di tahun 2026.', image_url: 'https://placehold.co/800x400/2563eb/white?text=Teknologi', author_name: 'Zeniopost ||| https://instagram.com/zeniopost', topic_id: '1', status: 'approved', is_official: true, views: 142, created_at: new Date().toISOString() },
            { id: '102', title: 'Gotong Royong Warga Bersihkan Lingkungan', content: 'Warga bersama pemuda setempat mengadakan kegiatan <i>bersih-bersih lingkungan</i> sekolah dan fasilitas umum agar tetap nyaman dan sehat.', image_url: 'https://placehold.co/800x400/10b981/white?text=Berita+Warga', author_name: 'Budi Santoso ||| @budisantoso_id', topic_id: '2', status: 'approved', is_official: false, views: 98, created_at: new Date(Date.now() - 3600000).toISOString() }
        ];
        let mockComments = [
            { id: 'c1', article_id: '101', author_name: 'Rizky Pratama', is_anonymous: false, content: 'Informasi yang sangat bermanfaat, semoga teknologi AI makin merata di daerah!', likes: 5, parent_id: null, created_at: new Date(Date.now() - 1800000).toISOString() },
            { id: 'c2', article_id: '101', author_name: 'Anonim', is_anonymous: true, content: 'Setuju banget, sangat membantu pekerjaan sehari-hari.', likes: 2, parent_id: 'c1', created_at: new Date(Date.now() - 900000).toISOString() }
        ];

        // =====================================================================
        // HELPER RICH TEXT EDITOR (BOLD, ITALIC, UNDERLINE & RATA KIRI/TENGAH/KANAN)
        // =====================================================================
        const stripHtml = (rawHtml) => {
            if (!rawHtml) return '';
            const withSpaces = String(rawHtml)
                .replace(/<br\s*\/?>/gi, ' ')
                .replace(/<\/(p|div|li|h[1-6])>/gi, ' ');
            const temp = document.createElement('div');
            temp.innerHTML = withSpaces;
            return (temp.textContent || temp.innerText || '').replace(/\s+/g, ' ').trim();
        };

        const sanitizeAndFormatArticleHtml = (rawContent) => {
            if (!rawContent) return '';
            const str = String(rawContent);
            const hasHtmlTag = /<\/?[a-z][\s\S]*>/i.test(str);

            if (!hasHtmlTag) {
                const escaped = str
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;');
                return `<div class="whitespace-pre-wrap">${escaped}</div>`;
            }

            // Bersihkan tag berbahaya (script, iframe, event handler on*) namun pertahankan format teks & perataan
            const temp = document.createElement('div');
            temp.innerHTML = str;
            temp.querySelectorAll('script, iframe, object, embed, style, link, meta').forEach(el => el.remove());
            temp.querySelectorAll('*').forEach(el => {
                Array.from(el.attributes).forEach(attr => {
                    const name = attr.name.toLowerCase();
                    if (name.startsWith('on') || (name === 'href' && attr.value.trim().toLowerCase().startsWith('javascript:'))) {
                        el.removeAttribute(attr.name);
                    }
                });
            });
            return `<div class="article-rich-content">${temp.innerHTML}</div>`;
        };

        const prepareInitialEditorHtml = (rawContent) => {
            if (!rawContent) return '';
            const str = String(rawContent);
            if (/<\/?[a-z][\s\S]*>/i.test(str)) {
                return str;
            }
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/\n/g, '<br>');
        };

        const renderRichTextEditor = (editorId, placeholder = 'Tulis isi berita lengkap di sini...', initialContent = '', minHeightClass = 'min-h-[180px]') => {
            const safeInitial = prepareInitialEditorHtml(initialContent);
            return `
                <div class="border border-slate-200 rounded-2xl overflow-hidden bg-white focus-within:border-blue-500 focus-within:ring-2 focus-within:ring-blue-500/15 transition">
                    <!-- Toolbar Format Teks & Perataan Paragraf -->
                    <div class="flex flex-wrap items-center gap-1 p-2 bg-slate-100/90 border-b border-slate-200 text-slate-700 select-none">
                        <button type="button"
                                onmousedown="event.preventDefault()"
                                onclick="window.formatEditorText('${editorId}', 'bold')"
                                title="Tebal (Bold)"
                                class="w-8 h-8 rounded-lg hover:bg-white hover:text-blue-600 hover:shadow-sm flex items-center justify-center text-xs font-extrabold transition">
                            <i class="fas fa-bold"></i>
                        </button>
                        <button type="button"
                                onmousedown="event.preventDefault()"
                                onclick="window.formatEditorText('${editorId}', 'italic')"
                                title="Miring (Italic)"
                                class="w-8 h-8 rounded-lg hover:bg-white hover:text-blue-600 hover:shadow-sm flex items-center justify-center text-xs transition">
                            <i class="fas fa-italic"></i>
                        </button>
                        <button type="button"
                                onmousedown="event.preventDefault()"
                                onclick="window.formatEditorText('${editorId}', 'underline')"
                                title="Garis Bawah (Underline)"
                                class="w-8 h-8 rounded-lg hover:bg-white hover:text-blue-600 hover:shadow-sm flex items-center justify-center text-xs transition">
                            <i class="fas fa-underline"></i>
                        </button>

                        <span class="w-px h-5 bg-slate-300 mx-1"></span>

                        <button type="button"
                                onmousedown="event.preventDefault()"
                                onclick="window.formatEditorText('${editorId}', 'justifyLeft')"
                                title="Rata Kiri"
                                class="w-8 h-8 rounded-lg hover:bg-white hover:text-blue-600 hover:shadow-sm flex items-center justify-center text-xs transition">
                            <i class="fas fa-align-left"></i>
                        </button>
                        <button type="button"
                                onmousedown="event.preventDefault()"
                                onclick="window.formatEditorText('${editorId}', 'justifyCenter')"
                                title="Rata Tengah"
                                class="w-8 h-8 rounded-lg hover:bg-white hover:text-blue-600 hover:shadow-sm flex items-center justify-center text-xs transition">
                            <i class="fas fa-align-center"></i>
                        </button>
                        <button type="button"
                                onmousedown="event.preventDefault()"
                                onclick="window.formatEditorText('${editorId}', 'justifyRight')"
                                title="Rata Kanan"
                                class="w-8 h-8 rounded-lg hover:bg-white hover:text-blue-600 hover:shadow-sm flex items-center justify-center text-xs transition">
                            <i class="fas fa-align-right"></i>
                        </button>
                        <button type="button"
                                onmousedown="event.preventDefault()"
                                onclick="window.formatEditorText('${editorId}', 'justifyFull')"
                                title="Rata Kanan-Kiri (Justify)"
                                class="w-8 h-8 rounded-lg hover:bg-white hover:text-blue-600 hover:shadow-sm flex items-center justify-center text-xs transition">
                            <i class="fas fa-align-justify"></i>
                        </button>

                        <span class="ml-auto text-[10px] font-bold text-slate-400 pr-2 hidden sm:inline">
                            Format Teks Berita
                        </span>
                    </div>

                    <!-- Area Ketik Berita -->
                    <div id="${editorId}"
                         contenteditable="true"
                         data-placeholder="${placeholder.replace(/"/g, '&quot;')}"
                         class="rich-editor w-full p-4 ${minHeightClass} max-h-[380px] overflow-y-auto text-sm md:text-base leading-relaxed outline-none">${safeInitial}</div>
                </div>
            `;
        };

        window.formatEditorText = (editorId, command) => {
            const editor = document.getElementById(editorId);
            if (!editor) return;
            editor.focus();
            document.execCommand(command, false, null);
        };

        const getRichEditorContent = (editorId) => {
            const editor = document.getElementById(editorId);
            if (!editor) return { html: '', text: '' };
            const html = editor.innerHTML.trim();
            const text = stripHtml(html);
            return { html, text };
        };

        // Fungsi mengambil jumlah pembaca artikel (Hanya ditampilkan untuk Admin & dasar urutan Trending)
        const getArticleViews = (article) => {
            if (!article) return 0;
            const dbViews = Number(article.views) || 0;
            const localBonus = Number(appState.localViewsMap[String(article.id)]) || 0;
            return Math.max(dbViews, localBonus);
        };

        // Fungsi menambah jumlah pembaca saat artikel dibuka
        const recordArticleView = async (articleId) => {
            if (!articleId) return;
            const idStr = String(articleId);
            const target = appState.articles.find(x => String(x.id) === idStr);
            if (!target) return;

            const currentViews = getArticleViews(target);
            const nextViews = currentViews + 1;
            target.views = nextViews;
            appState.localViewsMap[idStr] = nextViews;

            if (!IS_PREVIEW && supabase) {
                try {
                    const { error: rpcError } = await supabase.rpc('increment_article_views', { art_id: articleId });
                    if (rpcError) {
                        await supabase.from('articles').update({ views: nextViews }).eq('id', articleId);
                    }
                } catch (err) {
                    // Tetap lanjut secara mulus walau kolom views di database belum ditambahkan
                }
            }
        };

        // Format Tanggal & Jam Lengkap
        const formatWaktu = (iso) => {
            if (!iso) return '-';
            const d = new Date(iso);
            const tgl = d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
            const jam = d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }).replace('.', ':');
            return `${tgl} • ${jam} WITA`;
        };

        // Ekstrak format YYYY-MM-DD sesuai waktu lokal untuk pencocokan filter kalender
        const getLocalDateString = (iso) => {
            if (!iso) return '';
            const d = new Date(iso);
            if (isNaN(d.getTime())) return '';
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        // Format tampilan tanggal untuk label filter kalender aktif
        const formatLabelTanggal = (ymd, shortMonth = false) => {
            if (!ymd) return '';
            const parts = ymd.split('-');
            if (parts.length !== 3) return ymd;
            const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
            return d.toLocaleDateString('id-ID', {
                day: 'numeric',
                month: shortMonth ? 'short' : 'long',
                year: 'numeric'
            });
        };

        // Ekstrak metadata komentar (mendukung kolom parent_id asli maupun tag fallback [REPLY:id:nama])
        const parseCommentMeta = (c) => {
            let rawContent = c.content || '';
            let parentId = c.parent_id ? String(c.parent_id) : null;
            let replyToName = '';

            const replyMatch = rawContent.match(/^\[REPLY:([^:\]]+):([^\]]*)\]\s*/);
            if (replyMatch) {
                if (!parentId) parentId = String(replyMatch[1]);
                replyToName = replyMatch[2] || '';
                rawContent = rawContent.slice(replyMatch[0].length);
            }
            return {
                ...c,
                cleanContent: rawContent,
                parsedParentId: parentId,
                replyToName
            };
        };

        // Ambil jumlah suka (like) pada komentar
        const getCommentLikes = (c) => {
            if (!c) return 0;
            const idStr = String(c.id);
            const dbLikes = Number(c.likes) || 0;
            if (appState.localCommentLikesMap[idStr] !== undefined) {
                return Math.max(0, Number(appState.localCommentLikesMap[idStr]));
            }
            return Math.max(0, dbLikes);
        };

        // Cek apakah komentar sudah disukai oleh pengguna di perangkat ini
        const isCommentLiked = (commentId) => {
            return appState.likedCommentIds.includes(String(commentId));
        };

        // Ambil daftar semua komentar untuk suatu artikel
        const getArticleComments = (articleId) => {
            return (appState.comments || [])
                .filter(c => String(c.article_id) === String(articleId))
                .map(c => parseCommentMeta(c))
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
        };

        // Render satu item komentar beserta tombol Suka, Balas, Hapus (Admin), dan daftar Balasannya
        const renderSingleCommentItem = (c, allComments, articleId, prefix, isReply = false) => {
            const isAnon = Boolean(c.is_anonymous) || (c.author_name || '').toLowerCase() === 'anonim';
            const displayName = isAnon ? 'Anonim' : (c.author_name || 'Pembaca');
            const safeDisplayName = displayName.replace(/'/g, "\\'").replace(/"/g, '&quot;');
            const likeCount = getCommentLikes(c);
            const liked = isCommentLiked(c.id);

            const replies = allComments
                .filter(r => String(r.parsedParentId) === String(c.id))
                .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

            return `
                <div class="${isReply ? 'p-3.5 rounded-2xl bg-slate-50/90 border border-slate-200/80' : 'p-4 rounded-2xl bg-white border border-slate-100 shadow-sm'} space-y-2.5">
                    <div class="flex items-start justify-between gap-2">
                        <div class="flex items-center gap-2.5">
                            <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold shrink-0 ${isAnon ? 'bg-slate-800 text-white' : 'bg-blue-100 text-blue-700'}">
                                <i class="fas ${isAnon ? 'fa-user-secret' : 'fa-user'}"></i>
                            </div>
                            <div>
                                <div class="flex items-center gap-1.5 flex-wrap">
                                    <span class="text-xs md:text-sm font-extrabold text-slate-900">${displayName}</span>
                                    ${isAnon ? `<span class="text-[10px] font-bold bg-slate-100 text-slate-500 px-2 py-0.5 rounded-full">Anonim</span>` : ''}
                                    ${c.replyToName ? `
                                        <span class="text-[10px] font-bold bg-blue-50 text-blue-600 px-2 py-0.5 rounded-full flex items-center gap-1">
                                            <i class="fas fa-reply text-[9px]"></i> @${c.replyToName}
                                        </span>
                                    ` : ''}
                                </div>
                                <div class="text-[11px] font-semibold text-slate-400 flex items-center gap-1 mt-0.5">
                                    <i class="far fa-calendar-alt text-blue-500"></i> ${formatWaktu(c.created_at)}
                                </div>
                            </div>
                        </div>
                        ${appState.user ? `
                            <button type="button"
                                    onclick="window.deleteComment('${c.id}', '${articleId}')"
                                    title="Hapus Komentar Ini (Admin)"
                                    class="bg-red-50 hover:bg-red-600 text-red-600 hover:text-white border border-red-200 px-3 py-1.5 rounded-xl text-xs font-extrabold flex items-center gap-1.5 transition shrink-0 shadow-sm">
                                <i class="fas fa-trash-alt"></i> Hapus
                            </button>
                        ` : ''}
                    </div>

                    <p class="text-xs md:text-sm text-slate-700 leading-relaxed whitespace-pre-wrap pl-10">${c.cleanContent || ''}</p>

                    <!-- Tombol Aksi: Suka & Balas Komentar -->
                    <div class="pl-10 pt-1 flex items-center gap-3 flex-wrap">
                        <button type="button"
                                onclick="window.toggleLikeComment('${c.id}', '${articleId}')"
                                class="px-3 py-1.5 rounded-xl text-xs font-extrabold border transition flex items-center gap-1.5 ${liked ? 'bg-rose-50 text-rose-600 border-rose-200 shadow-sm' : 'bg-slate-50 hover:bg-rose-50/60 text-slate-600 hover:text-rose-600 border-slate-200'}">
                            <i class="${liked ? 'fas' : 'far'} fa-heart ${liked ? 'text-rose-600' : ''}"></i>
                            <span>Suka</span>
                            ${likeCount > 0 ? `<span class="px-1.5 py-0.2 rounded-full text-[11px] ${liked ? 'bg-rose-100 text-rose-700' : 'bg-slate-200/70 text-slate-700'}">${likeCount}</span>` : ''}
                        </button>

                        <button type="button"
                                onclick="window.toggleReplyBox('${prefix}', '${c.id}')"
                                class="px-3 py-1.5 rounded-xl text-xs font-extrabold bg-slate-50 hover:bg-blue-50 text-slate-600 hover:text-blue-600 border border-slate-200 transition flex items-center gap-1.5">
                            <i class="fas fa-reply text-[11px]"></i>
                            <span>Balas</span>
                        </button>
                    </div>

                    <!-- Form Balasan Inline (Muncul saat tombol Balas diklik) -->
                    <div id="reply-box-${prefix}-${c.id}" class="hidden pl-6 md:pl-10 pt-2">
                        <form onsubmit="window.submitReply(event, '${articleId}', '${c.id}', '${safeDisplayName}', '${prefix}')" class="bg-slate-50 border border-blue-200 rounded-2xl p-3.5 space-y-3 shadow-sm">
                            <div class="flex items-center justify-between">
                                <span class="text-[11px] font-extrabold text-blue-700 flex items-center gap-1.5">
                                    <i class="fas fa-reply"></i> Membalas komentar <strong>@${displayName}</strong>
                                </span>
                                <button type="button" onclick="window.toggleReplyBox('${prefix}', '${c.id}')" class="text-slate-400 hover:text-red-500 text-xs font-bold">
                                    <i class="fas fa-times"></i> Batal
                                </button>
                            </div>

                            <div class="grid grid-cols-2 gap-2">
                                <button type="button"
                                        id="btn-reply-named-${prefix}-${c.id}"
                                        onclick="window.toggleReplyIdentity('${prefix}', '${c.id}', 'named')"
                                        class="py-2 px-2.5 rounded-xl text-[11px] font-extrabold border transition flex items-center justify-center gap-1.5 bg-blue-600 text-white border-blue-600 shadow-sm">
                                    <i class="fas fa-user-pen"></i> Nama Pribadi
                                </button>
                                <button type="button"
                                        id="btn-reply-anon-${prefix}-${c.id}"
                                        onclick="window.toggleReplyIdentity('${prefix}', '${c.id}', 'anon')"
                                        class="py-2 px-2.5 rounded-xl text-[11px] font-extrabold border transition flex items-center justify-center gap-1.5 bg-white text-slate-600 border-slate-200 hover:bg-slate-100">
                                    <i class="fas fa-user-secret"></i> Sebagai Anonim
                                </button>
                            </div>
                            <input type="hidden" id="reply-mode-${prefix}-${c.id}" value="named">

                            <div id="reply-name-box-${prefix}-${c.id}">
                                <input type="text"
                                       id="reply-name-${prefix}-${c.id}"
                                       required
                                       maxlength="50"
                                       placeholder="Masukkan nama Anda..."
                                       class="w-full p-2.5 bg-white border border-slate-200 rounded-xl text-xs font-bold outline-none focus:border-blue-500 transition">
                            </div>

                            <div id="reply-anon-badge-${prefix}-${c.id}" class="hidden p-2.5 bg-slate-200/70 border border-slate-300/80 rounded-xl text-[11px] font-bold text-slate-700 flex items-center gap-2">
                                <i class="fas fa-user-secret text-slate-600"></i>
                                <span>Membalas sebagai <strong>Anonim</strong>.</span>
                            </div>

                            <textarea id="reply-text-${prefix}-${c.id}"
                                      required
                                      rows="2"
                                      maxlength="1000"
                                      placeholder="Tulis balasan Anda untuk @${displayName}..."
                                      class="w-full p-2.5 bg-white border border-slate-200 rounded-xl text-xs font-medium outline-none focus:border-blue-500 transition"></textarea>

                            <div class="flex justify-end gap-2">
                                <button type="submit"
                                        id="btn-submit-reply-${prefix}-${c.id}"
                                        class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-xl text-xs shadow-sm flex items-center gap-1.5 transition">
                                    <i class="fas fa-paper-plane"></i> Kirim Balasan
                                </button>
                            </div>
                        </form>
                    </div>

                    <!-- Daftar Balasan (Nested) -->
                    ${replies.length > 0 ? `
                        <div class="pl-4 md:pl-8 ml-4 md:ml-6 border-l-2 border-blue-100 space-y-2.5 pt-2">
                            ${replies.map(r => renderSingleCommentItem(r, allComments, articleId, prefix, true)).join('')}
                        </div>
                    ` : ''}
                </div>
            `;
        };

        // Render Komponen Komentar (Form Pilihan Anonim/Nama Pribadi + Daftar Komentar Berjenjang)
        const renderCommentsSection = (articleId, prefix = 'pop') => {
            const allList = getArticleComments(articleId);
            const allIds = new Set(allList.map(c => String(c.id)));
            const rootComments = allList.filter(c => !c.parsedParentId || !allIds.has(String(c.parsedParentId)));

            return `
                <div id="comments-wrapper-${prefix}-${articleId}" class="mt-6 pt-6 border-t border-slate-200 space-y-5">
                    <div class="flex items-center justify-between">
                        <h3 class="text-base md:text-lg font-extrabold text-slate-900 flex items-center gap-2">
                            <span class="w-8 h-8 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-sm">
                                <i class="fas fa-comments"></i>
                            </span>
                            Komentar Pembaca
                            <span class="text-xs font-extrabold bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full">${allList.length}</span>
                        </h3>
                    </div>

                    <!-- Form Kirim Komentar Utama -->
                    <form onsubmit="window.submitComment(event, '${articleId}', '${prefix}')" class="bg-slate-50 border border-slate-200 rounded-2xl p-4 space-y-3.5">
                        <div>
                            <label class="block text-[11px] font-extrabold text-slate-500 uppercase tracking-wider mb-2">Pilih Identitas Komentar:</label>
                            <div class="grid grid-cols-2 gap-2">
                                <button type="button"
                                        id="btn-mode-named-${prefix}"
                                        onclick="window.toggleCommentIdentity('${prefix}', 'named')"
                                        class="py-2.5 px-3 rounded-xl text-xs font-extrabold border transition flex items-center justify-center gap-1.5 bg-blue-600 text-white border-blue-600 shadow-sm">
                                    <i class="fas fa-user-pen"></i> Isi Nama Pribadi
                                </button>
                                <button type="button"
                                        id="btn-mode-anon-${prefix}"
                                        onclick="window.toggleCommentIdentity('${prefix}', 'anon')"
                                        class="py-2.5 px-3 rounded-xl text-xs font-extrabold border transition flex items-center justify-center gap-1.5 bg-white text-slate-600 border-slate-200 hover:bg-slate-100">
                                    <i class="fas fa-user-secret"></i> Sebagai Anonim
                                </button>
                            </div>
                            <input type="hidden" id="comment-mode-${prefix}" value="named">
                        </div>

                        <!-- Input Nama Pribadi (Muncul saat opsi Isi Nama Pribadi aktif) -->
                        <div id="comment-name-box-${prefix}">
                            <input type="text"
                                   id="comment-name-${prefix}"
                                   required
                                   maxlength="50"
                                   placeholder="Masukkan nama Anda..."
                                   class="w-full p-3 bg-white border border-slate-200 rounded-xl text-xs md:text-sm font-bold outline-none focus:border-blue-500 transition">
                        </div>

                        <!-- Info Mode Anonim (Muncul saat opsi Anonim dipilih) -->
                        <div id="comment-anon-badge-${prefix}" class="hidden p-3 bg-slate-200/70 border border-slate-300/80 rounded-xl text-xs font-bold text-slate-700 flex items-center gap-2">
                            <i class="fas fa-user-secret text-slate-600 text-sm"></i>
                            <span>Anda akan berkomentar sebagai <strong class="text-slate-900">Anonim</strong> (nama Anda disembunyikan).</span>
                        </div>

                        <!-- Isi Komentar -->
                        <div>
                            <textarea id="comment-text-${prefix}"
                                      required
                                      rows="3"
                                      maxlength="1000"
                                      placeholder="Tulis tanggapan atau komentar Anda di sini..."
                                      class="w-full p-3 bg-white border border-slate-200 rounded-xl text-xs md:text-sm font-medium outline-none focus:border-blue-500 transition"></textarea>
                        </div>

                        <div class="flex justify-end">
                            <button type="submit"
                                    id="btn-submit-comment-${prefix}"
                                    class="bg-slate-900 hover:bg-blue-600 text-white font-bold py-2.5 px-5 rounded-xl text-xs md:text-sm shadow-sm flex items-center gap-2 transition">
                                <i class="fas fa-paper-plane"></i> Kirim Komentar
                            </button>
                        </div>
                    </form>

                    <!-- Daftar Komentar & Balasan -->
                    <div class="space-y-3">
                        ${rootComments.length === 0 ? `
                            <div class="text-center py-6 px-4 bg-white rounded-2xl border border-slate-100 text-slate-400 text-xs font-bold">
                                <i class="far fa-comment-dots text-2xl mb-1.5 block text-slate-300"></i>
                                Belum ada komentar. Jadilah yang pertama memberikan tanggapan!
                            </div>
                        ` : rootComments.map(c => renderSingleCommentItem(c, allList, articleId, prefix, false)).join('')}
                    </div>
                </div>
            `;
        };

        // Fungsi menyegarkan semua tampilan komentar pada artikel terkait
        const refreshCommentViews = (articleId) => {
            if (articleId) {
                const popWrap = document.getElementById(`comments-wrapper-pop-${articleId}`);
                if (popWrap) popWrap.outerHTML = renderCommentsSection(articleId, 'pop');

                const pageWrap = document.getElementById(`comments-wrapper-page-${articleId}`);
                if (pageWrap) pageWrap.outerHTML = renderCommentsSection(articleId, 'page');

                const adminModWrap = document.getElementById(`comments-wrapper-adminmod-${articleId}`);
                if (adminModWrap) adminModWrap.outerHTML = renderCommentsSection(articleId, 'adminmod');
            }

            const mainEl = document.getElementById('main-content');
            if (mainEl && appState.view !== 'article') {
                mainEl.innerHTML = buildMainContent();
            }
        };

        // Fungsi mengekstrak Nama Penulis & Sosial Media (mendukung kolom author_social atau gabungan di author_name)
        const parseAuthorInfo = (article) => {
            let rawName = article.author_name || 'Anonim';
            let social = article.author_social || '';
            if (rawName.includes('|||')) {
                const parts = rawName.split('|||');
                rawName = parts[0].trim();
                social = social || (parts[1] ? parts[1].trim() : '');
            }
            social = social.trim();
            let socialUrl = '';
            let socialLabel = social;
            if (social) {
                if (social.startsWith('http://') || social.startsWith('https://')) {
                    socialUrl = social;
                    try {
                        const u = new URL(social);
                        const path = u.pathname.replace(/^\/+|\/+$/g, '');
                        socialLabel = path ? `${u.hostname.replace('www.', '')}/${path}` : u.hostname.replace('www.', '');
                    } catch (e) {
                        socialLabel = social;
                    }
                } else {
                    const cleanHandle = social.replace(/^@/, '').trim();
                    if (cleanHandle) {
                        socialUrl = `https://instagram.com/${cleanHandle}`;
                        socialLabel = `@${cleanHandle}`;
                    }
                }
            }
            return { name: rawName, social, socialUrl, socialLabel };
        };

        const showToast = (msg, type = 'info') => {
            const cont = document.getElementById('toast-container');
            const el = document.createElement('div');
            el.className = `p-4 rounded-xl shadow-lg text-white font-bold text-sm pointer-events-auto transition-all ${type === 'success' ? 'bg-green-500' : type === 'error' ? 'bg-red-500' : 'bg-blue-600'}`;
            el.innerHTML = msg;
            cont.appendChild(el);
            setTimeout(() => el.remove(), 3500);
        };

        const updateMetaTags = (article) => {
            if (!article) return;
            document.title = `${article.title} - Zeniopost`;
            const ogTitle = document.getElementById('og-title');
            const ogDesc = document.getElementById('og-desc');
            const ogImg = document.getElementById('og-image');
            if (ogTitle) ogTitle.setAttribute('content', article.title);
            if (ogDesc) ogDesc.setAttribute('content', stripHtml(article.content || '').substring(0, 150));
            if (ogImg && article.image_url) ogImg.setAttribute('content', article.image_url);
        };

        // Fungsi aman untuk memperbarui URL browser tanpa memicu SecurityError di lingkungan Preview (blob:)
        const safeUpdateHistory = (articleId = null, title = 'Zeniopost') => {
            try {
                if (window.location.protocol === 'http:' || window.location.protocol === 'https:') {
                    const targetUrl = articleId ? `?article=${articleId}` : window.location.pathname;
                    window.history.replaceState({}, title, targetUrl);
                }
            } catch (e) {
                // Abaikan error history pada mode preview
            }
        };

        // Fungsi aman untuk membuat link bagikan berita (mendukung Pop-up Preview WhatsApp Dinamis)
        const getShareUrl = (articleId) => {
            const origin = (window.location.protocol === 'http:' || window.location.protocol === 'https:')
                ? window.location.origin
                : 'https://zeniopost.vercel.app';

            if (appState.hasDynamicShare) {
                return `${origin}/api/share?id=${articleId}`;
            }
            if (window.location.protocol === 'http:' || window.location.protocol === 'https:') {
                return `${window.location.origin}${window.location.pathname}?article=${articleId}`;
            }
            return `${origin}/?article=${articleId}`;
        };

        window.app = {
            navigate: (view, data = null) => {
                appState.view = view;
                if (view === 'article') {
                    const found = typeof data === 'string' ? appState.articles.find(x => String(x.id) === String(data)) : data;
                    appState.readArticle = found || null;
                    if (found) {
                        updateMetaTags(found);
                        safeUpdateHistory(found.id, found.title);
                    }
                } else if (view === 'topics') {
                    appState.activeTopicId = data;
                    safeUpdateHistory(null, 'Zeniopost');
                } else {
                    appState.readArticle = null;
                    appState.activeTopicId = null;
                    safeUpdateHistory(null, 'Zeniopost');
                }
                renderApp();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            },
            openArticleById: (id) => {
                const found = appState.articles.find(x => String(x.id) === String(id));
                if (found) {
                    window.openArticlePopup(found.id);
                }
            },
            logout: async () => {
                if (!IS_PREVIEW && supabase) await supabase.auth.signOut();
                appState.user = null;
                app.navigate('home');
                showToast("Anda telah keluar", "success");
            }
        };

        window.handleSearch = (val) => {
            appState.searchQuery = val || '';
            if (appState.view !== 'home' && appState.view !== 'trending' && appState.view !== 'topics') {
                appState.view = 'home';
            }
            const clearBtn = document.getElementById('clear-search-btn');
            if (clearBtn) {
                if (appState.searchQuery.trim().length > 0) clearBtn.classList.remove('hidden');
                else clearBtn.classList.add('hidden');
            }
            const mainEl = document.getElementById('main-content');
            if (mainEl) {
                mainEl.innerHTML = buildMainContent();
            } else {
                renderApp();
            }
        };

        window.clearSearch = () => {
            const input = document.getElementById('search-article-input');
            if (input) {
                input.value = '';
                input.focus();
            }
            window.handleSearch('');
        };

        // Fungsi memperbarui tampilan ikon kalender & preview tanggal di Header
        const updateHeaderDateUI = () => {
            const pill = document.getElementById('date-filter-pill');
            const previewText = document.getElementById('date-preview-text');
            const clearDateBtn = document.getElementById('clear-date-btn');
            const dateInputHeader = document.getElementById('filter-date-input');

            if (dateInputHeader && dateInputHeader.value !== appState.filterDate) {
                dateInputHeader.value = appState.filterDate || '';
            }

            if (appState.filterDate) {
                if (pill) {
                    pill.className = 'relative flex items-center bg-blue-50 border border-blue-500 text-blue-700 rounded-full px-3 py-2 transition shadow-sm';
                }
                if (previewText) {
                    previewText.textContent = formatLabelTanggal(appState.filterDate, true);
                    previewText.className = 'ml-1.5 text-[11px] md:text-xs font-extrabold text-slate-800 whitespace-nowrap pointer-events-none';
                }
                if (clearDateBtn) {
                    clearDateBtn.className = 'ml-2 relative z-10 text-slate-400 hover:text-red-500 text-xs flex items-center';
                }
            } else {
                if (pill) {
                    pill.className = 'relative flex items-center justify-center bg-slate-50 hover:bg-blue-50 border border-slate-200 text-slate-600 rounded-full w-9 h-9 md:w-10 md:h-10 transition';
                }
                if (previewText) {
                    previewText.textContent = '';
                    previewText.className = 'hidden';
                }
                if (clearDateBtn) {
                    clearDateBtn.className = 'hidden';
                }
            }
        };

        // Fungsi Filter Kalender Tanggal Berita
        window.handleDateFilter = (val) => {
            appState.filterDate = val || '';
            if (appState.view !== 'home' && appState.view !== 'trending' && appState.view !== 'topics') {
                appState.view = 'home';
            }
            updateHeaderDateUI();
            const mainEl = document.getElementById('main-content');
            if (mainEl) {
                mainEl.innerHTML = buildMainContent();
            } else {
                renderApp();
            }
        };

        window.clearDateFilter = () => {
            const dateInputHeader = document.getElementById('filter-date-input');
            if (dateInputHeader) dateInputHeader.value = '';
            window.handleDateFilter('');
        };

        // Fungsi Mengubah Mode Identitas Komentar (Nama Pribadi vs Anonim)
        window.toggleCommentIdentity = (prefix, mode) => {
            const modeInput = document.getElementById(`comment-mode-${prefix}`);
            const nameBox = document.getElementById(`comment-name-box-${prefix}`);
            const nameInput = document.getElementById(`comment-name-${prefix}`);
            const anonBadge = document.getElementById(`comment-anon-badge-${prefix}`);
            const btnNamed = document.getElementById(`btn-mode-named-${prefix}`);
            const btnAnon = document.getElementById(`btn-mode-anon-${prefix}`);

            if (!modeInput) return;
            modeInput.value = mode;

            if (mode === 'anon') {
                if (nameBox) nameBox.classList.add('hidden');
                if (nameInput) nameInput.required = false;
                if (anonBadge) anonBadge.classList.remove('hidden');
                if (btnAnon) btnAnon.className = 'py-2.5 px-3 rounded-xl text-xs font-extrabold border transition flex items-center justify-center gap-1.5 bg-slate-900 text-white border-slate-900 shadow-sm';
                if (btnNamed) btnNamed.className = 'py-2.5 px-3 rounded-xl text-xs font-extrabold border transition flex items-center justify-center gap-1.5 bg-white text-slate-600 border-slate-200 hover:bg-slate-100';
            } else {
                if (nameBox) nameBox.classList.remove('hidden');
                if (nameInput) {
                    nameInput.required = true;
                    nameInput.focus();
                }
                if (anonBadge) anonBadge.classList.add('hidden');
                if (btnNamed) btnNamed.className = 'py-2.5 px-3 rounded-xl text-xs font-extrabold border transition flex items-center justify-center gap-1.5 bg-blue-600 text-white border-blue-600 shadow-sm';
                if (btnAnon) btnAnon.className = 'py-2.5 px-3 rounded-xl text-xs font-extrabold border transition flex items-center justify-center gap-1.5 bg-white text-slate-600 border-slate-200 hover:bg-slate-100';
            }
        };

        // Fungsi Menyimpan Komentar Baru
        window.submitComment = async (e, articleId, prefix = 'pop') => {
            e.preventDefault();
            const mode = document.getElementById(`comment-mode-${prefix}`)?.value || 'named';
            const rawName = (document.getElementById(`comment-name-${prefix}`)?.value || '').trim();
            const rawText = (document.getElementById(`comment-text-${prefix}`)?.value || '').trim();
            const btn = document.getElementById(`btn-submit-comment-${prefix}`);

            if (!rawText) {
                showToast('Isi komentar tidak boleh kosong.', 'error');
                return;
            }
            if (mode === 'named' && !rawName) {
                showToast('Silakan isi nama Anda atau pilih opsi Sebagai Anonim.', 'error');
                return;
            }

            const isAnon = mode === 'anon';
            const finalAuthor = isAnon ? 'Anonim' : rawName;

            if (btn) {
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Mengirim...';
                btn.disabled = true;
            }

            const newCommentObj = {
                article_id: articleId,
                author_name: finalAuthor,
                is_anonymous: isAnon,
                content: rawText,
                created_at: new Date().toISOString()
            };

            try {
                if (IS_PREVIEW) {
                    const saved = { ...newCommentObj, id: 'c_' + Date.now() };
                    mockComments.unshift(saved);
                    appState.comments.unshift(saved);
                } else if (supabase) {
                    const { data, error } = await supabase.from('comments').insert([newCommentObj]).select();
                    if (error) {
                        const fallbackSaved = { ...newCommentObj, id: 'local_' + Date.now() };
                        appState.comments.unshift(fallbackSaved);
                    } else if (data && data.length > 0) {
                        appState.comments.unshift(data[0]);
                    } else {
                        appState.comments.unshift({ ...newCommentObj, id: 'local_' + Date.now() });
                    }
                }

                showToast('Komentar berhasil dikirim!', 'success');
                refreshCommentViews(articleId);
            } catch (err) {
                showToast(err.message || 'Gagal mengirim komentar.', 'error');
                if (btn) {
                    btn.innerHTML = '<i class="fas fa-paper-plane"></i> Kirim Komentar';
                    btn.disabled = false;
                }
            }
        };

        // Fungsi Buka/Tutup Kotak Balasan Komentar
        window.toggleReplyBox = (prefix, commentId) => {
            const box = document.getElementById(`reply-box-${prefix}-${commentId}`);
            if (!box) return;
            const isHidden = box.classList.contains('hidden');
            if (isHidden) {
                box.classList.remove('hidden');
                const nameInput = document.getElementById(`reply-name-${prefix}-${commentId}`);
                const textInput = document.getElementById(`reply-text-${prefix}-${commentId}`);
                if (nameInput && !nameInput.value) nameInput.focus();
                else if (textInput) textInput.focus();
            } else {
                box.classList.add('hidden');
            }
        };

        // Fungsi Pilih Identitas (Nama Pribadi vs Anonim) pada Form Balasan
        window.toggleReplyIdentity = (prefix, commentId, mode) => {
            const modeInput = document.getElementById(`reply-mode-${prefix}-${commentId}`);
            const nameBox = document.getElementById(`reply-name-box-${prefix}-${commentId}`);
            const nameInput = document.getElementById(`reply-name-${prefix}-${commentId}`);
            const anonBadge = document.getElementById(`reply-anon-badge-${prefix}-${commentId}`);
            const btnNamed = document.getElementById(`btn-reply-named-${prefix}-${commentId}`);
            const btnAnon = document.getElementById(`btn-reply-anon-${prefix}-${commentId}`);

            if (!modeInput) return;
            modeInput.value = mode;

            if (mode === 'anon') {
                if (nameBox) nameBox.classList.add('hidden');
                if (nameInput) nameInput.required = false;
                if (anonBadge) anonBadge.classList.remove('hidden');
                if (btnAnon) btnAnon.className = 'py-2 px-2.5 rounded-xl text-[11px] font-extrabold border transition flex items-center justify-center gap-1.5 bg-slate-900 text-white border-slate-900 shadow-sm';
                if (btnNamed) btnNamed.className = 'py-2 px-2.5 rounded-xl text-[11px] font-extrabold border transition flex items-center justify-center gap-1.5 bg-white text-slate-600 border-slate-200 hover:bg-slate-100';
            } else {
                if (nameBox) nameBox.classList.remove('hidden');
                if (nameInput) {
                    nameInput.required = true;
                    nameInput.focus();
                }
                if (anonBadge) anonBadge.classList.add('hidden');
                if (btnNamed) btnNamed.className = 'py-2 px-2.5 rounded-xl text-[11px] font-extrabold border transition flex items-center justify-center gap-1.5 bg-blue-600 text-white border-blue-600 shadow-sm';
                if (btnAnon) btnAnon.className = 'py-2 px-2.5 rounded-xl text-[11px] font-extrabold border transition flex items-center justify-center gap-1.5 bg-white text-slate-600 border-slate-200 hover:bg-slate-100';
            }
        };

        // Fungsi Kirim Balasan Komentar
        window.submitReply = async (e, articleId, parentCommentId, replyToName, prefix = 'pop') => {
            e.preventDefault();
            const mode = document.getElementById(`reply-mode-${prefix}-${parentCommentId}`)?.value || 'named';
            const rawName = (document.getElementById(`reply-name-${prefix}-${parentCommentId}`)?.value || '').trim();
            const rawText = (document.getElementById(`reply-text-${prefix}-${parentCommentId}`)?.value || '').trim();
            const btn = document.getElementById(`btn-submit-reply-${prefix}-${parentCommentId}`);

            if (!rawText) {
                showToast('Isi balasan tidak boleh kosong.', 'error');
                return;
            }
            if (mode === 'named' && !rawName) {
                showToast('Silakan isi nama Anda atau pilih Sebagai Anonim.', 'error');
                return;
            }

            const isAnon = mode === 'anon';
            const finalAuthor = isAnon ? 'Anonim' : rawName;
            const encodedContent = `[REPLY:${parentCommentId}:${replyToName}] ${rawText}`;

            if (btn) {
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Mengirim...';
                btn.disabled = true;
            }

            const replyPayload = {
                article_id: articleId,
                author_name: finalAuthor,
                is_anonymous: isAnon,
                content: encodedContent,
                created_at: new Date().toISOString()
            };

            try {
                if (IS_PREVIEW) {
                    const saved = { ...replyPayload, id: 'c_' + Date.now(), parent_id: parentCommentId, likes: 0 };
                    mockComments.unshift(saved);
                    appState.comments.unshift(saved);
                } else if (supabase) {
                    const { data, error } = await supabase.from('comments').insert([replyPayload]).select();
                    if (error) {
                        const fallbackSaved = { ...replyPayload, id: 'local_' + Date.now(), parent_id: parentCommentId, likes: 0 };
                        appState.comments.unshift(fallbackSaved);
                    } else if (data && data.length > 0) {
                        appState.comments.unshift(data[0]);
                    } else {
                        appState.comments.unshift({ ...replyPayload, id: 'local_' + Date.now(), parent_id: parentCommentId, likes: 0 });
                    }
                }

                showToast('Balasan berhasil dikirim!', 'success');
                refreshCommentViews(articleId);
            } catch (err) {
                showToast(err.message || 'Gagal mengirim balasan.', 'error');
                if (btn) {
                    btn.innerHTML = '<i class="fas fa-paper-plane"></i> Kirim Balasan';
                    btn.disabled = false;
                }
            }
        };

        // Fungsi Suka (Like / Unlike) Komentar
        window.toggleLikeComment = async (commentId, articleId) => {
            const idStr = String(commentId);
            const target = appState.comments.find(c => String(c.id) === idStr);
            if (!target) return;

            const alreadyLiked = isCommentLiked(idStr);
            const currentLikes = getCommentLikes(target);
            const nextLikes = alreadyLiked ? Math.max(0, currentLikes - 1) : currentLikes + 1;
            const delta = alreadyLiked ? -1 : 1;

            if (alreadyLiked) {
                appState.likedCommentIds = appState.likedCommentIds.filter(id => id !== idStr);
            } else {
                appState.likedCommentIds.push(idStr);
            }

            target.likes = nextLikes;
            appState.localCommentLikesMap[idStr] = nextLikes;

            try {
                localStorage.setItem('zeniopost_liked_comments', JSON.stringify(appState.likedCommentIds));
                localStorage.setItem('zeniopost_comment_likes_map', JSON.stringify(appState.localCommentLikesMap));
            } catch (e) {}

            refreshCommentViews(articleId);

            if (!IS_PREVIEW && supabase && !idStr.startsWith('local_')) {
                try {
                    const { error: rpcErr } = await supabase.rpc('increment_comment_likes', { comm_id: commentId, delta_val: delta });
                    if (rpcErr) {
                        await supabase.from('comments').update({ likes: nextLikes }).eq('id', commentId);
                    }
                } catch (err) {
                    // Tetap tersimpan secara lokal apabila kolom likes belum dijalankan di SQL
                }
            }
        };

        // Fungsi Hapus Komentar & Seluruh Balasannya (Khusus Admin)
        window.deleteComment = async (commentId, articleId = null) => {
            try {
                const targetIdStr = String(commentId);
                const idsToDelete = new Set([targetIdStr]);
                let added = true;
                while (added) {
                    added = false;
                    for (const item of appState.comments) {
                        const parsed = parseCommentMeta(item);
                        const itemIdStr = String(item.id);
                        if (!idsToDelete.has(itemIdStr) && parsed.parsedParentId && idsToDelete.has(String(parsed.parsedParentId))) {
                            idsToDelete.add(itemIdStr);
                            added = true;
                        }
                    }
                }

                if (!IS_PREVIEW && supabase) {
                    const dbIds = Array.from(idsToDelete).filter(id => !id.startsWith('local_'));
                    if (dbIds.length > 0) {
                        const { error } = await supabase.from('comments').delete().in('id', dbIds);
                        if (error) {
                            await supabase.from('comments').delete().eq('id', commentId);
                        }
                    }
                }

                appState.comments = appState.comments.filter(c => !idsToDelete.has(String(c.id)));
                mockComments = mockComments.filter(c => !idsToDelete.has(String(c.id)));

                showToast('Komentar berhasil dihapus oleh Admin!', 'success');
                refreshCommentViews(articleId);
            } catch (err) {
                showToast(err.message || 'Gagal menghapus komentar.', 'error');
            }
        };

        // Fungsi Membuka Pop-up Berita Beserta Gambarnya
        window.openArticlePopup = (articleId) => {
            const a = appState.articles.find(x => String(x.id) === String(articleId));
            if (!a) return;
            appState.readArticle = a;
            appState.countedInOpen = String(a.id);
            recordArticleView(a.id);
            updateMetaTags(a);

            const info = parseAuthorInfo(a);
            const modal = document.getElementById('modal-container');
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            modal.innerHTML = `
                <div class="bg-white w-full max-w-2xl rounded-3xl shadow-2xl overflow-hidden animate-fade my-8 max-h-[90vh] flex flex-col border border-slate-100" onclick="event.stopPropagation()">
                    <!-- Header Pop-up (Dilengkapi Tombol Layar Penuh & Bagikan di Atas) -->
                    <div class="p-3.5 px-5 bg-white border-b border-slate-100 flex justify-between items-center gap-2 sticky top-0 z-20">
                        <div class="flex items-center gap-2 shrink-0">
                            <img src="${LOGO_URL}"
                                 alt="Logo Zeniopost"
                                 onerror="if(!this.dataset.fallback){this.dataset.fallback='1';this.src='${LOGO_FALLBACK_URL}';}"
                                 class="h-7 md:h-8 w-auto object-contain block">
                        </div>
                        <div class="flex items-center gap-1.5 md:gap-2">
                            <button type="button"

                        <!-- Judul Berita -->

                                    </div>
                                    <i class="fas fa-external-link-alt text-[10px] text-slate-400 group-hover:text-blue-600 ml-1"></i>
                                </a>
                            ` : ''}
                        </div>

                        <!-- Isi Lengkap Berita (Mendukung Bold, Italic, Underline & Rata Kiri/Tengah/Kanan) -->

                        <!-- Tombol Opsi Buka Layar Penuh & Bagikan di Bawah Teks Berita -->

                                    onclick="window.closeModal(); app.navigate('article', '${a.id}')"

                                    onclick="window.shareArticle('${a.id}')"

                            </button>
                        </div>

                        <!-- Bagian Komentar di Dalam Pop-up Berita -->

                </div>
            `;
        };

        window.closeModal = () => {
            const modal = document.getElementById('modal-container');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            modal.innerHTML = '';
            if (appState.view !== 'article') {
                safeUpdateHistory(null, 'Zeniopost');
            }
        };

        // Fungsi Salin Teks ke Clipboard (Fallback Universal)
        const copyToClipboard = (text) => {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand('copy');
                showToast('<i class="fas fa-check-circle mr-1"></i> Link berita berhasil disalin! Siap ditempel & dibagikan ke mana saja.', 'success');
            } catch (err) {
                showToast('Gagal menyalin link.', 'error');
            }
            document.body.removeChild(ta);
        };

        // Fungsi Bagikan Berita Universal (Otomatis Salin Link di Laptop/PC & Menu Share di HP)
        window.shareArticle = async (articleId) => {
            const a = appState.articles.find(x => String(x.id) === String(articleId)) || appState.readArticle;
            if (!a) return;

            updateMetaTags(a);
            const shareUrl = getShareUrl(a.id);
            const isMobileDevice = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent || '');

            if (isMobileDevice && navigator.share) {
                try {
                    await navigator.share({
                        title: a.title,
                        url: shareUrl
                    });
                    return;
                } catch (err) {
                    if (err.name === 'AbortError') return;
                }
            }

            copyToClipboard(shareUrl);
        };

        // Fungsi Buka Modal Review, Preview Lengkap & Edit Artikel untuk Admin
        window.openAdminReviewModal = (articleId, initialTab = 'preview') => {
            const a = appState.articles.find(x => String(x.id) === String(articleId));
            if (!a) return;

            const topicObj = appState.topics.find(t => String(t.id) === String(a.topic_id));
            const topicName = topicObj ? topicObj.name : 'Tanpa Kategori';
            const isPending = a.status === 'pending';

            const modal = document.getElementById('modal-container');
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            const safeAuthor = (info.name || '').replace(/"/g, '&quot;');
            const safeSocial = (info.social || '').replace(/"/g, '&quot;');

            modal.innerHTML = `
                <div class="bg-white w-full max-w-3xl rounded-3xl shadow-2xl overflow-hidden animate-fade my-8 max-h-[92vh] flex flex-col border border-slate-100" onclick="event.stopPropagation()">

                        <div class="flex items-center gap-2.5">

                            </span>
                            <div>
                                <h3 class="text-sm md:text-base font-extrabold leading-tight">
                                    ${isPending ? 'Tinjau & Edit Pengajuan Artikel' : 'Kelola & Edit Artikel Tayang'}
                                </h3>
                                <p class="text-[11px] text-slate-400 font-semibold">
                                    Status: ${isPending ? '<span class="text-orange-400 font-bold">Menunggu Persetujuan</span>' : '<span class="text-green-400 font-bold">Sudah Tayang</span>'}
                                </p>
                            </div>
                        </div>

                        <!-- Tab Switcher: Preview vs Edit -->
                        <div class="flex items-center gap-2">
                            <div class="bg-slate-800 p-1 rounded-xl flex items-center gap-1">

                                    <i class="fas fa-eye mr-1"></i> Preview Lengkap
                                </button>

                                    <i class="fas fa-pen-to-square mr-1"></i> Edit Teks & Gambar
                                </button>
                            </div>
                            <button onclick="window.closeModal()" class="w-9 h-9 rounded-full bg-slate-800 hover:bg-red-500 text-slate-300 hover:text-white flex items-center justify-center transition">
                                <i class="fas fa-times text-base"></i>
                            </button>
                        </div>
                    </div>

                    <!-- TAB 1: PREVIEW LENGKAP ARTIKEL -->
                    <div id="admin-tab-preview" class="${initialTab === 'preview' ? 'block' : 'hidden'} overflow-y-auto p-6 space-y-5 flex-1">
                        <!-- Gambar Artikel yang Diajukan -->
                        <div class="relative rounded-2xl overflow-hidden bg-slate-100 border border-slate-200 shadow-sm">
                            <img src="${a.image_url}" alt="${safeTitle}" class="w-full max-h-96 object-cover">
                            <span class="absolute top-3 left-3 bg-slate-900/80 backdrop-blur-md text-white text-xs font-bold px-3.5 py-1.5 rounded-full">
                                Kategori: ${topicName}
                            </span>
                        </div>

                        <!-- Judul Lengkap -->
                        <h1 class="text-2xl md:text-3xl font-extrabold text-slate-900 leading-snug">${a.title}</h1>

                        <!-- Detail Penulis & Pengecekan Sosial Media -->
                        <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200 space-y-3">
                            <div class="flex flex-wrap items-center justify-between gap-3">
                                <div class="flex items-center gap-3">
                                    ${a.is_official ? '' : `
                                        <div class="w-10 h-10 rounded-full flex items-center justify-center text-base font-bold shrink-0 bg-slate-200 text-slate-700">
                                            <i class="fas fa-user"></i>
                                        </div>
                                    `}
                                    <div>
                                        <div class="text-xs font-bold text-slate-400 uppercase tracking-wider">Nama Penulis</div>
                                        <div class="font-extrabold text-sm md:text-base text-slate-900 flex items-center gap-1.5">
                                            ${a.is_official 
                                                ? '<span>Zeniopost</span> <i class="fas fa-check-circle text-blue-600 text-sm"></i>' 
                                                : `<span>${info.name}</span>`}
                                        </div>
                                        <div class="text-xs font-semibold text-slate-500 mt-0.5">
                                            <i class="far fa-clock text-blue-500 mr-1"></i> Diajukan: ${formatWaktu(a.created_at)}
                                        </div>
                                    </div>
                                </div>

                                <!-- Box Inspeksi Sosial Media untuk Admin -->
                                <div class="w-full sm:w-auto">
                                    ${info.socialUrl ? `
                                        <div class="p-3 rounded-xl bg-white border border-blue-200 flex items-center justify-between gap-3 shadow-sm">
                                            <div class="min-w-0">
                                                <div class="text-[10px] font-extrabold text-blue-600 uppercase tracking-wider">Sosial Media Diajukan</div>
                                                <div class="text-xs font-extrabold text-slate-800 truncate max-w-[220px]" title="${safeSocial}">${info.socialLabel}</div>
                                                <div class="text-[10px] text-slate-400 truncate max-w-[220px]">${info.socialUrl}</div>
                                            </div>
                                            <a href="${info.socialUrl}" target="_blank" rel="noopener noreferrer" class="shrink-0 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-3 py-2 rounded-lg flex items-center gap-1.5 transition">
                                                <span>Cek Link</span> <i class="fas fa-external-link-alt text-[10px]"></i>
                                            </a>
                                        </div>

                                        <div class="px-3.5 py-2.5 rounded-xl bg-slate-100 border border-slate-200 text-xs font-bold text-slate-500">
