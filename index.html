            position: relative;
            z-index: 999;

        .rich-editor {
            background-color: #ffffff !important;

            padding: 0.55rem 0.9rem;

            color: #1e3a8a;

        .rich-editor a, .article-rich-content a {
            color: #2563eb;
            text-decoration: underline;
            font-weight: 600;

        .rich-editor ul, .article-rich-content ul {
            list-style-type: disc;
            padding-left: 1.5rem;
            margin: 0.3rem 0;
        }
        .rich-editor ul ul, .article-rich-content ul ul { list-style-type: circle; margin: 0.15rem 0; }
        .rich-editor ul ul ul, .article-rich-content ul ul ul { list-style-type: square; }

        .rich-editor ol, .article-rich-content ol {

            padding-left: 1.5rem;
            margin: 0.3rem 0;
        }
        .rich-editor ol ol, .article-rich-content ol ol {
            list-style-type: lower-alpha;
            margin: 0.15rem 0;
        }
        .rich-editor ol ol ol, .article-rich-content ol ol ol {
            list-style-type: lower-roman;

        .rich-editor {

        }

<body class="bg-[#f4f7fb] text-slate-800 antialiased min-h-screen flex flex-col">

    <div id="zeniopost-app-shell" class="flex flex-col min-h-screen w-full relative">
        <!-- Container Utama Render JS -->
        <div id="app" class="flex flex-col min-h-screen w-full relative">
                
                <style>
                    .zp-dynamic-logo { height: 52px; max-width: 175px; }

                    @media (min-width: 768px) { .zp-dynamic-logo { height: 66px; max-width: 280px; } }
                </style>
                <header class="bg-white/95 backdrop-blur-md sticky top-0 z-50 w-full max-w-full min-w-0 min-h-[76px] sm:min-h-[88px] md:min-h-[98px] py-2 shadow-sm flex justify-between items-center gap-2 sm:gap-3 md:gap-6 px-3 sm:px-5 md:px-8 border-b border-slate-100">
                    <!-- Logo Utama Proporsional Tanpa Shape -->
                    <div class="flex items-center justify-start cursor-pointer shrink-0 py-1" onclick="app.navigate('home')" title="Beranda Zeniopost">
                        <img src="https://zwezerwhvqsauohbfxkq.supabase.co/storage/v1/object/public/news-images/logo_1791964403523_5ohj2ll5.jpeg" alt="Logo Zeniopost" fetchpriority="high" decoding="async" onerror="this.src='https://wsrv.nl/?url=https%3A%2F%2Fzwezerwhvqsauohbfxkq.supabase.co%2Fstorage%2Fv1%2Fobject%2Fpublic%2Fnews-images%2Flogo_1791964403523_5ohj2ll5.jpeg&amp;output=jpg'" class="zp-dynamic-logo w-auto object-contain block">
                    </div>

                    <!-- Pencarian Judul & Kalender Tanggal (Fleksibel dengan min-w-0 agar tidak mendorong lebar layar) -->
                    <div class="flex-1 min-w-0 max-w-xl mx-auto flex items-center gap-1.5 md:gap-2">
                        <div class="flex-1 min-w-0 relative">
                            <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs pointer-events-none"></i>
                            <input type="text" id="search-article-input" value="" oninput="window.handleSearch(this.value)" placeholder="Cari berita..." class="w-full min-w-0 pl-8 pr-6 py-2 text-xs md:text-sm font-semibold bg-slate-50 border border-slate-200/80 rounded-full outline-none focus:border-blue-500">
                            
                        </div>

                        <!-- Filter Kalender -->
                        <div class="relative flex items-center shrink-0">
                            <div class="relative flex items-center justify-center bg-slate-50 hover:bg-blue-50 border border-slate-200/80 text-slate-600 rounded-full w-9 h-9 sm:w-10 sm:h-10">
                                <i class="far fa-calendar-alt text-blue-600 text-xs sm:text-sm pointer-events-none"></i>
                                
                                <input type="date" value="" onclick="try{if(this.showPicker)this.showPicker();}catch(e){}" onchange="window.handleDateFilter(this.value)" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-0">
                                
                            </div>
                        </div>
                    </div>

                    <!-- Aksi Kanan: Chat Admin, Akun Pengguna & Panel Admin -->
                    <div class="flex items-center gap-1 sm:gap-2 shrink-0">
                        <button onclick="app.navigate('chat')" title="Chat dengan Admin" class="relative w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-slate-50 border border-slate-200/80 flex items-center justify-center text-slate-700 hover:text-blue-600 hover:bg-blue-50 transition">
                            <i class="fas fa-headset text-xs sm:text-sm"></i>
                            
                        </button>

                        <button onclick="app.navigate('account')" title="Dashboard Akun Zeniopost" class="flex items-center justify-center gap-2 px-2 sm:px-3.5 h-9 sm:h-10 rounded-full bg-slate-50 hover:bg-blue-50 border border-slate-200/80 text-slate-700 font-extrabold text-xs transition">
                            
                                <i class="fas fa-user-circle text-blue-600 text-sm sm:text-base"></i>
                            
                            <span class="hidden md:inline truncate max-w-[95px]">Akun</span>
                        </button>

                        <button onclick="app.navigate('admin')" title="Dashboard Admin" class="relative w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-slate-900 text-white flex items-center justify-center hover:bg-blue-600 transition shadow-sm">
                            <i class="fas fa-lock text-xs"></i>
                            
                        </button>
                    </div>
                </header>
            
                <div class="flex w-full max-w-full overflow-x-hidden min-h-[calc(100vh-80px)] md:min-h-[calc(100vh-96px)]">
                    
                <!-- Sidebar Kiri Desktop -->
                <nav class="hidden md:flex flex-col w-64 fixed left-0 top-24 h-[calc(100vh-96px)] bg-white border-r border-slate-100 p-5 gap-1.5 z-30 overflow-y-auto">
                    <p class="text-[11px] font-extrabold text-slate-400 mb-1 px-2 uppercase tracking-wider">Menu Utama</p>
                    <button onclick="app.navigate('home')" class="flex items-center gap-3.5 p-3.5 rounded-2xl transition font-bold text-sm text-slate-700 hover:bg-slate-50"><i class="fas fa-home w-5"></i> Beranda</button>
                    <button onclick="app.navigate('trending')" class="flex items-center justify-between p-3.5 rounded-2xl transition font-bold text-sm text-slate-700 hover:bg-slate-50">
                        <span class="flex items-center gap-3.5"><i class="fas fa-fire w-5 text-blue-600"></i> Terpopuler</span>
                        <span class="text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-blue-50 text-blue-600">TOP 3</span>
                    </button>
                    <button onclick="app.navigate('topics')" class="flex items-center gap-3.5 p-3.5 rounded-2xl transition font-bold text-sm text-slate-700 hover:bg-slate-50"><i class="fas fa-layer-group w-5"></i> Kategori Topik</button>
                    <button onclick="app.navigate('saved')" class="flex items-center justify-between p-3.5 rounded-2xl transition font-bold text-sm text-slate-700 hover:bg-slate-50">
                        <span class="flex items-center gap-3.5"><i class="fas fa-bookmark w-5 text-slate-700"></i> Berita Tersimpan</span>
                        
                    </button>

                    <p class="text-[11px] font-extrabold text-slate-400 mt-4 mb-1 px-2 uppercase tracking-wider">Ruang Penulis &amp; Layanan</p>
                    
                        <button onclick="app.navigate('submit')" class="flex items-center gap-3.5 p-3.5 rounded-2xl transition font-bold text-sm bg-blue-600 text-white shadow-sm"><i class="fas fa-pen-nib w-5 text-white"></i> Ajukan Artikel</button>
                    
                    <button onclick="app.navigate('chat')" class="flex items-center justify-between p-3.5 rounded-2xl transition font-bold text-sm text-slate-700 hover:bg-slate-50">
                        <span class="flex items-center gap-3.5"><i class="fas fa-comments w-5 text-slate-700"></i> Pesan Admin</span>
                        
                    </button>
                    <button onclick="app.navigate('account'); if(appState.userDashTab==='publish') window.switchUserDashTab('overview')" class="flex items-center gap-3.5 p-3.5 rounded-2xl transition font-bold text-sm text-slate-700 hover:bg-slate-50"><i class="fas fa-user-circle w-5"></i> Akun Zeniopost</button>
                </nav>

                <!-- Bottom Navigation Bar Mobile -->
                <nav class="md:hidden fixed bottom-0 left-0 right-0 w-full max-w-full bg-white/95 backdrop-blur-md border-t border-slate-200/80 flex justify-around items-center h-[68px] z-50 pb-safe shadow-[0_-8px_20px_rgba(15,23,42,0.06)] rounded-t-3xl px-1">
                    <button onclick="app.navigate('home')" class="flex flex-col items-center justify-center w-full space-y-1 text-slate-400"><i class="fas fa-home text-base"></i><span class="text-[10px] font-bold">Beranda</span></button>
                    <button onclick="app.navigate('trending')" class="flex flex-col items-center justify-center w-full space-y-1 text-slate-400"><i class="fas fa-fire text-base"></i><span class="text-[10px] font-bold">Terpopuler</span></button>
                    
                        <button onclick="app.navigate('submit')" class="flex flex-col items-center justify-center w-full space-y-1 text-blue-600"><i class="fas fa-pen-nib text-base"></i><span class="text-[10px] font-bold">Ajukan</span></button>
                    
                    <button onclick="app.navigate('saved')" class="relative flex flex-col items-center justify-center w-full space-y-1 text-slate-400">
                        <i class="fas fa-bookmark text-base"></i><span class="text-[10px] font-bold">Simpan</span>
                        
                    </button>
                    <button onclick="app.navigate('account'); if(appState.userDashTab==='publish') window.switchUserDashTab('overview')" class="flex flex-col items-center justify-center w-full space-y-1 text-slate-400"><i class="fas fa-user-circle text-base"></i><span class="text-[10px] font-bold">Akun</span></button>

                    <main id="main-content" class="flex-1 min-w-0 w-full max-w-full overflow-x-hidden md:ml-64 pb-24 md:pb-12 relative">

                                <span class="text-xs font-bold bg-slate-100 text-slate-700 px-3 py-1 rounded-full">Menunggu Persetujuan Admin</span>

        const getLocalDateString = (iso) => {
            if (!iso) return '';

            if (isNaN(d.getTime())) return '';
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;

        const sanitizeAndFormatArticleHtml = (rawContent) => {
            if (!rawContent) return '';

            if (!hasHtmlTag) {
                const escaped = str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                return `<div class="whitespace-pre-wrap">${escaped}</div>`;
            }
            const temp = document.createElement('div');
            temp.innerHTML = str;
            temp.querySelectorAll('script, iframe, object, embed, style, link, meta').forEach(el => el.remove());

                Array.from(el.attributes).forEach(attr => {

                    }

                if (el.tagName === 'A') {
                    el.setAttribute('target', '_blank');

        const validateProfileImageDimensions = (file) => {
            return new Promise((resolve, reject) => {

                if (!file.type.startsWith('image/')) return reject(new Error('File harus berupa gambar (JPG/PNG/WebP).'));
                const maxBytes = 1024 * 1024; // 1 MB
                if (file.size > maxBytes) {
                    const sizeInMb = (file.size / (1024 * 1024)).toFixed(2);
                    return reject(new Error(`Ukuran foto profil Anda (${sizeInMb} MB) melebihi batas maksimal 1 MB!`));
                }
                const img = new Image();
                const objectUrl = URL.createObjectURL(file);
                img.onload = () => {
                    URL.revokeObjectURL(objectUrl);
                    resolve({ width: img.width, height: img.height, size: file.size });
                };
                img.onerror = () => {
                    URL.revokeObjectURL(objectUrl);
                    reject(new Error('Gagal membaca file gambar.'));
                };
                img.src = objectUrl;

                        <button type="button" onmousedown="event.preventDefault()" onclick="window.formatEditorText('${editorId}', 'italic')" title="Miring" class="w-8 h-8 rounded-lg hover:bg-white hover:text-blue-600 hover:shadow-sm flex items-center justify-center text-xs transition"><i class="fas fa-italic"></i></button>
                        <button type="button" onmousedown="event.preventDefault()" onclick="window.formatEditorText('${editorId}', 'underline')" title="Garis Bawah" class="w-8 h-8 rounded-lg hover:bg-white hover:text-blue-600 hover:shadow-sm flex items-center justify-center text-xs transition"><i class="fas fa-underline"></i></button>

                        <span class="w-px h-5 bg-slate-300 mx-0.5"></span>

                        <button type="button" onmousedown="event.preventDefault()" onclick="window.formatEditorHeading('${editorId}', 'H2')" title="Subjudul Besar" class="px-2 h-8 rounded-lg hover:bg-white hover:text-blue-600 hover:shadow-sm flex items-center justify-center text-[11px] font-extrabold transition">H2</button>
                        <button type="button" onmousedown="event.preventDefault()" onclick="window.formatEditorHeading('${editorId}', 'H3')" title="Subjudul Kecil" class="px-2 h-8 rounded-lg hover:bg-white hover:text-blue-600 hover:shadow-sm flex items-center justify-center text-[11px] font-extrabold transition">H3</button>
                        <button type="button" onmousedown="event.preventDefault()" onclick="window.formatEditorHeading('${editorId}', 'P')" title="Paragraf Normal" class="px-2 h-8 rounded-lg hover:bg-white hover:text-blue-600 hover:shadow-sm flex items-center justify-center text-[11px] font-bold transition">Teks</button>

                        <span class="w-px h-5 bg-slate-300 mx-0.5"></span>

                        <button type="button" onmousedown="event.preventDefault()" onclick="window.formatEditorText('${editorId}', 'justifyLeft')" title="Rata Kiri" class="w-8 h-8 rounded-lg hover:bg-white hover:text-blue-600 hover:shadow-sm flex items-center justify-center text-xs transition"><i class="fas fa-align-left"></i></button>
                        <button type="button" onmousedown="event.preventDefault()" onclick="window.formatEditorText('${editorId}', 'justifyCenter')" title="Rata Tengah" class="w-8 h-8 rounded-lg hover:bg-white hover:text-blue-600 hover:shadow-sm flex items-center justify-center text-xs transition"><i class="fas fa-align-center"></i></button>
                        <button type="button" onmousedown="event.preventDefault()" onclick="window.formatEditorText('${editorId}', 'justifyRight')" title="Rata Kanan" class="w-8 h-8 rounded-lg hover:bg-white hover:text-blue-600 hover:shadow-sm flex items-center justify-center text-xs transition"><i class="fas fa-align-right"></i></button>
                        <button type="button" onmousedown="event.preventDefault()" onclick="window.formatEditorText('${editorId}', 'justifyFull')" title="Rata Kanan-Kiri" class="w-8 h-8 rounded-lg hover:bg-white hover:text-blue-600 hover:shadow-sm flex items-center justify-center text-xs transition"><i class="fas fa-align-justify"></i></button>

                        <span class="w-px h-5 bg-slate-300 mx-0.5"></span>

                        <button type="button" onmousedown="event.preventDefault()" onclick="window.formatEditorText('${editorId}', 'insertOrderedList')" title="Daftar Bernomor" class="w-8 h-8 rounded-lg hover:bg-white hover:text-blue-600 hover:shadow-sm flex items-center justify-center text-xs transition"><i class="fas fa-list-ol"></i></button>
                        <button type="button" onmousedown="event.preventDefault()" onclick="window.formatEditorText('${editorId}', 'insertUnorderedList')" title="Daftar Poin" class="w-8 h-8 rounded-lg hover:bg-white hover:text-blue-600 hover:shadow-sm flex items-center justify-center text-xs transition"><i class="fas fa-list-ul"></i></button>
                        <button type="button" onmousedown="event.preventDefault()" onclick="window.formatEditorText('${editorId}', 'indent')" title="Tingkat Masuk (Sub-Daftar)" class="w-8 h-8 rounded-lg hover:bg-white hover:text-blue-600 hover:shadow-sm flex items-center justify-center text-xs transition"><i class="fas fa-indent"></i></button>
                        <button type="button" onmousedown="event.preventDefault()" onclick="window.formatEditorText('${editorId}', 'outdent')" title="Tingkat Keluar" class="w-8 h-8 rounded-lg hover:bg-white hover:text-blue-600 hover:shadow-sm flex items-center justify-center text-xs transition"><i class="fas fa-outdent"></i></button>

                        <span class="w-px h-5 bg-slate-300 mx-0.5"></span>

                        <button type="button" onmousedown="event.preventDefault()" onclick="window.formatEditorHeading('${editorId}', 'BLOCKQUOTE')" title="Kutipan" class="w-8 h-8 rounded-lg hover:bg-white hover:text-blue-600 hover:shadow-sm flex items-center justify-center text-xs transition"><i class="fas fa-quote-right"></i></button>
                        <button type="button" onmousedown="event.preventDefault()" onclick="window.insertEditorLink('${editorId}')" title="Sisipkan Tautan" class="w-8 h-8 rounded-lg hover:bg-white hover:text-blue-600 hover:shadow-sm flex items-center justify-center text-xs transition"><i class="fas fa-link"></i></button>

                        <span class="w-px h-5 bg-slate-300 mx-0.5"></span>

                        <!-- Pengatur Spasi Baris & Paragraf -->
                        <div class="flex items-center gap-1 bg-white px-2 h-8 rounded-lg border border-slate-200/80" title="Atur Jarak Spasi Paragraf & Baris">
                            <i class="fas fa-arrows-up-down text-[10px] text-blue-600"></i>
                            <select onchange="window.changeEditorLineSpacing('${editorId}', this.value)" class="bg-transparent text-[11px] font-extrabold text-slate-700 outline-none cursor-pointer">
                                <option value="1.25|0.25em">Spasi: Rapat</option>
                                <option value="1.35|0.42em" selected>Spasi: Proporsional</option>
                                <option value="1.5|0.65em">Spasi: Sedang</option>
                                <option value="1.7|0.9em">Spasi: Renggang</option>
                            </select>
                        </div>
                    </div>

                    <div id="${editorId}"
                         contenteditable="true"
                         style="line-height: 1.35; --para-gap: 0.42em;"
                         oninput="window.syncEditorParagraphSpacers('${editorId}')"
                         onkeydown="window.handleEditorKeydown(event, '${editorId}')"
                         data-placeholder="${placeholder.replace(/"/g, '&quot;')}"
                         class="rich-editor w-full p-3.5 ${minHeightClass} max-h-[400px] overflow-y-auto text-sm md:text-base outline-none">${safeInitial}</div>
                </div>
            `;
        };

        window.syncEditorParagraphSpacers = (editorId) => {
            const editor = document.getElementById(editorId);
            if (!editor) return;
            editor.querySelectorAll('div, p').forEach(el => {
                if (el.innerHTML.trim().toLowerCase() === '<br>') {
                    el.classList.add('zp-para-spacer');
                } else {
                    el.classList.remove('zp-para-spacer');
                }
            });
        };

        window.changeEditorLineSpacing = (editorId, spacingVal) => {
            const editor = document.getElementById(editorId);
            if (!editor) return;
            const [lh, pGap] = String(spacingVal).includes('|') ? spacingVal.split('|') : [spacingVal, '0.42em'];
            editor.style.lineHeight = lh;
            editor.style.setProperty('--para-gap', pGap);
            editor.dataset.lineSpacing = lh;
            editor.dataset.paraGap = pGap;
            editor.focus();
        };

        window.formatEditorText = (editorId, command, value = null) => {
            const editor = document.getElementById(editorId);
            if (!editor) return;
            editor.focus();
            document.execCommand(command, false, value);
        };

        window.formatEditorHeading = (editorId, tag) => {
            const editor = document.getElementById(editorId);
            if (!editor) return;
            editor.focus();
            document.execCommand('formatBlock', false, `<${tag}>`);
        };

        window.insertEditorLink = (editorId) => {
            const editor = document.getElementById(editorId);
            if (!editor) return;
            const url = prompt('Masukkan URL tautan (contoh: https://zeniopost.com):', 'https://');
            if (url && url.trim() && url.trim() !== 'https://') {
                editor.focus();
                document.execCommand('createLink', false, url.trim());
            }
        };

        window.handleEditorKeydown = (e, editorId) => {
            if (e.key === 'Tab') {
                e.preventDefault();
                if (e.shiftKey) {
                    document.execCommand('outdent', false, null);
                } else {
                    document.execCommand('indent', false, null);
                }
            }
        };

        const getRichEditorContent = (editorId) => {
            const editor = document.getElementById(editorId);
            if (!editor) return { html: '', text: '' };
            window.syncEditorParagraphSpacers(editorId);
            let html = editor.innerHTML.trim();
            const text = stripHtml(html);
            const spacing = editor.style.lineHeight || editor.dataset.lineSpacing || '1.35';
            const paraGap = editor.dataset.paraGap || '0.42em';
            if (html) {
                html = `<div style="line-height:${spacing}; --para-gap:${paraGap};">${html}</div>`;
            }
            return { html, text };
        };

        // =====================================================================
        // 7. FETCH DATA DARI SERVER & SINKRONISASI STATE
        // =====================================================================
        const fetchData = async () => {
            if (IS_PREVIEW) {
                appState.topics = [...mockTopics];
                appState.articles = [...mockArticles];
                appState.comments = [...mockComments];
                appState.zpUsers = [...mockUsers];
                appState.passwordResets = [...mockPasswordResets];
                appState.messages = [...mockMessages];
                if (!appState.currentUser) {
                    appState.savedArticles = [];
                }
                return;
            }

            try {
                // 1. Kategori Topik
                const { data: tData } = await dbClient.from('topics').select('*').order('created_at');
                appState.topics = tData || [];

                // 2. Artikel
                const { data: aData } = await dbClient.from('articles').select('*').order('created_at', { ascending: false });
                appState.articles = aData || [];

                // 3. Komentar Pembaca
                const { data: cData } = await dbClient.from('comments').select('*').order('created_at', { ascending: false });
                appState.comments = cData || [];

                // 4. Akun Pengguna Zeniopost (@zeniopost.com)
                const { data: uData } = await dbClient.from('zp_users').select('*').order('created_at', { ascending: false });
                if (uData) {
                    appState.zpUsers = uData;
                    if (appState.currentUser) {
                        const refreshed = uData.find(u => String(u.id) === String(appState.currentUser.id));
                        if (refreshed) {
                            appState.currentUser = refreshed;
                            localStorage.setItem('zeniopost_current_user', JSON.stringify(refreshed));
                        }
                    }
                }

                // 5. Permintaan Pemulihan Kata Sandi
                const { data: prData } = await dbClient.from('zp_password_resets').select('*').order('created_at', { ascending: false });
                if (prData) appState.passwordResets = prData;

                // 6. Berita Tersimpan (Hanya aktif bagi pengguna yang login)
                if (appState.currentUser) {
                    const userSavedKey = `zeniopost_saved_${appState.currentUser.id}`;
                    const localUserSaved = JSON.parse(localStorage.getItem(userSavedKey) || '[]');
                    const { data: sData } = await dbClient.from('zp_saved_articles').select('article_id').eq('user_id', appState.currentUser.id);
                    if (sData) {
                        const dbSavedIds = sData.map(x => String(x.article_id));
                        const merged = Array.from(new Set([...localUserSaved.map(String), ...dbSavedIds]));
                        appState.savedArticles = merged;
                        localStorage.setItem(userSavedKey, JSON.stringify(merged));
                    } else {
                        appState.savedArticles = localUserSaved;
                    }
                } else {
                    appState.savedArticles = [];
                }

                // 7. Riwayat Percakapan Chat dengan Admin
                const { data: mData } = await dbClient.from('zp_messages').select('*').order('created_at', { ascending: true });
                if (mData) appState.messages = mData;

                // 8. Sinkronisasi Pengaturan Logo Website dari Kategori Khusus / Pengaturan jika tersedia
                const { data: sLogo } = await dbClient.from('zp_site_settings').select('*').eq('setting_key', 'site_logo').maybeSingle();
                if (sLogo && sLogo.setting_value) {
                    try {
                        const parsed = JSON.parse(sLogo.setting_value);
                        if (parsed.logoUrl && !OLD_DEFAULT_LOGOS.includes(parsed.logoUrl)) {
                            appState.logoUrl = parsed.logoUrl;
                            localStorage.setItem('zeniopost_custom_logo_url', parsed.logoUrl);
                        }
                        if (parsed.logoHeightMobile) {
                            appState.logoHeightMobile = Math.max(48, Number(parsed.logoHeightMobile));
                            localStorage.setItem('zeniopost_logo_h_mobile', String(appState.logoHeightMobile));
                        }
                        if (parsed.logoHeightDesktop) {
                            appState.logoHeightDesktop = Math.max(62, Number(parsed.logoHeightDesktop));
                            localStorage.setItem('zeniopost_logo_h_desktop', String(appState.logoHeightDesktop));
                        }
                        const fav = document.getElementById('site-favicon');
                        if (fav && appState.logoUrl) fav.href = appState.logoUrl;
                    } catch (e) {}
                }
            } catch (err) {
                console.warn('Sinkronisasi sebagian tabel belum siap:', err);
            }
        };

        // =====================================================================
        // 8. LOGIKA PEMBACAAN, TRENDING TOP 3, SIMPAN BERITA (KHUSUS AKUN) & REKOMENDASI
        // =====================================================================
        const getArticleViews = (article) => {
            if (!article) return 0;
            const dbViews = Number(article.views) || 0;
            const localBonus = Number(appState.localViewsMap[String(article.id)]) || 0;
            return Math.max(dbViews, localBonus);
        };

        const recordArticleView = async (articleId) => {
            if (!articleId) return;
            const idStr = String(articleId);
            const target = appState.articles.find(x => String(x.id) === idStr);
            if (!target) return;

            const nextViews = getArticleViews(target) + 1;
            target.views = nextViews;
            appState.localViewsMap[idStr] = nextViews;

            if (!IS_PREVIEW && dbClient) {
                try {
                    const { error: rpcError } = await dbClient.rpc('increment_article_views', { art_id: articleId });
                    if (rpcError) {
                        await dbClient.from('articles').update({ views: nextViews }).eq('id', articleId);
                    }
                } catch (e) {}
            }
        };

        // Trending Top 3 - Hanya menampilkan 3 berita terpopuler berdasarkan data pembacaan aktual
        const getTrendingTop3 = () => {
            const approved = appState.articles.filter(a => a.status === 'approved');
            return [...approved]
                .sort((a, b) => {
                    const diff = getArticleViews(b) - getArticleViews(a);
                    if (diff !== 0) return diff;
                    return new Date(b.created_at) - new Date(a.created_at);
                })
                .slice(0, 3);
        };

        // Simpan Berita: Khusus untuk pengguna yang memiliki akun & sedang login
        const isArticleSaved = (articleId) => {
            if (!appState.currentUser) return false;
            return appState.savedArticles.map(String).includes(String(articleId));
        };

        window.toggleSaveArticle = async (articleId, e = null) => {
            if (e) e.stopPropagation();

            // Jika tamu (belum login), fitur simpan terkunci & diarahkan ke halaman login
            if (!appState.currentUser) {
                showToast('<i class="fas fa-lock mr-1.5"></i> Fitur Simpan Berita terkunci untuk Tamu. Silakan masuk ke akun Zeniopost Anda terlebih dahulu!', 'error');
                window.closeModal();
                appState.accountTab = 'login';
                app.navigate('account');
                return false;
            }

            const idStr = String(articleId);
            const alreadySaved = isArticleSaved(idStr);
            const userSavedKey = `zeniopost_saved_${appState.currentUser.id}`;

            if (alreadySaved) {
                appState.savedArticles = appState.savedArticles.filter(id => String(id) !== idStr);
                showToast('<i class="fas fa-bookmark mr-1"></i> Artikel dihapus dari daftar tersimpan.', 'info');
                if (!IS_PREVIEW && dbClient) {
                    try {
                        await dbClient.from('zp_saved_articles').delete().eq('user_id', appState.currentUser.id).eq('article_id', articleId);
                    } catch (err) {}
                }
            } else {
                appState.savedArticles.push(idStr);
                showToast('<i class="fas fa-bookmark mr-1"></i> Artikel berhasil disimpan ke akun Anda!', 'success');
                if (!IS_PREVIEW && dbClient) {
                    try {
                        await dbClient.from('zp_saved_articles').insert([{ user_id: appState.currentUser.id, article_id: articleId }]);
                    } catch (err) {}
                }
            }

            localStorage.setItem(userSavedKey, JSON.stringify(appState.savedArticles));
            renderApp();
            return true;
        };

        // Rekomendasi Berita di Bagian Paling Bawah Artikel
        const getRecommendedArticles = (currentArticle, limit = 3) => {
            if (!currentArticle) return [];
            const candidates = appState.articles.filter(a => a.status === 'approved' && String(a.id) !== String(currentArticle.id));
            if (candidates.length === 0) return [];

            const currentWords = new Set(
                `${currentArticle.title || ''} ${stripHtml(currentArticle.content || '')}`
                    .toLowerCase()
                    .split(/[^a-z0-9]+/)
                    .filter(w => w.length > 3)
            );

            const scored = candidates.map(item => {
                let score = 0;
                if (String(item.topic_id) === String(currentArticle.topic_id)) score += 50;
                const itemWords = `${item.title || ''} ${stripHtml(item.content || '')}`
                    .toLowerCase()
                    .split(/[^a-z0-9]+/)
                    .filter(w => w.length > 3);
                itemWords.forEach(w => {
                    if (currentWords.has(w)) score += 2;
                });
                return { item, score };
            });

            scored.sort((a, b) => {
                if (b.score !== a.score) return b.score - a.score;
                return getArticleViews(b.item) - getArticleViews(a.item);
            });

            return scored.slice(0, limit).map(s => s.item);
        };

        const renderRecommendationsBlock = (article, isInsideModal = false) => {
            const recs = getRecommendedArticles(article, 3);
            if (recs.length === 0) return '';

            return `
                <div class="mt-8 pt-6 border-t border-slate-200">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-base md:text-lg font-extrabold text-slate-900 flex items-center gap-2">
                            <span class="w-8 h-8 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-sm">
                                <i class="fas fa-compass"></i>
                            </span>
                            Rekomendasi Berita Terkait
                        </h3>
                        <span class="text-[11px] font-bold text-slate-400">Berdasarkan topik & isi serupa</span>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        ${recs.map(r => {
                            const tObj = appState.topics.find(t => String(t.id) === String(r.topic_id));
                            const tName = tObj ? tObj.name : 'Berita';
                            const rViews = getArticleViews(r);
                            const clickAction = isInsideModal
                                ? `window.openArticlePopup('${r.id}')`
                                : `app.navigate('article', '${r.id}')`;
                            return `
                                <div onclick="${clickAction}" class="group cursor-pointer bg-slate-50 hover:bg-white rounded-2xl overflow-hidden border border-slate-200/80 hover:border-blue-300 transition shadow-sm flex flex-col justify-between">
                                    <div>
                                        <div class="w-full aspect-video bg-slate-200 overflow-hidden relative">
                                            <img src="${r.image_url}" alt="${r.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                                            <span class="absolute top-2 left-2 bg-slate-900/75 text-white text-[10px] font-bold px-2.5 py-0.5 rounded-full">${tName}</span>
                                        </div>
                                        <div class="p-3">
                                            <h4 class="font-extrabold text-xs md:text-sm text-slate-900 group-hover:text-blue-600 line-clamp-2 leading-snug">${r.title}</h4>
                                        </div>
                                    </div>
                                    <div class="px-3 pb-3 pt-1 text-[10px] font-semibold text-slate-400 flex items-center justify-between">
                                        <span><i class="far fa-eye text-blue-500 mr-1"></i>${rViews}x dibaca</span>
                                        <span class="text-blue-600 font-extrabold">Baca <i class="fas fa-arrow-right ml-0.5"></i></span>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        };

        // =====================================================================
        // 9. SISTEM AKUN PENGGUNA (@zeniopost.com), FOTO PROFIL & PEMULIHAN SANDI
        // =====================================================================
        const parseResetRequestData = (r) => {
            let rawReason = r?.reason || '';
            let activeGmail = r?.active_email || '';
            let phoneNum = r?.phone_number || '';
            let reqPass = r?.requested_password || '';

            const gmailMatch = rawReason.match(/\[GMAIL:([^\]]*)\]/);
            if (gmailMatch) {
                if (!activeGmail) activeGmail = gmailMatch[1].trim();
                rawReason = rawReason.replace(gmailMatch[0], '');
            }
            const telpMatch = rawReason.match(/\[TELP:([^\]]*)\]/);
            if (telpMatch) {
                if (!phoneNum) phoneNum = telpMatch[1].trim();
                rawReason = rawReason.replace(telpMatch[0], '');
            }
            const passMatch = rawReason.match(/\[SANDI_BARU:([^\]]*)\]/);
            if (passMatch) {
                if (!reqPass) reqPass = passMatch[1].trim();
                rawReason = rawReason.replace(passMatch[0], '');
            }

            return {
                activeGmail,
                phoneNum,
                reqPass,
                cleanReason: rawReason.trim() || '-'
            };
        };

        window.switchAccountTab = (tab) => {
            appState.accountTab = tab;
            appState.showForgotForm = false;
            renderApp();
        };

        window.toggleForgotFormInLogin = () => {
            appState.showForgotForm = !appState.showForgotForm;
            renderApp();
        };

        window.previewRegisterAvatar = async (event) => {
            const file = event.target.files?.[0];
            if (!file) return;
            try {
                await validateProfileImageDimensions(file);
                const wrap = document.getElementById('reg_avatar_preview_wrap');
                const img = document.getElementById('reg_avatar_preview_img');
                const reader = new FileReader();
                reader.onload = e => {
                    if (img) img.src = e.target.result;
                    if (wrap) wrap.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            } catch (err) {
                event.target.value = '';
                showToast(err.message, 'error');
            }
        };

        window.clearRegisterAvatar = () => {
            const inp = document.getElementById('reg_avatar');
            const wrap = document.getElementById('reg_avatar_preview_wrap');
            const img = document.getElementById('reg_avatar_preview_img');
            if (inp) inp.value = '';
            if (img) img.src = '';
            if (wrap) wrap.classList.add('hidden');
        };

        window.handleUserRegister = async (e) => {
            e.preventDefault();
            const fullName = (document.getElementById('reg_fullname')?.value || '').trim();
            const rawPrefix = (document.getElementById('reg_email_prefix')?.value || '').trim().toLowerCase().replace(/@.*$/, '').replace(/[^a-z0-9._-]/g, '');
            const password = document.getElementById('reg_password')?.value || '';
            const btn = document.getElementById('btn_reg_submit');

            if (!fullName || !rawPrefix) {
                showToast('Nama lengkap dan nama email wajib diisi.', 'error');
                return;
            }
            if (password.length < 6 || password.length > 15) {
                showToast('Kata sandi wajib terdiri dari 6 hingga maksimal 15 karakter.', 'error');
                return;
            }

            const email = `${rawPrefix}@zeniopost.com`;
            const existingEmail = appState.zpUsers.find(u => (u.email || '').toLowerCase() === email.toLowerCase());
            if (existingEmail) {
                showToast(`Email ${email} sudah terdaftar. Silakan gunakan nama email lain atau masuk ke akun Anda.`, 'error');
                return;
            }

            if (btn) { btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> Mendaftarkan...'; btn.disabled = true; }
            window.showLoading('Mendaftarkan akun Anda...');

            try {
                let avatarUrl = '';
                const avatarInput = document.getElementById('reg_avatar');
                if (avatarInput?.files?.[0]) {
                    await validateProfileImageDimensions(avatarInput.files[0]);
                    avatarUrl = await uploadFileMedia('reg_avatar', 'avatar');
                }

                const newUserPayload = {
                    full_name: fullName,
                    username: rawPrefix,
                    email,
                    password_hash: password,
                    avatar_url: avatarUrl || '',
                    status: 'approved',
                    created_at: new Date().toISOString()
                };

                let createdUser = null;
                if (IS_PREVIEW) {
                    createdUser = { ...newUserPayload, id: 'u_' + Date.now() };
                    mockUsers.unshift(createdUser);
                    appState.zpUsers.unshift(createdUser);
                } else {
                    const { data, error } = await dbClient.from('zp_users').insert([newUserPayload]).select();
                    if (error) throw error;
                    createdUser = data?.[0] || { ...newUserPayload, id: 'u_' + Date.now() };
                }

                appState.currentUser = createdUser;
                localStorage.setItem('zeniopost_current_user', JSON.stringify(createdUser));
                await fetchData();
                showToast(`Selamat datang, ${createdUser.full_name}! Akun ${createdUser.email} berhasil dibuat dan langsung aktif.`, 'success');
                appState.userDashTab = 'overview';
                renderApp();
            } catch (err) {
                showToast(err.message || 'Gagal mendaftarkan akun.', 'error');
                if (btn) { btn.innerHTML = 'Daftar & Masuk Sekarang'; btn.disabled = false; }
            } finally {
                window.hideLoading();
            }
        };

        window.handleUserLogin = async (e) => {
            e.preventDefault();
            const rawPrefix = (document.getElementById('usr_login_email')?.value || '').trim().toLowerCase().replace(/@.*$/, '');
            if (!rawPrefix) {
                showToast('Silakan masukkan nama email Zeniopost Anda.', 'error');
                return;
            }
            const rawEmail = `${rawPrefix}@zeniopost.com`;
            const password = document.getElementById('usr_login_pass')?.value || '';

            window.showLoading('Memverifikasi akun Anda...');
            try {
                await fetchData();
                const found = appState.zpUsers.find(u => (u.email || '').toLowerCase() === rawEmail && u.password_hash === password);
                if (!found) {
                    showToast('Email @zeniopost.com atau kata sandi tidak sesuai.', 'error');
                    return;
                }
                if (found.status === 'rejected') {
                    showToast('Akun Anda sedang dinonaktifkan oleh Admin.', 'error');
                    return;
                }

                appState.currentUser = found;
                localStorage.setItem('zeniopost_current_user', JSON.stringify(found));
                await fetchData();
                showToast(`Berhasil masuk sebagai ${found.full_name}!`, 'success');
                appState.userDashTab = 'overview';
                renderApp();
            } finally {
                window.hideLoading();
            }
        };

        window.logoutZeniopostUser = () => {
            appState.currentUser = null;
            appState.savedArticles = [];
            appState.editingDraftId = null;
            localStorage.removeItem('zeniopost_current_user');
            showToast('Anda telah keluar dari akun Zeniopost.', 'info');
            app.navigate('home');
        };

        window.handleRequestPasswordRecovery = async (e) => {
            e.preventDefault();
            const rawPrefix = (document.getElementById('rec_zp_email')?.value || '').trim().toLowerCase().replace(/@.*$/, '');
            const zpEmail = `${rawPrefix}@zeniopost.com`;
            const activeGmail = (document.getElementById('rec_gmail')?.value || '').trim().toLowerCase();
            const phone = (document.getElementById('rec_phone')?.value || '').trim();
            const newPass = document.getElementById('rec_new_password')?.value || '';
            const reason = (document.getElementById('rec_reason')?.value || '').trim();

            if (!activeGmail.endsWith('@gmail.com')) {
                showToast('Harap gunakan alamat Email Google aktif (@gmail.com) agar Admin dapat mengirimkan kata sandi baru Anda.', 'error');
                return;
            }
            if (!phone || phone.length < 8) {
                showToast('Nomor telepon atau WhatsApp aktif wajib diisi dengan benar.', 'error');
                return;
            }
            if (newPass.length < 6 || newPass.length > 15) {
                showToast('Kata sandi baru harus terdiri dari 6 hingga maksimal 15 karakter.', 'error');
                return;
            }

            const matchedUser = appState.zpUsers.find(u => (u.email || '').toLowerCase() === zpEmail);
            const encodedReason = `[GMAIL:${activeGmail}][TELP:${phone}][SANDI_BARU:${newPass}] ${reason}`;

            const payload = {
                user_id: matchedUser ? matchedUser.id : null,
                email: zpEmail,
                active_email: activeGmail,
                phone_number: phone,
                requested_password: newPass,
                reason: encodedReason,
                status: 'pending',
                created_at: new Date().toISOString()
            };

            window.showLoading('Mengirim permohonan kata sandi baru...');
            try {
                if (IS_PREVIEW) {
                    mockPasswordResets.unshift({ ...payload, id: 'pr_' + Date.now() });
                } else {
                    const { error } = await dbClient.from('zp_password_resets').insert([payload]);
                    if (error) {
                        await dbClient.from('zp_password_resets').insert([{
                            user_id: payload.user_id,
                            email: payload.email,
                            reason: payload.reason,
                            status: 'pending',
                            created_at: payload.created_at
                        }]);
                    }
                }
                await fetchData();
                appState.showForgotForm = false;
                showToast('Permohonan ganti kata sandi terkirim! Kata sandi baru akan dikirimkan ke Gmail Anda setelah disetujui Admin.', 'success');
                renderApp();
            } catch (err) {
                showToast(err.message || 'Gagal mengirim permohonan pemulihan kata sandi.', 'error');
            } finally {
                window.hideLoading();
            }
        };

        window.previewProfileAvatarSelection = async (event) => {
            const file = event.target.files?.[0];
            if (!file) return;
            try {
                await validateProfileImageDimensions(file);
                const box = document.getElementById('profile_pending_avatar_box');
                const img = document.getElementById('profile_pending_avatar_img');
                const reader = new FileReader();
                reader.onload = e => {
                    if (img) img.src = e.target.result;
                    if (box) box.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            } catch (err) {
                event.target.value = '';
                showToast(err.message, 'error');
            }
        };

        window.cancelProfileAvatarSelection = () => {
            const inp = document.getElementById('profile_avatar_input');
            const box = document.getElementById('profile_pending_avatar_box');
            const img = document.getElementById('profile_pending_avatar_img');
            if (inp) inp.value = '';
            if (img) img.src = '';
            if (box) box.classList.add('hidden');
        };

        window.handleUpdateAvatar = async () => {
            if (!appState.currentUser) return;
            const inp = document.getElementById('profile_avatar_input');
            const file = inp?.files?.[0];
            if (!file) {
                showToast('Pilih foto profil terlebih dahulu.', 'error');
                return;
            }
            window.showLoading('Mengunggah foto profil...');
            try {
                await validateProfileImageDimensions(file);
                const newAvatarUrl = await uploadFileMedia('profile_avatar_input', 'avatar');
                if (IS_PREVIEW) {
                    const u = mockUsers.find(x => String(x.id) === String(appState.currentUser.id));
                    if (u) u.avatar_url = newAvatarUrl;
                } else {
                    const { error } = await dbClient.from('zp_users').update({ avatar_url: newAvatarUrl }).eq('id', appState.currentUser.id);
                    if (error) throw error;
                }
                appState.currentUser.avatar_url = newAvatarUrl;
                localStorage.setItem('zeniopost_current_user', JSON.stringify(appState.currentUser));
                await fetchData();
                showToast('Foto profil berhasil diperbarui!', 'success');
                renderApp();
            } catch (err) {
                showToast(err.message || 'Gagal memperbarui foto profil.', 'error');
            } finally {
                window.hideLoading();
            }
        };

        window.handleRemoveAvatar = async (targetUserId = null) => {
            const uid = targetUserId || appState.currentUser?.id;
            if (!uid) return;
            try {
                if (IS_PREVIEW) {
                    const u = mockUsers.find(x => String(x.id) === String(uid));
                    if (u) u.avatar_url = '';
                } else {
                    const { error } = await dbClient.from('zp_users').update({ avatar_url: '' }).eq('id', uid);
                    if (error) throw error;
                }
                if (appState.currentUser && String(appState.currentUser.id) === String(uid)) {
                    appState.currentUser.avatar_url = '';
                    localStorage.setItem('zeniopost_current_user', JSON.stringify(appState.currentUser));
                }
                await fetchData();
                showToast('Foto profil berhasil dihapus.', 'info');
                renderApp();
            } catch (err) {
                showToast(err.message || 'Gagal menghapus foto profil.', 'error');
            }
        };

        // =====================================================================
        // 10. IDENTITAS PENULIS (3 TINGKAT TANDA CENTANG), KOMENTAR & PESAN ADMIN
        // =====================================================================
        const parseAuthorInfo = (article) => {
            let rawName = article?.author_name || 'Anonim';
            let social = article?.author_social || '';
            if (rawName.includes('|||')) {
                const parts = rawName.split('|||');
                rawName = parts[0].trim();
                social = social || (parts[1] ? parts[1].trim() : '');
            }
            social = social.trim();
            let socialUrl = '';
            let socialLabel = social;
            if (social) {
                if (social.startsWith('http://') || social.startsWith('https://')) {
                    socialUrl = social;
                    try {
                        const u = new URL(social);
                        const path = u.pathname.replace(/^\/+|\/+$/g, '');
                        socialLabel = path ? `${u.hostname.replace('www.', '')}/${path}` : u.hostname.replace('www.', '');
                    } catch (e) {
                        socialLabel = social;
                    }
                } else {
                    const cleanHandle = social.replace(/^@/, '').trim();
                    if (cleanHandle) {
                        socialUrl = `https://instagram.com/${cleanHandle}`;
                        socialLabel = `@${cleanHandle}`;
                    }
                }
            }

            let matchedAccount = null;
            if (article?.user_id) {
                matchedAccount = appState.zpUsers.find(u => String(u.id) === String(article.user_id));
            }
            if (!matchedAccount && !article?.is_official && rawName) {
                matchedAccount = appState.zpUsers.find(u => (u.full_name || '').toLowerCase() === rawName.toLowerCase());
            }

            return {
                name: matchedAccount ? matchedAccount.full_name : rawName,
                social,
                socialUrl,
                socialLabel,
                hasAccount: Boolean(matchedAccount || article?.user_id),
                avatarUrl: matchedAccount?.avatar_url || '',
                authorEmail: matchedAccount?.email || ''
            };
        };

        // 1. Akun Resmi Zeniopost -> Tanpa Foto Profil
        // 2. Penulis Berakun -> Foto Profil (atau inisial)
        // 3. Kontributor Tamu -> Ikon Pengguna Standar
        const renderAuthorAvatar = (article, info, sizeClasses = 'w-9 h-9 text-xs') => {
            if (article?.is_official) return '';
            if (info?.hasAccount) {
                if (info.avatarUrl) {
                    return `<img src="${info.avatarUrl}" alt="${info.name}" class="${sizeClasses} rounded-full aspect-square object-cover border border-slate-200 shrink-0 bg-white">`;
                }
                const initial = (info.name || 'U').charAt(0).toUpperCase();
                return `<div class="${sizeClasses} rounded-full bg-blue-600 text-white font-extrabold flex items-center justify-center shrink-0">${initial}</div>`;
            }
            return `<div class="${sizeClasses} rounded-full bg-slate-200 text-slate-600 font-bold flex items-center justify-center shrink-0"><i class="fas fa-user"></i></div>`;
        };

        // 1. Resmi Zeniopost -> Centang Biru
        // 2. Penulis Berakun -> Centang Abu-abu
        // 3. Tamu -> Tanpa Centang
        const renderAuthorNameWithBadge = (article, info, textSizeClass = 'text-xs') => {
            if (article?.is_official) {
                return `<span class="font-extrabold text-slate-900 ${textSizeClass}">Zeniopost</span> <i class="fas fa-check-circle text-blue-600 ${textSizeClass}" title="Akun Resmi Zeniopost"></i>`;
            }
            if (info?.hasAccount) {
                return `<span class="font-extrabold text-slate-900 truncate ${textSizeClass}">${info.name}</span> <i class="fas fa-check-circle text-slate-400 ${textSizeClass}" title="Penulis Terverifikasi"></i>`;
            }
            return `<span class="font-bold text-slate-800 truncate ${textSizeClass}">${info?.name || 'Anonim'}</span>`;
        };

        // Sistem Komentar Berjenjang + Identitas Akun Otomatis / Opsi Anonim
        const parseCommentMeta = (c) => {
            let rawContent = c?.content || '';
            let parentId = c?.parent_id ? String(c.parent_id) : null;
            let replyToName = '';
            let commentUserId = null;

            const uidMatch = rawContent.match(/^\[UID:([^\]]+)\]\s*/);
            if (uidMatch) {
                commentUserId = uidMatch[1].trim();
                rawContent = rawContent.slice(uidMatch[0].length);
            }

            const replyMatch = rawContent.match(/^\[REPLY:([^:\]]+):([^\]]*)\]\s*/);
            if (replyMatch) {
                if (!parentId) parentId = String(replyMatch[1]);
                replyToName = replyMatch[2] || '';
                rawContent = rawContent.slice(replyMatch[0].length);
            }

            let matchedUser = null;
            if (!c?.is_anonymous) {
                if (commentUserId) {
                    matchedUser = appState.zpUsers.find(u => String(u.id) === String(commentUserId));
                }
                if (!matchedUser && c?.author_name && c.author_name.toLowerCase() !== 'anonim') {
                    matchedUser = appState.zpUsers.find(u => (u.full_name || '').toLowerCase() === c.author_name.toLowerCase());
                }
            }

            return {
                ...c,
                cleanContent: rawContent,
                parsedParentId: parentId,
                replyToName,
                matchedUser
            };
        };

        const getArticleComments = (articleId) => {
            return (appState.comments || [])
                .filter(c => String(c.article_id) === String(articleId))
                .map(c => parseCommentMeta(c))
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
        };

        const getCommentLikes = (c) => {
            if (!c) return 0;
            const idStr = String(c.id);
            if (appState.localCommentLikesMap[idStr] !== undefined) {
                return Math.max(0, Number(appState.localCommentLikesMap[idStr]));
            }
            return Math.max(0, Number(c.likes) || 0);
        };

        const isCommentLiked = (commentId) => appState.likedCommentIds.includes(String(commentId));

        const renderSingleCommentItem = (c, allComments, articleId, prefix, isReply = false) => {
            const isAnon = Boolean(c.is_anonymous) || (c.author_name || '').toLowerCase() === 'anonim';
            const hasUserAcc = !isAnon && Boolean(c.matchedUser);
            const displayName = isAnon ? 'Anonim' : (c.matchedUser?.full_name || c.author_name || 'Pembaca');
            const safeDisplayName = displayName.replace(/'/g, "\\'").replace(/"/g, '&quot;');
            const likeCount = getCommentLikes(c);
            const liked = isCommentLiked(c.id);

            const replies = allComments
                .filter(r => String(r.parsedParentId) === String(c.id))
                .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

            const loggedUser = appState.currentUser;

            return `
                <div class="${isReply ? 'p-3.5 rounded-2xl bg-slate-50/90 border border-slate-200/80' : 'p-4 rounded-2xl bg-white border border-slate-100 shadow-sm'} space-y-2.5">
                    <div class="flex items-start justify-between gap-2">
                        <div class="flex items-center gap-2.5">
                            ${isAnon ? `
                                <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold shrink-0 bg-slate-800 text-white">
                                    <i class="fas fa-user-secret"></i>
                                </div>
                            ` : hasUserAcc && c.matchedUser?.avatar_url ? `
                                <img src="${c.matchedUser.avatar_url}" alt="${displayName}" class="w-8 h-8 rounded-full aspect-square object-cover border border-slate-200 shrink-0">
                            ` : hasUserAcc ? `
                                <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-extrabold shrink-0 bg-blue-600 text-white">
                                    ${displayName.charAt(0).toUpperCase()}
                                </div>
                            ` : `
                                <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold shrink-0 bg-blue-100 text-blue-700">
                                    <i class="fas fa-user"></i>
                                </div>
                            `}
                            <div>
                                <div class="flex items-center gap-1.5 flex-wrap">
                                    <span class="text-xs md:text-sm font-extrabold text-slate-900">${displayName}</span>
                                    ${hasUserAcc ? `<i class="fas fa-check-circle text-slate-400 text-xs" title="Penulis Terverifikasi"></i>` : ''}
                                    ${isAnon ? `<span class="text-[10px] font-bold bg-slate-100 text-slate-500 px-2 py-0.5 rounded-full">Anonim</span>` : ''}
                                    ${c.replyToName ? `
                                        <span class="text-[10px] font-bold bg-blue-50 text-blue-600 px-2 py-0.5 rounded-full flex items-center gap-1">
                                            <i class="fas fa-reply text-[9px]"></i> @${c.replyToName}
                                        </span>
                                    ` : ''}
                                </div>
                                <div class="text-[11px] font-semibold text-slate-400 flex items-center gap-1 mt-0.5">
                                    <i class="far fa-clock text-blue-500"></i> ${formatWaktu(c.created_at)}
                                </div>
                            </div>
                        </div>
                        ${appState.user ? `
                            <button type="button" onclick="window.deleteComment('${c.id}', '${articleId}')" class="bg-rose-50 hover:bg-rose-600 text-rose-600 hover:text-white border border-rose-200 px-2.5 py-1 rounded-xl text-[11px] font-extrabold transition shrink-0">
                                <i class="fas fa-trash-alt mr-1"></i> Hapus
                            </button>
                        ` : ''}
                    </div>

                    <p class="text-xs md:text-sm text-slate-700 leading-relaxed whitespace-pre-wrap pl-10">${c.cleanContent || ''}</p>

                    <div class="pl-10 pt-1 flex items-center gap-2.5 flex-wrap">
                        <button type="button" onclick="window.toggleLikeComment('${c.id}', '${articleId}')" class="px-3 py-1.5 rounded-xl text-xs font-extrabold border transition flex items-center gap-1.5 ${liked ? 'bg-rose-50 text-rose-600 border-rose-200' : 'bg-slate-50 hover:bg-rose-50/60 text-slate-600 border-slate-200'}">
                            <i class="${liked ? 'fas' : 'far'} fa-heart ${liked ? 'text-rose-600' : ''}"></i>
                            <span>Suka</span>
                            ${likeCount > 0 ? `<span class="px-1.5 rounded-full text-[11px] ${liked ? 'bg-rose-100 text-rose-700' : 'bg-slate-200/70 text-slate-700'}">${likeCount}</span>` : ''}
                        </button>
                        <button type="button" onclick="window.toggleReplyBox('${prefix}', '${c.id}')" class="px-3 py-1.5 rounded-xl text-xs font-extrabold bg-slate-50 hover:bg-blue-50 text-slate-600 hover:text-blue-600 border border-slate-200 transition flex items-center gap-1.5">
                            <i class="fas fa-reply text-[11px]"></i> <span>Balas</span>
                        </button>
                    </div>

                    <div id="reply-box-${prefix}-${c.id}" class="hidden pl-6 md:pl-10 pt-2">
                        <form onsubmit="window.submitReply(event, '${articleId}', '${c.id}', '${safeDisplayName}', '${prefix}')" class="bg-slate-50 border border-blue-200 rounded-2xl p-3.5 space-y-3">
                            <div class="flex items-center justify-between">
                                <span class="text-[11px] font-extrabold text-blue-700"><i class="fas fa-reply mr-1"></i>Membalas <b>@${displayName}</b></span>
                                <button type="button" onclick="window.toggleReplyBox('${prefix}', '${c.id}')" class="text-slate-400 hover:text-rose-500 text-xs font-bold"><i class="fas fa-times"></i> Batal</button>
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <button type="button" id="btn-reply-named-${prefix}-${c.id}" onclick="window.toggleReplyIdentity('${prefix}', '${c.id}', 'named')" class="py-2 px-2.5 rounded-xl text-[11px] font-extrabold border transition flex items-center justify-center gap-1.5 bg-blue-600 text-white border-blue-600">
                                    <i class="fas ${loggedUser ? 'fa-user-check' : 'fa-user-pen'}"></i> ${loggedUser ? 'Sesuai Akun' : 'Nama Pribadi'}
                                </button>
                                <button type="button" id="btn-reply-anon-${prefix}-${c.id}" onclick="window.toggleReplyIdentity('${prefix}', '${c.id}', 'anon')" class="py-2 px-2.5 rounded-xl text-[11px] font-extrabold border transition flex items-center justify-center gap-1.5 bg-white text-slate-600 border-slate-200">
                                    <i class="fas fa-user-secret"></i> Sebagai Anonim
                                </button>
                            </div>
                            <input type="hidden" id="reply-mode-${prefix}-${c.id}" value="named">
                            <div id="reply-name-box-${prefix}-${c.id}">
                                ${loggedUser ? `
                                    <input type="hidden" id="reply-name-${prefix}-${c.id}" value="${loggedUser.full_name.replace(/"/g, '&quot;')}">
                                    <div class="p-2.5 bg-white border border-slate-200 rounded-xl flex items-center gap-2 text-xs font-extrabold text-slate-800">
                                        <span>${loggedUser.full_name}</span> <i class="fas fa-check-circle text-slate-400"></i>
                                    </div>
                                ` : `
                                    <input type="text" id="reply-name-${prefix}-${c.id}" required maxlength="50" placeholder="Masukkan nama Anda..." class="w-full p-2.5 bg-white border border-slate-200 rounded-xl text-xs font-bold outline-none focus:border-blue-500">
                                `}
                            </div>
                            <div id="reply-anon-badge-${prefix}-${c.id}" class="hidden p-2.5 bg-slate-200/70 rounded-xl text-[11px] font-bold text-slate-700">
                                <i class="fas fa-user-secret mr-1"></i> Membalas sebagai <b>Anonim</b>.
                            </div>
                            <textarea id="reply-text-${prefix}-${c.id}" required rows="2" maxlength="1000" placeholder="Tulis balasan Anda..." class="w-full p-2.5 bg-white border border-slate-200 rounded-xl text-xs font-medium outline-none focus:border-blue-500"></textarea>
                            <div class="flex justify-end">
                                <button type="submit" id="btn-submit-reply-${prefix}-${c.id}" class="bg-blue-600 hover:bg-blue-700 text-white font-extrabold py-2 px-4 rounded-xl text-xs">
                                    <i class="fas fa-paper-plane mr-1"></i> Kirim Balasan
                                </button>
                            </div>
                        </form>
                    </div>

                    ${replies.length > 0 ? `
                        <div class="pl-4 md:pl-8 ml-4 md:ml-6 border-l-2 border-blue-100 space-y-2.5 pt-2">
                            ${replies.map(r => renderSingleCommentItem(r, allComments, articleId, prefix, true)).join('')}
                        </div>
                    ` : ''}
                </div>
            `;
        };

        const renderCommentsSection = (articleId, prefix = 'pop') => {
            const allList = getArticleComments(articleId);
            const allIds = new Set(allList.map(c => String(c.id)));
            const rootComments = allList.filter(c => !c.parsedParentId || !allIds.has(String(c.parsedParentId)));
            const loggedUser = appState.currentUser;

            return `
                <div id="comments-wrapper-${prefix}-${articleId}" class="mt-6 pt-6 border-t border-slate-200 space-y-5">
                    <div class="flex items-center justify-between">
                        <h3 class="text-base md:text-lg font-extrabold text-slate-900 flex items-center gap-2">
                            <span class="w-8 h-8 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-sm"><i class="fas fa-comments"></i></span>
                            Komentar Pembaca
                            <span class="text-xs font-extrabold bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full">${allList.length}</span>
                        </h3>
                    </div>

                    <form onsubmit="window.submitComment(event, '${articleId}', '${prefix}')" class="bg-slate-50 border border-slate-200 rounded-2xl p-4 space-y-3.5">
                        <div>
                            <label class="block text-[11px] font-extrabold text-slate-500 uppercase tracking-wider mb-2">Pilih Identitas Komentar:</label>
                            <div class="grid grid-cols-2 gap-2">
                                <button type="button" id="btn-mode-named-${prefix}" onclick="window.toggleCommentIdentity('${prefix}', 'named')" class="py-2.5 px-3 rounded-xl text-xs font-extrabold border transition flex items-center justify-center gap-1.5 bg-blue-600 text-white border-blue-600 shadow-sm">
                                    <i class="fas ${loggedUser ? 'fa-user-check' : 'fa-user-pen'}"></i> ${loggedUser ? 'Sesuai Akun Saya' : 'Isi Nama Pribadi'}
                                </button>
                                <button type="button" id="btn-mode-anon-${prefix}" onclick="window.toggleCommentIdentity('${prefix}', 'anon')" class="py-2.5 px-3 rounded-xl text-xs font-extrabold border transition flex items-center justify-center gap-1.5 bg-white text-slate-600 border-slate-200 hover:bg-slate-100">
                                    <i class="fas fa-user-secret"></i> Sebagai Anonim
                                </button>
                            </div>
                            <input type="hidden" id="comment-mode-${prefix}" value="named">
                        </div>

                        <div id="comment-name-box-${prefix}">
                            ${loggedUser ? `
                                <input type="hidden" id="comment-name-${prefix}" value="${loggedUser.full_name.replace(/"/g, '&quot;')}">
                                <div class="p-3 bg-white border border-slate-200 rounded-xl flex items-center gap-3">
                                    ${loggedUser.avatar_url ? `
                                        <img src="${loggedUser.avatar_url}" class="w-9 h-9 rounded-full aspect-square object-cover border border-slate-200 shrink-0">
                                    ` : `
                                        <div class="w-9 h-9 rounded-full bg-blue-600 text-white font-extrabold flex items-center justify-center text-xs shrink-0">${loggedUser.full_name.charAt(0).toUpperCase()}</div>
                                    `}
                                    <div>
                                        <div class="text-xs font-extrabold text-slate-900 flex items-center gap-1.5">
                                            <span>${loggedUser.full_name}</span>
                                            <i class="fas fa-check-circle text-slate-400" title="Penulis Terverifikasi"></i>
                                        </div>
                                        <div class="text-[11px] font-semibold text-blue-600">Komentar menggunakan identitas akun resmi Anda</div>
                                    </div>
                                </div>
                            ` : `
                                <input type="text" id="comment-name-${prefix}" required maxlength="50" placeholder="Masukkan nama Anda..." class="w-full p-3 bg-white border border-slate-200 rounded-xl text-xs md:text-sm font-bold outline-none focus:border-blue-500">
                            `}
                        </div>

                        <div id="comment-anon-badge-${prefix}" class="hidden p-3 bg-slate-200/70 border border-slate-300/80 rounded-xl text-xs font-bold text-slate-700 flex items-center gap-2">
                            <i class="fas fa-user-secret text-slate-600 text-sm"></i>
                            <span>Anda akan berkomentar sebagai <b class="text-slate-900">Anonim</b> (identitas Anda disembunyikan).</span>
                        </div>

                        <div>
                            <textarea id="comment-text-${prefix}" required rows="3" maxlength="1000" placeholder="Tulis tanggapan atau komentar Anda di sini..." class="w-full p-3 bg-white border border-slate-200 rounded-xl text-xs md:text-sm font-medium outline-none focus:border-blue-500"></textarea>
                        </div>

                        <div class="flex justify-end">
                            <button type="submit" id="btn-submit-comment-${prefix}" class="bg-slate-900 hover:bg-blue-600 text-white font-extrabold py-2.5 px-5 rounded-xl text-xs md:text-sm shadow-sm flex items-center gap-2 transition">
                                <i class="fas fa-paper-plane"></i> Kirim Komentar
                            </button>
                        </div>
                    </form>

                    <div class="space-y-3">
                        ${rootComments.length === 0 ? `
                            <div class="text-center py-6 px-4 bg-white rounded-2xl border border-slate-100 text-slate-400 text-xs font-bold">
                                <i class="far fa-comment-dots text-2xl mb-1.5 block text-slate-300"></i>
                                Belum ada komentar. Jadilah yang pertama memberikan tanggapan!
                            </div>
                        ` : rootComments.map(c => renderSingleCommentItem(c, allList, articleId, prefix, false)).join('')}
                    </div>
                </div>
            `;
        };

        const refreshCommentViews = (articleId) => {
            if (articleId) {
                ['pop', 'page', 'adminmod'].forEach(pref => {
                    const wrap = document.getElementById(`comments-wrapper-${pref}-${articleId}`);
                    if (wrap) wrap.outerHTML = renderCommentsSection(articleId, pref);
                });
            }
            const mainEl = document.getElementById('main-content');
            if (mainEl && appState.view !== 'article') {
                mainEl.innerHTML = buildMainContent();
            }
        };

        window.toggleCommentIdentity = (prefix, mode) => {
            const modeInput = document.getElementById(`comment-mode-${prefix}`);
            const nameBox = document.getElementById(`comment-name-box-${prefix}`);
            const nameInput = document.getElementById(`comment-name-${prefix}`);
            const anonBadge = document.getElementById(`comment-anon-badge-${prefix}`);
            const btnNamed = document.getElementById(`btn-mode-named-${prefix}`);
            const btnAnon = document.getElementById(`btn-mode-anon-${prefix}`);
            if (!modeInput) return;
            modeInput.value = mode;
            if (mode === 'anon') {
                if (nameBox) nameBox.classList.add('hidden');
                if (nameInput && nameInput.type !== 'hidden') nameInput.required = false;
                if (anonBadge) anonBadge.classList.remove('hidden');
                if (btnAnon) btnAnon.className = 'py-2.5 px-3 rounded-xl text-xs font-extrabold border transition flex items-center justify-center gap-1.5 bg-slate-900 text-white border-slate-900 shadow-sm';
                if (btnNamed) btnNamed.className = 'py-2.5 px-3 rounded-xl text-xs font-extrabold border transition flex items-center justify-center gap-1.5 bg-white text-slate-600 border-slate-200 hover:bg-slate-100';
            } else {
                if (nameBox) nameBox.classList.remove('hidden');
                if (nameInput && nameInput.type !== 'hidden') nameInput.required = true;
                if (anonBadge) anonBadge.classList.add('hidden');
                if (btnNamed) btnNamed.className = 'py-2.5 px-3 rounded-xl text-xs font-extrabold border transition flex items-center justify-center gap-1.5 bg-blue-600 text-white border-blue-600 shadow-sm';
                if (btnAnon) btnAnon.className = 'py-2.5 px-3 rounded-xl text-xs font-extrabold border transition flex items-center justify-center gap-1.5 bg-white text-slate-600 border-slate-200 hover:bg-slate-100';
            }
        };

        window.toggleReplyBox = (prefix, commentId) => {
            const box = document.getElementById(`reply-box-${prefix}-${commentId}`);
            if (box) box.classList.toggle('hidden');
        };

        window.toggleReplyIdentity = (prefix, commentId, mode) => {
            const modeInput = document.getElementById(`reply-mode-${prefix}-${commentId}`);
            const nameBox = document.getElementById(`reply-name-box-${prefix}-${commentId}`);
            const nameInput = document.getElementById(`reply-name-${prefix}-${commentId}`);
            const anonBadge = document.getElementById(`reply-anon-badge-${prefix}-${commentId}`);
            const btnNamed = document.getElementById(`btn-reply-named-${prefix}-${commentId}`);
            const btnAnon = document.getElementById(`btn-reply-anon-${prefix}-${commentId}`);
            if (!modeInput) return;
            modeInput.value = mode;
            if (mode === 'anon') {
                if (nameBox) nameBox.classList.add('hidden');
                if (nameInput && nameInput.type !== 'hidden') nameInput.required = false;
                if (anonBadge) anonBadge.classList.remove('hidden');
