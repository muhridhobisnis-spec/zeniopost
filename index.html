                if (btnAnon) btnAnon.className = 'py-2 px-2.5 rounded-xl text-[11px] font-extrabold border transition flex items-center justify-center gap-1.5 bg-slate-900 text-white border-slate-900';
                if (btnNamed) btnNamed.className = 'py-2 px-2.5 rounded-xl text-[11px] font-extrabold border transition flex items-center justify-center gap-1.5 bg-white text-slate-600 border-slate-200';
            } else {
                if (nameBox) nameBox.classList.remove('hidden');
                if (nameInput && nameInput.type !== 'hidden') nameInput.required = true;
                if (anonBadge) anonBadge.classList.add('hidden');
                if (btnNamed) btnNamed.className = 'py-2 px-2.5 rounded-xl text-[11px] font-extrabold border transition flex items-center justify-center gap-1.5 bg-blue-600 text-white border-blue-600';
                if (btnAnon) btnAnon.className = 'py-2 px-2.5 rounded-xl text-[11px] font-extrabold border transition flex items-center justify-center gap-1.5 bg-white text-slate-600 border-slate-200';
            }
        };

        window.submitComment = async (e, articleId, prefix = 'pop') => {
            e.preventDefault();
            const mode = document.getElementById(`comment-mode-${prefix}`)?.value || 'named';
            const rawName = (document.getElementById(`comment-name-${prefix}`)?.value || '').trim();
            const rawText = (document.getElementById(`comment-text-${prefix}`)?.value || '').trim();
            if (!rawText) return;
            const isAnon = mode === 'anon';
            const finalAuthor = isAnon ? 'Anonim' : (appState.currentUser ? appState.currentUser.full_name : rawName);
            const uidPrefix = (!isAnon && appState.currentUser) ? `[UID:${appState.currentUser.id}] ` : '';

            const payload = {
                article_id: articleId,
                author_name: finalAuthor,
                is_anonymous: isAnon,
                content: `${uidPrefix}${rawText}`,
                created_at: new Date().toISOString()
            };

            window.showLoading('Mengirim komentar...');
            try {
                if (IS_PREVIEW) {
                    const saved = { ...payload, id: 'c_' + Date.now(), likes: 0 };
                    mockComments.unshift(saved);
                    appState.comments.unshift(saved);
                } else {
                    const { data } = await dbClient.from('comments').insert([payload]).select();
                    appState.comments.unshift(data?.[0] || { ...payload, id: 'local_' + Date.now() });
                }
                showToast('Komentar berhasil dikirim!', 'success');
                refreshCommentViews(articleId);
            } catch (err) {
                showToast('Gagal mengirim komentar.', 'error');
            } finally {
                window.hideLoading();
            }
        };

        window.submitReply = async (e, articleId, parentCommentId, replyToName, prefix = 'pop') => {
            e.preventDefault();
            const mode = document.getElementById(`reply-mode-${prefix}-${parentCommentId}`)?.value || 'named';
            const rawName = (document.getElementById(`reply-name-${prefix}-${parentCommentId}`)?.value || '').trim();
            const rawText = (document.getElementById(`reply-text-${prefix}-${parentCommentId}`)?.value || '').trim();
            if (!rawText) return;
            const isAnon = mode === 'anon';
            const finalAuthor = isAnon ? 'Anonim' : (appState.currentUser ? appState.currentUser.full_name : rawName);
            const uidPrefix = (!isAnon && appState.currentUser) ? `[UID:${appState.currentUser.id}]` : '';
            const encodedContent = `${uidPrefix}[REPLY:${parentCommentId}:${replyToName}] ${rawText}`;

            const payload = {
                article_id: articleId,
                author_name: finalAuthor,
                is_anonymous: isAnon,
                content: encodedContent,
                created_at: new Date().toISOString()
            };

            window.showLoading('Mengirim balasan...');
            try {
                if (IS_PREVIEW) {
                    const saved = { ...payload, id: 'c_' + Date.now(), parent_id: parentCommentId, likes: 0 };
                    mockComments.unshift(saved);
                    appState.comments.unshift(saved);
                } else {
                    const { data } = await dbClient.from('comments').insert([payload]).select();
                    appState.comments.unshift(data?.[0] || { ...payload, id: 'local_' + Date.now() });
                }
                showToast('Balasan berhasil dikirim!', 'success');
                refreshCommentViews(articleId);
            } catch (err) {
                showToast('Gagal mengirim balasan.', 'error');
            } finally {
                window.hideLoading();
            }
        };

        window.toggleLikeComment = async (commentId, articleId) => {
            const idStr = String(commentId);
            const target = appState.comments.find(c => String(c.id) === idStr);
            if (!target) return;
            const alreadyLiked = isCommentLiked(idStr);
            const currentLikes = getCommentLikes(target);
            const nextLikes = alreadyLiked ? Math.max(0, currentLikes - 1) : currentLikes + 1;
            const delta = alreadyLiked ? -1 : 1;

            if (alreadyLiked) appState.likedCommentIds = appState.likedCommentIds.filter(id => id !== idStr);
            else appState.likedCommentIds.push(idStr);

            target.likes = nextLikes;
            appState.localCommentLikesMap[idStr] = nextLikes;
            localStorage.setItem('zeniopost_liked_comments', JSON.stringify(appState.likedCommentIds));
            localStorage.setItem('zeniopost_comment_likes_map', JSON.stringify(appState.localCommentLikesMap));
            refreshCommentViews(articleId);

            if (!IS_PREVIEW && dbClient && !idStr.startsWith('local_')) {
                try {
                    const { error } = await dbClient.rpc('increment_comment_likes', { comm_id: commentId, delta_val: delta });
                    if (error) await dbClient.from('comments').update({ likes: nextLikes }).eq('id', commentId);
                } catch (e) {}
            }
        };

        window.deleteComment = async (commentId, articleId = null) => {
            window.showLoading('Menghapus komentar...');
            try {
                if (!IS_PREVIEW && dbClient) {
                    await dbClient.from('comments').delete().eq('id', commentId);
                }
                appState.comments = appState.comments.filter(c => String(c.id) !== String(commentId));
                mockComments = mockComments.filter(c => String(c.id) !== String(commentId));
                showToast('Komentar berhasil dihapus!', 'success');
                refreshCommentViews(articleId);
            } catch (err) {
                showToast('Gagal menghapus komentar.', 'error');
            } finally {
                window.hideLoading();
            }
        };

        // Fungsi Pesan / Obrolan Langsung dengan Admin
        const getUnreadChatCountForUser = () => {
            if (!appState.currentUser) return 0;
            return (appState.messages || []).filter(m => String(m.user_id) === String(appState.currentUser.id) && m.sender_role === 'admin' && !m.is_read).length;
        };

        const getUnreadChatCountForAdmin = () => {
            return (appState.messages || []).filter(m => m.sender_role === 'user' && !m.is_read).length;
        };

        const markMessagesAsRead = async (userId, viewerRole) => {
            if (!userId) return;
            const targetSender = viewerRole === 'admin' ? 'user' : 'admin';
            (appState.messages || []).forEach(m => {
                if (String(m.user_id) === String(userId) && m.sender_role === targetSender) {
                    m.is_read = true;
                }
            });
            if (!IS_PREVIEW && dbClient) {
                try {
                    await dbClient.from('zp_messages').update({ is_read: true }).eq('user_id', userId).eq('sender_role', targetSender).eq('is_read', false);
                } catch (e) {}
            }
        };

        window.sendChatMessage = async (e, senderRole = 'user', targetUserId = null) => {
            e.preventDefault();
            const uid = senderRole === 'user' ? appState.currentUser?.id : targetUserId;
            if (!uid) return;
            const inputId = senderRole === 'user' ? 'user_chat_input' : 'admin_chat_input';
            const inputEl = document.getElementById(inputId);
            const text = (inputEl?.value || '').trim();
            if (!text) return;

            const category = senderRole === 'user'
                ? (document.getElementById('user_chat_category')?.value || 'Umum')
                : 'Balasan Admin';

            const payload = {
                user_id: uid,
                sender_role: senderRole,
                category,
                message: text,
                is_read: false,
                created_at: new Date().toISOString()
            };

            if (inputEl) inputEl.value = '';
            try {
                if (IS_PREVIEW) {
                    const saved = { ...payload, id: 'm_' + Date.now() };
                    mockMessages.push(saved);
                    appState.messages.push(saved);
                } else {
                    const { data } = await dbClient.from('zp_messages').insert([payload]).select();
                    appState.messages.push(data?.[0] || { ...payload, id: 'm_' + Date.now() });
                }
                renderApp();
            } catch (err) {
                showToast('Gagal mengirim pesan.', 'error');
            }
        };

        window.deleteChatMessage = async (msgId) => {
            try {
                if (!IS_PREVIEW && dbClient) {
                    await dbClient.from('zp_messages').delete().eq('id', msgId);
                }
                appState.messages = appState.messages.filter(m => String(m.id) !== String(msgId));
                mockMessages = mockMessages.filter(m => String(m.id) !== String(msgId));
                showToast('Pesan dihapus.', 'info');
                renderApp();
            } catch (err) {
                showToast('Gagal menghapus pesan.', 'error');
            }
        };

        window.deleteAllUserChatMessages = async (userId) => {
            try {
                if (!IS_PREVIEW && dbClient) {
                    await dbClient.from('zp_messages').delete().eq('user_id', userId);
                }
                appState.messages = appState.messages.filter(m => String(m.user_id) !== String(userId));
                mockMessages = mockMessages.filter(m => String(m.user_id) !== String(userId));
                showToast('Seluruh riwayat pesan pengguna dihapus.', 'info');
                renderApp();
            } catch (err) {
                showToast('Gagal menghapus riwayat pesan.', 'error');
            }
        };

        // Fungsi Navigasi, Bagikan & Jendela Baca Artikel
        const updateMetaTags = (article) => {
            if (!article) return;
            document.title = `${article.title} - Zeniopost`;
            const ogTitle = document.getElementById('og-title');
            const ogDesc = document.getElementById('og-desc');
            const ogImg = document.getElementById('og-image');
            if (ogTitle) ogTitle.setAttribute('content', article.title);
            if (ogDesc) ogDesc.setAttribute('content', stripHtml(article.content || '').substring(0, 150));
            if (ogImg && article.image_url) ogImg.setAttribute('content', article.image_url);
        };

        const safeUpdateHistory = (articleId = null, title = 'Zeniopost') => {
            try {
                if (window.location.protocol === 'http:' || window.location.protocol === 'https:') {
                    const targetUrl = articleId ? `?article=${articleId}` : window.location.pathname;
                    window.history.replaceState({}, title, targetUrl);
                }
            } catch (e) {}
        };

        const getShareUrl = (articleId) => {
            const origin = (window.location.protocol === 'http:' || window.location.protocol === 'https:')
                ? window.location.origin
                : 'https://zeniopost.vercel.app';
            if (appState.hasDynamicShare) return `${origin}/api/share?id=${articleId}`;
            if (window.location.protocol === 'http:' || window.location.protocol === 'https:') {
                return `${window.location.origin}${window.location.pathname}?article=${articleId}`;
            }
            return `${origin}/?article=${articleId}`;
        };

        window.shareArticle = async (articleId) => {
            const a = appState.articles.find(x => String(x.id) === String(articleId)) || appState.readArticle;
            if (!a) return;
            updateMetaTags(a);
            const shareUrl = getShareUrl(a.id);
            const isMobileDevice = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent || '');
            if (isMobileDevice && navigator.share) {
                try {
                    await navigator.share({ title: a.title, url: shareUrl });
                    return;
                } catch (err) {
                    if (err.name === 'AbortError') return;
                }
            }
            const ta = document.createElement('textarea');
            ta.value = shareUrl;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand('copy');
                showToast('<i class="fas fa-check-circle mr-1"></i> Tautan berita berhasil disalin!', 'success');
            } catch (err) {
                showToast('Gagal menyalin tautan.', 'error');
            }
            document.body.removeChild(ta);
        };

        window.closeModal = () => {
            const modal = document.getElementById('modal-container');
            if (modal) {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                modal.innerHTML = '';
            }
            if (appState.view !== 'article') safeUpdateHistory(null, 'Zeniopost');
        };

        window.openArticlePopup = (articleId) => {
            const a = appState.articles.find(x => String(x.id) === String(articleId));
            if (!a) return;
            window.showLoading('Memuat pratinjau berita...');
            appState.readArticle = a;
            appState.countedInOpen = String(a.id);
            recordArticleView(a.id);
            updateMetaTags(a);

            const info = parseAuthorInfo(a);
            const saved = isArticleSaved(a.id);
            setTimeout(() => {
                window.hideLoading();
                const modal = document.getElementById('modal-container');
                modal.classList.remove('hidden');
                modal.classList.add('flex');

                modal.innerHTML = `
                <div class="bg-white w-full max-w-2xl rounded-3xl shadow-2xl overflow-hidden animate-fade my-8 max-h-[90vh] flex flex-col border border-slate-100" onclick="event.stopPropagation()">
                    <div class="p-3.5 px-5 bg-white border-b border-slate-100 flex justify-between items-center gap-2 sticky top-0 z-20">
                        <div class="flex items-center gap-2 shrink-0">
                            <img src="${getLogoUrl()}" alt="Logo Zeniopost" onerror="this.src='${getLogoFallbackUrl()}'" class="h-8 md:h-9 w-auto object-contain block">
                        </div>
                        <div class="flex items-center gap-1.5 md:gap-2">
                            <button type="button" onclick="window.toggleSaveArticle('${a.id}', event); window.openArticlePopup('${a.id}')" class="px-3 py-1.5 rounded-xl text-xs font-extrabold border transition flex items-center gap-1.5 ${saved ? 'bg-blue-600 text-white border-blue-600' : 'bg-slate-100 text-slate-700 border-slate-200 hover:bg-blue-50 hover:text-blue-600'}">
                                <i class="${saved ? 'fas fa-bookmark' : 'far fa-bookmark'}"></i>
                                <span>${saved ? 'Tersimpan' : 'Simpan'}</span>
                            </button>
                            <button type="button" onclick="window.closeModal(); app.navigate('article', '${a.id}')" class="bg-slate-100 hover:bg-blue-50 text-slate-700 hover:text-blue-600 border border-slate-200 px-3 py-1.5 rounded-xl text-xs font-extrabold flex items-center gap-1.5 transition">
                                <i class="fas fa-expand text-blue-600"></i> <span>Layar Penuh</span>
                            </button>
                            <button type="button" onclick="window.shareArticle('${a.id}')" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-xl text-xs font-extrabold flex items-center gap-1.5 transition">
                                <i class="fas fa-share-nodes"></i> <span>Bagikan</span>
                            </button>
                            <button type="button" onclick="window.closeModal()" class="w-8 h-8 md:w-9 md:h-9 rounded-full bg-slate-100 hover:bg-rose-50 hover:text-rose-600 text-slate-600 flex items-center justify-center transition shrink-0">
                                <i class="fas fa-times text-base"></i>
                            </button>
                        </div>
                    </div>

                    <div class="overflow-y-auto p-5 sm:p-6 space-y-5 flex-1">
                        <div class="w-full aspect-video rounded-2xl overflow-hidden bg-slate-100 border border-slate-100 shadow-sm">
                            <img src="${a.image_url}" alt="${a.title}" class="w-full h-full object-cover">
                        </div>

                        <h1 class="text-xl sm:text-2xl md:text-3xl font-extrabold text-slate-900 leading-snug break-words">${a.title}</h1>

                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 p-4 rounded-2xl bg-slate-50 border border-slate-100">
                            <div class="flex items-center gap-3">
                                ${renderAuthorAvatar(a, info, 'w-10 h-10 text-sm')}
                                <div>
                                    <div class="text-sm md:text-base flex items-center gap-1.5">
                                        ${renderAuthorNameWithBadge(a, info, 'text-sm')}
                                    </div>
                                    <div class="text-xs font-semibold text-slate-500 flex flex-wrap items-center gap-2 mt-0.5">
                                        <span><i class="far fa-clock text-blue-500 mr-1"></i>${formatWaktu(a.created_at)}</span>
                                        <span>•</span>
                                        <span class="text-blue-600 font-extrabold"><i class="far fa-eye mr-1"></i>${getArticleViews(a)}x dibaca</span>
                                    </div>
                                </div>
                            </div>

                            ${!a.is_official && info.socialUrl ? `

                    <!-- TAB 2: FORMULIR SUNTING TEKS, GAMBAR & DATA PENULIS OLEH ADMIN -->
                    <form id="admin-tab-edit" onsubmit="window.saveAdminEdit(event, '${a.id}', false)" class="${initialTab === 'edit' ? 'block' : 'hidden'} overflow-y-auto p-6 space-y-4 flex-1">
                        <div class="bg-blue-50/80 border border-blue-100 p-3.5 rounded-2xl text-xs font-bold text-blue-800 flex items-center gap-2.5">

                            </div>
                        </div>

                        <!-- Sunting Isi Teks Berita Lengkap -->

                            </button>
                            ${isPending ? `

                                    <i class="fas fa-check-double"></i> Simpan & Terima Publikasi
                                </button>

        window.switchAdminModalTab = (tab) => {
            const pTab = document.getElementById('admin-tab-preview');
            const eTab = document.getElementById('admin-tab-edit');
            const pBtn = document.getElementById('tab-btn-preview');
            const eBtn = document.getElementById('tab-btn-edit');
            if (!pTab || !eTab) return;

            if (tab === 'edit') {
                pTab.classList.add('hidden');
                eTab.classList.remove('hidden');
                if (eBtn) eBtn.className = 'px-3 py-1.5 rounded-lg text-xs font-extrabold transition bg-blue-600 text-white';
                if (pBtn) pBtn.className = 'px-3 py-1.5 rounded-lg text-xs font-extrabold transition text-slate-300 hover:text-white';
            } else {
                eTab.classList.add('hidden');
                pTab.classList.remove('hidden');
                if (pBtn) pBtn.className = 'px-3 py-1.5 rounded-lg text-xs font-extrabold transition bg-blue-600 text-white';
                if (eBtn) eBtn.className = 'px-3 py-1.5 rounded-lg text-xs font-extrabold transition text-slate-300 hover:text-white';
            }
        };

        window.previewAdminEditImage = (event) => {
            const file = event.target.files?.[0];
            const imgEl = document.getElementById('edit_img_preview');
            const cancelBtn = document.getElementById('btn_cancel_edit_img');
            if (file && imgEl) {
                const reader = new FileReader();
                reader.onload = e => {
                    imgEl.src = e.target.result;
                    if (cancelBtn) cancelBtn.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        };

        window.resetAdminEditImage = () => {
            const fileInput = document.getElementById('edit_image_file');
            const imgEl = document.getElementById('edit_img_preview');
            const cancelBtn = document.getElementById('btn_cancel_edit_img');
            if (fileInput) fileInput.value = '';
            if (imgEl && imgEl.dataset.original) imgEl.src = imgEl.dataset.original;
            if (cancelBtn) cancelBtn.classList.add('hidden');

        window.saveAdminEdit = async (e, articleId, approveAfterSave = false) => {
            if (e) e.preventDefault();
            const target = appState.articles.find(x => String(x.id) === String(articleId));
            if (!target) return;

            const editorData = getRichEditorContent('edit_content');
            if (!editorData.text) {
                showToast('Isi teks berita tidak boleh kosong.', 'error');
                return;
            }

            const btnSave = document.getElementById('btn_save_edit');
            const btnAcc = document.getElementById('btn_save_approve');
            if (btnSave) { btnSave.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> Menyimpan...'; btnSave.disabled = true; }
            if (btnAcc) { btnAcc.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> Memproses...'; btnAcc.disabled = true; }
            window.showLoading('Menyimpan perubahan artikel...');

            try {
                let newImageUrl = target.image_url;
                const fileInput = document.getElementById('edit_image_file');
                if (fileInput?.files?.[0]) {
                    newImageUrl = await uploadFileMedia('edit_image_file', 'article');

                const newTitle = (document.getElementById('edit_title')?.value || '').trim();
                const newTopic = document.getElementById('edit_topic')?.value || target.topic_id;
                const rawName = (document.getElementById('edit_author')?.value || 'Anonim').trim();
                const rawSocial = (document.getElementById('edit_social')?.value || '').trim();
                const combinedAuthor = rawSocial ? `${rawName} ||| ${rawSocial}` : rawName;
                const nextStatus = approveAfterSave ? 'approved' : target.status;

                const updatedFields = {
                    title: newTitle,
                    topic_id: newTopic,
                    image_url: newImageUrl,
                    content: editorData.html,
                    author_name: combinedAuthor,
                    status: nextStatus
                };

                if (IS_PREVIEW) {
                    Object.assign(target, updatedFields);
                } else {
                    const { error } = await dbClient.from('articles').update(updatedFields).eq('id', articleId);
                    if (error) throw error;
                }

                showToast(
                    approveAfterSave
                        ? 'Artikel berhasil diperbarui dan langsung dipublikasikan!'
                        : 'Perubahan teks dan gambar artikel berhasil disimpan!',
                    'success'
                );
                await fetchData();
                renderApp();
                window.closeModal();
            } catch (err) {
                showToast(err.message || 'Gagal menyimpan perubahan artikel.', 'error');
                if (btnSave) { btnSave.innerHTML = '<i class="fas fa-save"></i> Simpan Perubahan'; btnSave.disabled = false; }
                if (btnAcc) { btnAcc.innerHTML = '<i class="fas fa-check-double"></i> Simpan & Terima Publikasi'; btnAcc.disabled = false; }
            } finally {
                window.hideLoading();
            }
        };

        // =====================================================================
        // 14. PENGAJUAN ARTIKEL (PENGGUNA BERAKUN & TAMU WAJIB MELALUI PERSETUJUAN ADMIN)
        // =====================================================================
        window.submitPublicForm = async (e, targetStatus = null) => {
            if (e) e.preventDefault();
            const isLoggedUser = Boolean(appState.currentUser);
            const finalStatus = targetStatus === 'draft' ? 'draft' : 'pending';

            const title = (document.getElementById('f_title')?.value || '').trim();
            const topicId = document.getElementById('f_topic')?.value || '';
            const editorData = getRichEditorContent('f_content');
            const rawName = (isLoggedUser ? appState.currentUser.full_name : (document.getElementById('f_author')?.value || '')).trim();
            const rawSocial = (document.getElementById('f_social')?.value || '').trim();

                showToast('Harap lengkapi Judul, Kategori, Isi Berita, dan Nama Penulis.', 'error');

            }

            const btn = document.getElementById('btn_f');
            if (btn) { btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> Memproses...'; btn.disabled = true; }
            window.showLoading(finalStatus === 'draft' ? 'Menyimpan draf artikel...' : 'Mengirimkan pengajuan artikel...');

            try {
                let img = null;
                const fileInput = document.getElementById('f_image');
                if (fileInput?.files?.[0]) {
                    img = await uploadFileMedia('f_image', 'article');
                } else if (appState.editingDraftId) {
                    const existingDraft = appState.articles.find(x => String(x.id) === String(appState.editingDraftId));
                    img = existingDraft?.image_url || 'https://placehold.co/800x450/2563eb/white?text=Artikel+Zeniopost';
                } else if (finalStatus === 'draft') {
                    img = 'https://placehold.co/800x450/64748b/white?text=Draf+Artikel';
                } else {
                    showToast('Pilih file gambar sampul artikel terlebih dahulu.', 'error');
                    if (btn) {
                        btn.innerHTML = '<i class="fas fa-paper-plane mr-1"></i> Ajukan untuk Disetujui Admin';
                        btn.disabled = false;
                    }
                    window.hideLoading();
                    return;
                }

                const combinedAuthor = rawSocial ? `${rawName} ||| ${rawSocial}` : rawName;
                const payload = {
                    title,
                    topic_id: topicId,
                    image_url: img,
                    content: editorData.html,
                    author_name: combinedAuthor,
                    user_id: isLoggedUser ? appState.currentUser.id : null,
                    status: finalStatus,
                    is_official: false,
                    created_at: new Date().toISOString()
                };

                if (appState.editingDraftId) {
                    if (IS_PREVIEW) {
                        const idx = mockArticles.findIndex(x => String(x.id) === String(appState.editingDraftId));
                        if (idx > -1) mockArticles[idx] = { ...mockArticles[idx], ...payload };
                    } else {
                        const { error } = await dbClient.from('articles').update(payload).eq('id', appState.editingDraftId);
                        if (error) throw error;
                    }
                    appState.editingDraftId = null;
                } else {
                    if (IS_PREVIEW) {
                        payload.id = Date.now().toString();
                        mockArticles.unshift(payload);
                    } else {
                        const { error } = await dbClient.from('articles').insert([payload]);
                        if (error) throw error;
                    }
                }

                await fetchData();
                if (finalStatus === 'draft') {
                    showToast('<i class="fas fa-save mr-1"></i> Draf artikel berhasil disimpan di dasbor Anda!', 'success');
                    if (isLoggedUser) {
                        appState.view = 'account';
                        appState.userDashTab = 'drafts';
                    }
                    renderApp();
                } else if (isLoggedUser) {
                    showToast('<i class="fas fa-paper-plane mr-1"></i> Artikel berhasil diajukan! Menunggu persetujuan Admin sebelum dipublikasikan.', 'success');
                    appState.view = 'account';
                    appState.userDashTab = 'articles';
                    renderApp();
                } else {
                    showToast('<i class="fas fa-paper-plane mr-1"></i> Artikel berhasil diajukan! Menunggu persetujuan Admin sebelum dipublikasikan.', 'success');
                    app.navigate('home');
                }
            } catch (err) {
                showToast(err.message || 'Gagal menyimpan artikel.', 'error');
                if (btn) {
                    btn.innerHTML = '<i class="fas fa-paper-plane mr-1"></i> Ajukan untuk Disetujui Admin';
                    btn.disabled = false;
                }
            } finally {

                    showToast('Akun pengguna berhasil dihapus.', 'info');

                    const nextStatus = action === 'approve' ? 'approved' : 'rejected';
                    if (IS_PREVIEW) {

                        const { error } = await dbClient.from('zp_users').update({ status: nextStatus }).eq('id', userId);
                        if (error) throw error;
                    }
                    showToast(nextStatus === 'approved' ? 'Akun pengguna diaktifkan!' : 'Akun pengguna dinonaktifkan.', 'success');

                showToast(err.message || 'Gagal memproses akun pengguna.', 'error');

        };

        window.adminActPasswordReset = async (resetId, nextStatus) => {
            try {
                const targetReset = appState.passwordResets.find(r => String(r.id) === String(resetId));
                if (!targetReset) return;

                const { reqPass, activeGmail, phoneNum } = parseResetRequestData(targetReset);

                if (IS_PREVIEW) {
                    const r = mockPasswordResets.find(x => String(x.id) === String(resetId));
                    if (r) r.status = nextStatus;
                    if (nextStatus === 'approved' && reqPass) {
                        const u = mockUsers.find(x => String(x.id) === String(targetReset.user_id) || (x.email || '').toLowerCase() === (targetReset.email || '').toLowerCase());
                        if (u) u.password_hash = reqPass;
                    }
                } else {
                    const { error } = await dbClient.from('zp_password_resets').update({ status: nextStatus }).eq('id', resetId);
                    if (error) throw error;

                    if (nextStatus === 'approved' && reqPass) {
                        if (targetReset.user_id) {
                            await dbClient.from('zp_users').update({ password_hash: reqPass }).eq('id', targetReset.user_id);
                        } else {
                            await dbClient.from('zp_users').update({ password_hash: reqPass }).eq('email', targetReset.email);
                        }
                    }
                }

                await fetchData();
                renderApp();

                if (nextStatus === 'approved') {
                    if (activeGmail) {
                        const subject = encodeURIComponent('Pemulihan Kata Sandi Akun Zeniopost Anda');
                        const body = encodeURIComponent(
                            `Halo,\n\nPermintaan pemulihan kata sandi untuk akun Zeniopost (${targetReset.email}) telah disetujui oleh Admin Zeniopost.\n\nBerikut detail kata sandi baru Anda:\n• Email Akun: ${targetReset.email}\n• Kata Sandi Baru: ${reqPass}\n• No. Telepon Terdaftar: ${phoneNum || '-'}\n\nSilakan masuk kembali melalui website Zeniopost.\n\nSalam,\nTim Admin Zeniopost`
                        );
                        window.open(`https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(activeGmail)}&su=${subject}&body=${body}`, '_blank', 'noopener,noreferrer');
                    }
                    showToast(`Permintaan disetujui! Kata sandi baru (${reqPass}) telah diaktifkan dan jendela pengiriman Gmail ke ${activeGmail || 'pengguna'} telah dibuka.`, 'success');
                } else {
                    showToast('Permintaan pemulihan sandi ditolak.', 'info');
                }
            } catch (err) {
                showToast(err.message || 'Gagal memproses permintaan sandi.', 'error');
            }

        // Navigasi Utama: Jika pengguna memiliki akun (sudah masuk), fitur "Ajukan Artikel" otomatis diganti Publikasi Pribadi di Dasbor Akun

                    </button>
                    <button onclick="app.navigate('topics')" class="flex items-center gap-3.5 p-3.5 rounded-2xl transition font-bold text-sm ${appState.view === 'topics' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-700 hover:bg-slate-50'}"><i class="fas fa-layer-group w-5"></i> Kategori Topik</button>
                    <button onclick="app.navigate('saved')" class="flex items-center justify-between p-3.5 rounded-2xl transition font-bold text-sm ${appState.view === 'saved' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-700 hover:bg-slate-50'}">

                        <button onclick="app.navigate('account'); window.switchUserDashTab('publish')" class="flex flex-col items-center justify-center w-full space-y-1 ${appState.view === 'account' && appState.userDashTab === 'publish' ? 'text-blue-600' : 'text-slate-400'}"><i class="fas fa-plus-circle text-base"></i><span class="text-[10px] font-bold">Publikasi</span></button>
                    `}
                    <button onclick="app.navigate('saved')" class="relative flex flex-col items-center justify-center w-full space-y-1 ${appState.view === 'saved' ? 'text-blue-600' : 'text-slate-400'}">

            const isGuest = !appState.currentUser;
            const saved = isArticleSaved(a.id);

            return `
                <article onclick="window.openArticlePopup('${a.id}')" class="bg-white rounded-3xl overflow-hidden shadow-sm border border-slate-100 hover-scale cursor-pointer group flex flex-col justify-between min-w-0 w-full">
                    <div>
                        <div class="relative w-full aspect-video overflow-hidden bg-slate-100">
                            <img src="${a.image_url}" alt="${a.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">

                            <button type="button"

                                <span class="text-[10px] font-extrabold">${saved ? 'Tersimpan' : 'Simpan'}</span>

                                <span class="absolute top-3 right-3 bg-blue-600 text-white text-xs font-extrabold px-3.5 py-1 rounded-full shadow-md flex items-center gap-1">

                        <div class="p-4 sm:p-5 pb-3">

                        </div>
                    </div>

                    <div class="px-4 sm:px-5 pb-4 sm:pb-5 pt-3 border-t border-slate-100 mt-2 bg-slate-50/50">

                                </div>
                            </div>
                            <div class="flex items-center gap-1 shrink-0">
                                <span class="bg-white text-slate-600 border border-slate-200/80 px-2 py-1 rounded-xl text-[11px] font-bold flex items-center gap-1 shadow-sm" title="Jumlah Dibaca"><i class="far fa-eye text-blue-600"></i> ${viewCount}</span>
                                <span class="bg-white text-slate-600 border border-slate-200/80 px-2 py-1 rounded-xl text-[11px] font-bold flex items-center gap-1 shadow-sm" title="Jumlah Komentar"><i class="far fa-comment-dots text-slate-500"></i> ${commentCount}</span>
                                <button onclick="event.stopPropagation(); window.shareArticle('${a.id}')" class="bg-white hover:bg-blue-600 text-slate-600 hover:text-white border border-slate-200/80 px-2.5 py-1 rounded-xl text-[11px] font-bold flex items-center transition shadow-sm"><i class="fas fa-share-nodes"></i></button>
                            </div>
                        </div>

            `;
        };

        const filterBySearchAndDate = (list) => {
            const q = (appState.searchQuery || '').trim().toLowerCase();
            const d = (appState.filterDate || '').trim();
            return list.filter(a => {
                const matchTopic = !appState.activeTopicId || String(a.topic_id) === String(appState.activeTopicId);
                const matchTitle = !q || (a.title || '').toLowerCase().includes(q);
                const matchDate = !d || getLocalDateString(a.created_at) === d;
                return matchTopic && matchTitle && matchDate;
            });
        };

        // =====================================================================
        // 17. PEMBANGUN HALAMAN UTAMA (MAIN CONTENT BUILDER)
        // =====================================================================
        const renderArticleFormBlock = (isPersonalPublish = false) => {
            return `
                <form id="public-form" onsubmit="window.submitPublicForm(event, 'pending')" class="space-y-4">
                    <div>
                        <label class="block text-xs font-extrabold text-slate-600 mb-1.5">Judul Berita Utama</label>
                        <input type="text" id="f_title" required placeholder="Ketik judul berita yang menarik dan informatif..." class="w-full p-3.5 sm:p-4 bg-slate-50 border border-slate-200 rounded-2xl font-bold text-sm outline-none focus:border-blue-500">

                        <div id="preview_f" class="w-full aspect-video bg-cover bg-center rounded-2xl border border-slate-200"></div>

                        </button>
                    </div>

                    <div>
                        <label class="block text-xs font-extrabold text-slate-600 mb-1.5">Isi Berita Lengkap (Format Teks, Subjudul, Kutipan & Daftar Bertingkat)</label>
                        ${renderRichTextEditor('f_content', 'Tulis isi berita lengkap di sini... Gunakan tombol di atas untuk memformat teks.')}
                    </div>

                    ${!isPersonalPublish ? `
                        <div>
                            <label class="block text-xs font-extrabold text-slate-600 mb-1.5">Nama Penulis (Tamu)</label>
                            <input type="text" id="f_author" required placeholder="Nama Penulis (Wajib)" class="w-full p-3.5 sm:p-4 bg-slate-50 border border-slate-200 rounded-2xl font-bold text-sm outline-none focus:border-blue-500">
                        </div>
                    ` : `
                        <input type="hidden" id="f_author" value="${(appState.currentUser?.full_name || '').replace(/"/g, '&quot;')}">
                        <div class="p-3.5 rounded-2xl bg-blue-50/70 border border-blue-100 flex items-center justify-between gap-3">
                            <div class="flex items-center gap-3 min-w-0">
                                ${appState.currentUser?.avatar_url ? `
                                    <img src="${appState.currentUser.avatar_url}" class="w-10 h-10 rounded-full aspect-square object-cover border border-blue-200 shrink-0">
                                ` : `
                                    <div class="w-10 h-10 rounded-full bg-blue-600 text-white flex items-center justify-center font-extrabold text-sm shrink-0">${(appState.currentUser?.full_name || 'U').charAt(0).toUpperCase()}</div>
                                `}
                                <div class="min-w-0">
                                    <div class="text-xs font-extrabold text-slate-900 flex items-center gap-1.5 truncate">

                            <i class="fas fa-eye text-blue-600"></i> Pratinjau Berita
                        </button>
                        <button type="button" onclick="window.submitPublicForm(null, 'draft')" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-extrabold py-3.5 px-4 rounded-2xl text-xs md:text-sm flex items-center justify-center gap-2 transition">

                        <button type="submit" id="btn_f" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-extrabold py-3.5 px-4 rounded-2xl shadow-md text-xs md:text-sm flex items-center justify-center gap-2 transition">
                            <i class="fas fa-paper-plane"></i> ${appState.editingDraftId ? 'Perbarui & Ajukan ke Admin' : 'Ajukan untuk Disetujui Admin'}
                        </button>
                    </div>
                </form>
            `;
        };

        const buildMainContent = () => {
            // A. HALAMAN BACA ARTIKEL PENUH (TANPA SPACE KOSONG DI ATAS + GAMBAR 16:9 + IDENTITAS PENULIS)
            if (appState.view === 'article' && appState.readArticle) {
                const a = appState.readArticle;
                if (appState.countedInOpen !== String(a.id)) {
                    appState.countedInOpen = String(a.id);

                const info = parseAuthorInfo(a);
                const saved = isArticleSaved(a.id);

                                    <div>

                        <div class="max-w-sm mx-auto mt-10 md:mt-16 p-8 bg-white rounded-3xl shadow-lg border border-slate-100 animate-fade text-center">

                                                                <i class="fas fa-check mr-1"></i> Terima
                                                            </button>
                                                            <button onclick="window.actArt('${x.id}', 'del')" class="bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 text-xs font-extrabold px-3 py-2 rounded-xl transition">
                                                                Tolak
                                                            </button>
                                                        </div>
                                                    </div>
                                                </div>
                                            `;
                                        }).join('')}
                                    </div>

                                    <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm space-y-3">
                                        <h3 class="font-extrabold text-lg text-slate-900">Artikel Terpublikasi (${approvedArts.length})</h3>
                                        ${approvedArts.map(x => `
                                            <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200 flex flex-wrap sm:flex-nowrap items-center justify-between gap-2">
                                                <span onclick="window.openAdminReviewModal('${x.id}', 'preview')" class="font-bold text-xs md:text-sm text-slate-800 hover:text-blue-600 cursor-pointer truncate">${x.title}</span>
                                                <div class="flex items-center gap-2 shrink-0 ml-auto">
                                                    <span class="text-xs font-extrabold text-blue-600 bg-blue-50 px-2.5 py-1 rounded-lg">${getArticleViews(x)}x dibaca</span>
                                                    <button onclick="window.openAdminReviewModal('${x.id}', 'preview')" class="bg-white hover:bg-blue-50 text-slate-700 border border-slate-200 text-xs font-extrabold px-2.5 py-1 rounded-lg" title="Pratinjau Berita"><i class="fas fa-eye"></i></button>
                                                    <button onclick="window.openAdminReviewModal('${x.id}', 'edit')" class="bg-white hover:bg-blue-50 text-blue-600 border border-slate-200 text-xs font-extrabold px-2.5 py-1 rounded-lg" title="Sunting Teks & Gambar"><i class="fas fa-pen"></i> Sunting</button>
                                                    <button onclick="window.actArt('${x.id}', 'del')" class="text-rose-600 text-xs font-extrabold px-2.5 py-1 rounded-lg hover:bg-rose-50" title="Hapus Artikel"><i class="fas fa-trash"></i></button>
                                                </div>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>

                                <div class="space-y-6">
                                    <!-- Pengaturan Logo Situs Web -->
                                    <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm space-y-4">
                                        <div class="flex items-center justify-between">
                                            <h3 class="font-extrabold text-base text-slate-900 flex items-center gap-2">
                                                <i class="fas fa-image text-blue-600"></i> Pengaturan Logo Situs Web
                                            </h3>
                                            <button type="button" onclick="window.resetDefaultLogoSettings()" class="text-[11px] font-bold text-slate-400 hover:text-blue-600">Atur Ulang</button>
                                        </div>
                                        <div class="p-3.5 rounded-2xl bg-slate-50 border border-slate-200/70 flex items-center justify-center">
                                            <img id="admin_logo_preview_img" src="${getLogoUrl()}" onerror="this.src='${getLogoFallbackUrl()}'" style="height:${appState.logoHeightMobile}px;" class="w-auto max-w-full object-contain block">
                                        </div>
                                        <form onsubmit="window.saveAdminLogoSettings(event)" class="space-y-3">
                                            <div>
                                                <label class="block text-[11px] font-extrabold text-slate-600 mb-1">Unggah File Logo Baru (Opsional)</label>
                                                <input type="file" id="admin_logo_file_input" accept="image/*" onchange="window.previewAdminLogoUpload(event)" class="w-full text-xs bg-slate-50 p-2 rounded-xl border border-slate-200 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-blue-600 file:text-white font-bold">
                                            </div>
                                            <div>
                                                <label class="block text-[11px] font-extrabold text-slate-600 mb-1">Atau Tempel Tautan Gambar Logo</label>
                                                <input type="url" id="admin_logo_url_input" value="${getLogoUrl()}" placeholder="https://..." class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold outline-none focus:border-blue-500">
                                            </div>
                                            <div class="grid grid-cols-2 gap-2.5">
                                                <div>
                                                    <label class="block text-[10px] font-extrabold text-slate-500 mb-1">Tinggi di Ponsel (px)</label>
                                                    <input type="number" id="admin_logo_h_mobile" min="28" max="80" value="${appState.logoHeightMobile}" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-extrabold outline-none focus:border-blue-500">
                                                </div>
                                                <div>
                                                    <label class="block text-[10px] font-extrabold text-slate-500 mb-1">Tinggi di Komputer (px)</label>
                                                    <input type="number" id="admin_logo_h_desktop" min="36" max="110" value="${appState.logoHeightDesktop}" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-extrabold outline-none focus:border-blue-500">
                                                </div>
                                            </div>
                                            <button type="submit" id="btn_save_logo" class="w-full bg-slate-900 hover:bg-blue-600 text-white font-extrabold py-2.5 rounded-xl text-xs transition shadow-sm">
                                                <i class="fas fa-save mr-1"></i> Simpan Logo & Ukuran
                                            </button>
                                        </form>
                                    </div>

                                    <!-- Kelola Kategori -->
                                    <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm space-y-4">
                                        <h3 class="font-extrabold text-base text-slate-900">Kelola Kategori Berita</h3>
                                        <form onsubmit="window.addTopic(event)" class="flex gap-2">
                                            <input type="text" id="new_topic_name" required placeholder="Kategori baru..." class="flex-1 p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold outline-none">
                                            <button type="submit" class="bg-blue-600 text-white font-extrabold px-4 rounded-xl text-xs">Tambah</button>
                                        </form>
                                        <div class="space-y-2">
                                            ${appState.topics.map(t => `
                                                <div class="p-2.5 px-3.5 rounded-xl bg-slate-50 border border-slate-200 flex items-center justify-between text-xs font-extrabold">
                                                    <span>${t.name}</span>
                                                    <button onclick="window.confirmDeleteTopic('${t.id}')" class="text-rose-500 hover:text-rose-700"><i class="fas fa-trash"></i></button>
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>

                                    <!-- Terbitkan Berita Resmi -->
                                    <div class="bg-blue-50 p-6 rounded-3xl border border-blue-100 space-y-3">
                                        <h3 class="font-extrabold text-base text-blue-900">Terbitkan Artikel Resmi</h3>
                                        <form onsubmit="window.submitAdminForm(event)" class="space-y-3">
                                            <input type="text" id="a_title" required placeholder="Judul Berita Resmi" class="w-full p-3 bg-white rounded-xl text-xs font-bold border border-blue-100 outline-none">
                                            <select id="a_topic" required class="w-full p-3 bg-white rounded-xl text-xs font-bold border border-blue-100 outline-none">
                                                <option value="">Pilih Kategori...</option>
                                                ${appState.topics.map(t => `<option value="${t.id}">${t.name}</option>`).join('')}
                                            </select>
                                            <input type="file" id="a_image" accept="image/*" required onchange="window.previewAdminOfficialImage(event)" class="w-full text-xs bg-white p-2 rounded-xl">
                                            <div id="preview_a_wrap" class="hidden relative">
                                                <img id="preview_a_img" src="" class="w-full h-36 object-cover rounded-xl border border-blue-200 bg-white">
                                                <button type="button" onclick="window.clearImageUpload('a_image', null, 'preview_a_wrap')" title="Batalkan Gambar" class="absolute top-2 right-2 w-7 h-7 rounded-full bg-rose-600 hover:bg-rose-700 text-white text-xs flex items-center justify-center shadow">
                                                    <i class="fas fa-times"></i>
                                                </button>
                                            </div>
                                            ${renderRichTextEditor('a_content', 'Tulis berita resmi Zeniopost...', '', 'min-h-[140px]')}
                                            <input type="text" id="a_social" placeholder="Media Sosial (Opsional)" class="w-full p-3 bg-white rounded-xl text-xs font-bold border border-blue-100 outline-none">
                                            <button type="submit" id="btn_a" class="w-full bg-blue-600 text-white font-extrabold py-3 rounded-xl text-xs">Terbitkan Sekarang</button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        `}
                    </div>
                `;
            }

            return '';
        };

        const renderApp = () => {
            const root = document.getElementById('app');
            if (!root) return;
            root.innerHTML = `
                ${renderHeader()}
                <div class="flex w-full max-w-full overflow-x-hidden min-h-[calc(100vh-80px)] md:min-h-[calc(100vh-96px)]">
                    ${renderNav()}
                    <main id="main-content" class="flex-1 min-w-0 w-full max-w-full overflow-x-hidden md:ml-64 pb-24 md:pb-12 relative">${buildMainContent()}</main>
                </div>
            `;
        };

        document.getElementById('modal-container').addEventListener('click', () => window.closeModal());

        const init = async () => {
            renderApp();
            window.showLoading('Memuat berita terkini...');
            try {
                checkDynamicShareEndpoint();
                await autoSetupDatabase();
                if (!IS_PREVIEW && dbClient) {
                    const { data } = await dbClient.auth.getSession();
                    appState.user = data.session?.user || null;
                }
                await fetchData();

                const params = new URLSearchParams(window.location.search);
                const sharedArticleId = params.get('article');
                if (sharedArticleId) {
                    const found = appState.articles.find(x => String(x.id) === String(sharedArticleId));
                    if (found) {
                        app.navigate('article', found);
                        return;
                    }
                }
                renderApp();
            } finally {
                window.hideLoading();
            }
        };

        init();
    </script>

</body></html>
